<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5W-Programm · NalpSolar</title>
<meta name="theme-color" content="#ffffff">
<script src="assets/js/nalp-gate.js"></script>
<style>
  :root{ color-scheme:light; --rot:#D72622; --ink:#1a1a1a; --mut:#63676d; --line:#e3e5e8; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ background:#eef0f3; color:var(--ink); font-family:Arial,"Helvetica Neue",sans-serif;
        display:flex; flex-direction:column; }
  header{ display:flex; align-items:center; gap:12px; flex-wrap:wrap;
          padding:10px 14px; background:#fff; border-bottom:4px solid var(--rot); }
  header a.home{ color:var(--ink); text-decoration:none; font-size:20px; }
  header .logo img{ height:22px; display:block; }
  header h1{ font-size:15.5px; margin:0; flex:1; font-weight:800; white-space:nowrap; }
  .btn{ display:inline-block; border:none; border-radius:6px; padding:9px 13px; font-size:13.5px;
        font-weight:800; cursor:pointer; color:#fff; background:var(--rot); text-decoration:none; }
  .btn.ghost{ background:#fff; color:var(--ink); border:1px solid #c9ccd2; font-weight:700; }
  .viewer{ flex:1; min-height:0; margin:10px; background:#fff; border:1px solid var(--line);
        border-radius:6px; overflow:hidden; }
  iframe{ width:100%; height:100%; border:0; background:#e8ebef; }
</style>
</head>
<body>
<header>
  <a class="home" href="index.html" title="Startseite">🏠</a>
  <div class="logo"><img src="assets/img/strabag-logo.png" alt="STRABAG"></div>
  <h1>🗓 5W-Programm KW 34–38 (Entwurf 14.08.)</h1>
  <a class="btn" href="5W-Programm/Fuenfwochenprogramm_KW34-38_Entwurf.xlsx" download>⬇ Excel</a>
  <a class="btn ghost" href="5W-Programm/Bereichskarte_KW32-36.png" target="_blank">Bereichskarte KW32–36</a>
  <a class="btn ghost" href="begleitplaene.html">Begleitpläne</a>
</header>
<div class="viewer"><iframe id="pdfFrame" title="5W Programm PDF"></iframe></div>
<script>
'use strict';
/* zeigt das PDF aus 5W-Programm/ (Dateiname aus manifest.json) */
fetch('5W-Programm/manifest.json',{cache:'no-store'})
  .then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; })
  .then(function(man){
    var p=man&&(man.pdf||man.file||man.main||man.path);
    document.getElementById('pdfFrame').src='5W-Programm/'+(p||'Fuenfwochenprogramm_KW30-34.pdf');
  });
</script>
</body>
</html>
