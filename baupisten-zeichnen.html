const DB = 'https://highscore-test-2e784-default-rtdb.europe-west1.firebasedatabase.app/erfassung/baupisten_skizze/eingaben';
const $ = id => document.getElementById(id);
$('info').textContent = 'Baupisten 2027 Arbeitsstand · grau = bestehende Strasse (ohne Buchstaben) · Orthofoto ' + D.ortho.s + ' · ✏️ zeichnen, 🔤 Text, dann Senden';

const map = L.map('karte', { zoomControl: true, maxZoom: 22, zoomSnap: 0.25, tap: false });
const swissimage = L.tileLayer('https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.swissimage/default/current/3857/{z}/{x}/{y}.jpeg',
  { maxNativeZoom: 20, maxZoom: 22, attribution: '© swisstopo' }).addTo(map);
const ortho = L.imageOverlay(D.ortho.url, D.ortho.b, { attribution: 'Orthofoto Drohne ' + D.ortho.s }).addTo(map);
L.control.layers(null, { ['Orthofoto ' + D.ortho.s]: ortho }, { position: 'topleft' }).addTo(map);
const FT = { fertig: ['#ffffff', 0.35], bereit: ['#8fd97c', 0.9], bohren: ['#ffd84a', 0.9] };
for (const t of D.tische) {
  L.polygon(t.r, { color: '#333', weight: 0.4, fillColor: FT[t.s][0], fillOpacity: FT[t.s][1], interactive: false }).addTo(map);
}
for (const k of D.kran) {
  L.circle(k.p, { radius: k.r, color: '#e3172b', weight: 1, dashArray: '4 3', fill: false, interactive: false }).addTo(map);
}
for (const r of D.rueck) L.polyline(r, { color: '#777', weight: 2, dashArray: '3 4', interactive: false }).addTo(map);
L.polygon(D.bestand, { color: '#fff', weight: 0.8, fillColor: '#4a4a4a', fillOpacity: 0.95, interactive: false }).addTo(map);
const grenzen = L.latLngBounds([]);
for (const p of D.pisten) {
  const pg = L.polygon(p.r, { color: '#111', weight: 0.8, fillColor: p.f, fillOpacity: 0.95, interactive: false }).addTo(map);
  grenzen.extend(pg.getBounds());
  L.marker(p.m, { interactive: false, icon: L.divIcon({ className: 'buchstabe', iconSize: [30, 30],
    html: '<div style="background:' + p.f + '">' + p.p + '</div>' }) }).addTo(map);
}
map.fitBounds(grenzen.pad(0.08));

// ---------- Zeichnen
let modus = 'verschieben', farbe = '#ff1e1e', striche = [], texte = [], stapel = [], aktiv = null, alteGruppe = null;
const setzeModus = m => {
  modus = m;
  for (const [id, mm] of [['mVerschieben', 'verschieben'], ['mZeichnen', 'zeichnen'], ['mText', 'text']]) $(id).classList.toggle('an', m === mm);
  if (m === 'verschieben') { map.dragging.enable(); document.body.classList.remove('zeichnen'); }
  else { map.dragging.disable(); document.body.classList.add('zeichnen'); }
};
$('mVerschieben').onclick = () => setzeModus('verschieben');
$('mZeichnen').onclick = () => setzeModus('zeichnen');
$('mText').onclick = () => setzeModus('text');
document.querySelectorAll('.farbe').forEach(b => b.onclick = () => {
  farbe = b.dataset.f; document.querySelectorAll('.farbe').forEach(x => x.classList.toggle('an', x === b));
});
const el = map.getContainer();
const ll = e => map.containerPointToLatLng(L.point(e.clientX - el.getBoundingClientRect().left, e.clientY - el.getBoundingClientRect().top));
el.addEventListener('pointerdown', e => {
  if (modus === 'zeichnen') {
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    aktiv = { f: farbe, linie: L.polyline([ll(e)], { color: farbe, weight: 5, opacity: 0.95, lineCap: 'round' }).addTo(map) };
  } else if (modus === 'text') {
    const p = ll(e);
    setTimeout(() => {
      const s = prompt('Text (z. B. E, F, «weg», «Kran hier»):');
      if (s) { const m = L.marker(p, { icon: L.divIcon({ className: 'notiz', iconSize: [0, 0], html: '<div style="color:' + farbe + '">' + s.replace(/</g, '&lt;') + '</div>' }) }).addTo(map);
               texte.push({ p: [+p.lat.toFixed(7), +p.lng.toFixed(7)], s, f: farbe, m }); stapel.push('t'); }
    }, 10);
  }
});
el.addEventListener('pointermove', e => { if (aktiv) { e.preventDefault(); aktiv.linie.addLatLng(ll(e)); } });
const ende = () => { if (aktiv) { if (aktiv.linie.getLatLngs().length > 1) { striche.push(aktiv); stapel.push('s'); } else map.removeLayer(aktiv.linie); aktiv = null; } };
el.addEventListener('pointerup', ende); el.addEventListener('pointercancel', ende);
$('zurueck').onclick = () => {
  const was = stapel.pop();
  if (was === 's') map.removeLayer(striche.pop().linie);
  if (was === 't') map.removeLayer(texte.pop().m);
};

// ---------- Senden
$('senden').onclick = async () => {
  const text = $('text').value.trim();
  if (!striche.length && !texte.length && !text) { alert('Erst zeichnen oder etwas schreiben.'); return; }
  const daten = { t: Date.now(), iso: new Date().toISOString(), text,
    striche: striche.map(s => ({ f: s.f, p: s.linie.getLatLngs().map(q => [+q.lat.toFixed(7), +q.lng.toFixed(7)]) })),
    texte: texte.map(t => ({ p: t.p, s: t.s, f: t.f })),
    ansicht: { c: [+map.getCenter().lat.toFixed(6), +map.getCenter().lng.toFixed(6)], z: map.getZoom() } };
  $('senden').disabled = true; $('senden').textContent = '…';
  try {
    const r = await fetch(DB + '.json', { method: 'POST', body: JSON.stringify(daten) });
    if (!r.ok) throw new Error(r.status);
    $('meldung').style.display = 'block'; setTimeout(() => $('meldung').style.display = 'none', 1800);
    striche.forEach(s => s.linie.setStyle({ dashArray: '6 6' })); striche = []; texte = []; stapel = []; $('text').value = '';
  } catch (err) { alert('Senden fehlgeschlagen: ' + err.message); }
  $('senden').disabled = false; $('senden').textContent = 'Senden';
};

// ---------- Gesendete anzeigen
$('alte').onclick = async () => {
  if (alteGruppe) { map.removeLayer(alteGruppe); alteGruppe = null; $('alte').classList.remove('an'); return; }
  const r = await fetch(DB + '.json?orderBy="$key"&limitToLast=10'); const j = await r.json() || {};
  alteGruppe = L.layerGroup().addTo(map); $('alte').classList.add('an');
  for (const e of Object.values(j)) {
    for (const s of e.striche || []) L.polyline(s.p, { color: s.f, weight: 3, opacity: 0.6, dashArray: '2 5' }).addTo(alteGruppe);
    for (const t of e.texte || []) L.marker(t.p, { icon: L.divIcon({ className: 'notiz', iconSize: [0, 0], html: '<div style="opacity:.7;color:' + t.f + '">' + String(t.s).replace(/</g, '&lt;') + '</div>' }) }).addTo(alteGruppe);
  }
};
