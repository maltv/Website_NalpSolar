<html lang="de">
<head>

<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
html, body { width:100%; height:100%; overflow:hidden; background:#0d1117;
  font-family:-apple-system,'Helvetica Neue',Arial,sans-serif; color:#fff; }

/* ── Loading ─────────────────────────────────────────────── */
#loading {
  position:fixed; inset:0; z-index:500;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  background:radial-gradient(ellipse at center,#0d1f3c 0%,#060b14 100%);
  transition:opacity .8s;
}
#loading.fade { opacity:0; pointer-events:none; }
#loading h1 { font-size:22px; font-weight:800; letter-spacing:.06em; }
#loading h1 span { color:#2196F3; }
#loadTxt { font-size:13px; opacity:.65; text-align:center; max-width:280px; line-height:1.5; }
#loadErr  { font-size:12px; color:#ff6b6b; text-align:center; max-width:300px;
             background:rgba(255,50,50,.1); padding:8px 12px; border-radius:8px; display:none; }
.pb { width:200px; height:4px; background:rgba(255,255,255,.1); border-radius:2px; overflow:hidden; }
.pf { height:100%; width:0%; background:linear-gradient(90deg,#0b5fff,#2196F3);
       border-radius:2px; transition:width .3s; }

/* ── Canvas ─────────────────────────────────────────────── */
#canvas3d { position:fixed; inset:0; }
#canvas3d canvas { display:block; width:100%!important; height:100%!important; }
#lblLayer { position:fixed; inset:0; pointer-events:none; overflow:hidden; }

/* ── Toolbar ─────────────────────────────────────────────── */
#toolbar {
  position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; flex-wrap:wrap; align-items:center; gap:4px; padding:6px 8px;
  background:rgba(5,10,20,.88); backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.07);
}
.tb-btn {
  border:1px solid rgba(255,255,255,.15); border-radius:8px;
  padding:5px 10px; font-size:12px; font-weight:700; cursor:pointer;
  background:rgba(255,255,255,.07); color:#fff; white-space:nowrap;
  transition:background .15s, border-color .15s; -webkit-tap-highlight-color:transparent;
}
.tb-btn:hover  { background:rgba(255,255,255,.16); }
.tb-btn.active { background:#0b5fff; border-color:#2979ff; }
.tb-btn.gps-on { background:#1a6b35; border-color:#2e9e53; }
.sep { width:1px; height:20px; background:rgba(255,255,255,.12); flex-shrink:0; }

/* ── Labels ─────────────────────────────────────────────── */
.lbl {
  background:rgba(0,0,0,.82); color:#fff; font-size:10px; font-weight:700;
  padding:2px 5px; border-radius:4px; white-space:nowrap;
  border:1px solid rgba(255,255,255,.2);
}
.lbl-gps { background:rgba(33,150,243,.9); border-color:#2196F3; font-size:11px; }
.lbl-tisch { background:rgba(255,220,0,.85); color:#111; border-color:#ffd700; font-size:9px; padding:1px 4px; }

/* ── Status bar ─────────────────────────────────────────── */
#statusBar {
  position:fixed; bottom:0; left:0; right:0; z-index:100;
  display:flex; gap:14px; align-items:center; padding:3px 10px;
  background:rgba(5,10,20,.85); font-size:11px;
  color:rgba(255,255,255,.55); border-top:1px solid rgba(255,255,255,.06);
}

/* ── Compass ─────────────────────────────────────────────── */
#compass {
  position:fixed; right:12px; bottom:28px; z-index:99;
  width:44px; height:44px;
  background:rgba(5,10,20,.82); border:1px solid rgba(255,255,255,.14);
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  backdrop-filter:blur(8px);
}
#compassNeedle { transition:transform .2s; }

/* ── Legend ─────────────────────────────────────────────── */
#legend {
  position:fixed; left:10px; bottom:28px; z-index:99;
  background:rgba(5,10,20,.82); border:1px solid rgba(255,255,255,.1);
  border-radius:10px; padding:8px 11px; font-size:11px;
  display:flex; flex-direction:column; gap:4px; backdrop-filter:blur(8px);
}
.leg { display:flex; align-items:center; gap:7px; }
.leg-dot { width:10px; height:10px; border-radius:2px; flex-shrink:0; }

/* ── Long-press hint ─────────────────────────────────────── */
#orbitHint {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  z-index:200; background:rgba(255,200,0,.9); color:#000;
  padding:8px 16px; border-radius:20px; font-size:13px; font-weight:700;
  pointer-events:none; opacity:0; transition:opacity .3s;
}
#orbitHint.show { opacity:1; }

/* ── AR Mode ─────────────────────────────────────────────── */
#arOverlay {
  display:none; position:fixed; inset:0; z-index:150; pointer-events:none;
}
#arExitBtn {
  position:absolute; top:52px; right:8px; pointer-events:auto;
  background:rgba(180,0,0,.85); color:#fff; border:none; border-radius:20px;
  padding:8px 18px; font-size:13px; font-weight:800; cursor:pointer;
  backdrop-filter:blur(8px); -webkit-tap-highlight-color:transparent;
}
#arInfo {
  position:absolute; bottom:72px; left:0; right:0;
  display:flex; justify-content:center;
}
#arInfo span {
  background:rgba(0,0,0,.72); color:#fff; padding:7px 16px;
  border-radius:20px; font-size:12px; text-align:center; line-height:1.5;
  backdrop-filter:blur(6px);
}
#arGpsInfo {
  position:absolute; top:52px; left:8px; pointer-events:none;
  background:rgba(0,0,0,.65); color:#2196F3; padding:5px 10px;
  border-radius:10px; font-size:11px; font-weight:700;
  backdrop-filter:blur(6px);
}
#arResetBtn {
  position:absolute; top:90px; left:8px; pointer-events:auto;
  background:rgba(0,0,0,.7); color:#ffd700; border:1px solid rgba(255,215,0,.4);
  border-radius:14px; padding:6px 12px; font-size:11px; font-weight:700;
  cursor:pointer; backdrop-filter:blur(6px); -webkit-tap-highlight-color:transparent;
}
#arAdjust {
  position:absolute; top:90px; right:8px; pointer-events:none;
  background:rgba(0,0,0,.7); color:#ffd700; padding:6px 11px;
  border-radius:14px; font-size:12px; font-weight:800; letter-spacing:.02em;
  backdrop-filter:blur(6px); font-variant-numeric:tabular-nums;
}
/* Canvas transparent in AR mode */
body.ar-mode #canvas3d { background:transparent!important; }
body.ar-mode #canvas3d canvas { background:transparent!important; }
body.ar-mode { background:transparent!important; }
</style>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════
   COORDINATE SYSTEM: Standard Three.js Y-UP
   LV95 → Scene:  X = East-OE,  Y = Elev-OZ,  Z = -(North-ON)
═══════════════════════════════════════════════════════════ */
var OE = 2701555, ON = 1165641, OZ = 1950;
var EXTENT = 700;   // ±700m covers full IFC extent (North goes to +535m)
var GRID   = 64;

var IFC = [
  { slot:'wl',    base:'uploads/ifc/werkleitungen',
    col:[0,0.6,1], emissive:[0,0.2,0.5] },       // electric blue
  { slot:'erdung', base:'uploads/ifc/erdung',
    col:[1,0.55,0], emissive:[0.4,0.15,0] }       // glowing orange
];

// WMS BBOX for satellite texture
var BBOX = (OE-EXTENT)+','+(ON-EXTENT)+','+(OE+EXTENT)+','+(ON+EXTENT);
var WMS_SAT = 'https://wms.geo.admin.ch/?SERVICE=WMS&REQUEST=GetMap&VERSION=1.3.0'
            + '&LAYERS=ch.swisstopo.swissimage&STYLES=&CRS=EPSG:2056'
            + '&WIDTH=2048&HEIGHT=2048&FORMAT=image/jpeg&BBOX='+BBOX;

/* ── Globals ─────────────────────────────────────────────── */
var scene, camera, renderer, controls, lblRenderer, clock;
var layers={}, allLbls=[], labelsOn=false;
var terrainMesh=null, satTex=null, terrainOn=true, satOn=true;
var gpsGroup=null, gpsWid=null, gpsOn=false;
var tischeGroup=null, tischeLbls=[], tischeOn=true;
var flyDone=false, flyT=0;
var camP0=new THREE.Vector3(), camT0=new THREE.Vector3();
var camP1=new THREE.Vector3(), camT1=new THREE.Vector3();
var frameN=0, raycaster=new THREE.Raycaster();
var orbitMarker=null, longTimer=null, longPos=null;

/* AR state */
var arActive=false, arStream=null, arGpsWid=null, arVideo=null;
var arPos=null, arHasAbsOri=false;
var arOri={alpha:0,beta:0,gamma:0};
var arQ1=new THREE.Quaternion(-Math.sqrt(0.5),0,0,Math.sqrt(0.5));
var arZee=new THREE.Vector3(0,0,1);
var arQ0=new THREE.Quaternion();
var arEul=new THREE.Euler();

/* AR manual calibration (PeakFinder-style finger alignment) */
var arYawOffset=0;                          // rad, heading correction (1-finger drag)
var arPosOffset=new THREE.Vector3(0,0,0);   // scene shift in m (2-finger drag)
var arUp=new THREE.Vector3(0,1,0);
var arYawQuat=new THREE.Quaternion();
var arDrag=null;                            // active touch gesture state

/* ── DOM ─────────────────────────────────────────────────── */
function pct(p){ document.getElementById('progress').style.width=p+'%'; }
function txt(t){ document.getElementById('loadTxt').textContent=t; }
function showErr(m){
  var e=document.getElementById('loadErr');
  e.style.display='block'; e.textContent='⚠ '+m;
  document.querySelector('.pf').style.background='#c0392b';
}

/* ── WGS84 → scene ──────────────────────────────────────── */
function gpsToScene(lat,lon,alt){
  var phi=lat*3600, lam=lon*3600;
  var p=(phi-169028.66)/10000, l=(lam-26782.5)/10000;
  var E=2600072.37+211455.93*l-10938.51*l*p-0.36*l*p*p-44.54*l*l*l;
  var N=1200147.07+308807.95*p+3745.25*l*l+76.63*p*p-194.56*l*l*p+119.79*p*p*p;
  return new THREE.Vector3(E-OE, (alt||OZ)-OZ, -(N-ON));
}

/* ── Terrain mesh ────────────────────────────────────────── */
async function loadTerrain(){
  txt('Lade Terrain …'); pct(15);
  var r=await fetch('uploads/terrain/terrain.json');
  if(!r.ok) throw new Error('terrain.json '+r.status);
  var td=await r.json();
  var G=td.grid, ext=td.extent;

  var pos=new Float32Array(G*G*3);
  var uv =new Float32Array(G*G*2);
  for(var row=0;row<G;row++){
    for(var col=0;col<G;col++){
      var i=row*G+col;
      pos[i*3]   = -ext + col*2*ext/(G-1);      // East
      pos[i*3+1] = td.heights[i] - OZ;           // Y = elevation
      pos[i*3+2] = ext - row*2*ext/(G-1);         // Z = -(North)
      uv [i*2]   = col/(G-1);                    // U: West→East
      uv [i*2+1] = row/(G-1);                    // V: South→North
    }
  }
  var idx=new Uint32Array((G-1)*(G-1)*6), ip=0;
  for(var row=0;row<G-1;row++) for(var col=0;col<G-1;col++){
    var a=row*G+col, b=a+1, c=(row+1)*G+col, d=c+1;
    idx[ip++]=a; idx[ip++]=b; idx[ip++]=c;
    idx[ip++]=b; idx[ip++]=d; idx[ip++]=c;
  }
  var geom=new THREE.BufferGeometry();
  geom.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geom.setAttribute('uv',      new THREE.BufferAttribute(uv,2));
  geom.setIndex(new THREE.BufferAttribute(idx,1));
  geom.computeVertexNormals();

  var mat=new THREE.MeshPhongMaterial({
    color:0x9acc9a, transparent:true, opacity:0.60,
    side:THREE.DoubleSide, specular:0x223322, shininess:5, depthWrite:false
  });
  terrainMesh=new THREE.Mesh(geom,mat);
  terrainMesh.renderOrder=10;
  scene.add(terrainMesh);

  // Load satellite texture
  txt('Lade Satellitenbild …'); pct(42);
  var loader=new THREE.TextureLoader();
  loader.crossOrigin='anonymous';
  loader.load(WMS_SAT,
    function(tex){
      satTex=tex;
      tex.wrapS=tex.wrapT=THREE.ClampToEdgeWrapping;
      terrainMesh.material.map=tex;
      terrainMesh.material.color.set(0xffffff);
      terrainMesh.material.needsUpdate=true;
    },
    undefined,
    function(e){ console.warn('WMS failed',e); }
  );
}

/* ── IFC geometry ────────────────────────────────────────── */
async function loadLayer(cfg){
  txt('Lade '+cfg.slot+' …');
  var mr=await fetch(cfg.base+'.meta.json');
  if(!mr.ok) return null;
  var meta=await mr.json();

  var bufs=await Promise.all([
    fetch(cfg.base+'.v.bin').then(function(r){ if(!r.ok) throw new Error(r.status); return r.arrayBuffer(); }),
    fetch(cfg.base+'.f.bin').then(function(r){ if(!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
  ]);

  // Raw: [East-OE, North-ON, Elev-OZ]  →  Y-up: [East-OE, Elev-OZ, -(North-ON)]
  var raw=new Float32Array(bufs[0]);
  var verts=new Float32Array(raw.length);
  for(var i=0;i<raw.length;i+=3){
    verts[i]   = raw[i];      // X: East
    verts[i+1] = raw[i+2];   // Y: elevation
    verts[i+2] = -raw[i+1];  // Z: -(North)
  }
  var idxs=new Uint32Array(bufs[1]);
  var geom=new THREE.BufferGeometry();
  geom.setAttribute('position',new THREE.BufferAttribute(verts,3));
  geom.setIndex(new THREE.BufferAttribute(idxs,1));

  var c=meta.color||cfg.col, e=cfg.emissive||[0,0,0];
  var mat=new THREE.MeshPhongMaterial({
    color:    new THREE.Color(c[0],c[1],c[2]),
    emissive: new THREE.Color(e[0],e[1],e[2]),
    flatShading:true, specular:0x333333, shininess:40,
    side:THREE.DoubleSide
  });
  var mesh=new THREE.Mesh(geom,mat);
  scene.add(mesh);
  layers[cfg.slot]=mesh;

  (meta.labels||[]).forEach(function(lbl){
    var div=document.createElement('div');
    div.className='lbl'; div.textContent=lbl.t;
    var obj=new THREE.CSS2DObject(div);
    obj.position.set(lbl.x, lbl.z+4, -lbl.y);
    obj.visible=false; scene.add(obj); allLbls.push(obj);
  });
  console.info(cfg.slot+': '+meta.vCount+'v '+meta.fCount+'f '+(meta.labels||[]).length+'lbl');
  return mesh;
}

/* ── Modultische ─────────────────────────────────────────── */
async function loadTische(){
  txt('Lade Modultische …');
  var r=await fetch('uploads/tables/modultische.json');
  if(!r.ok) return;
  var data=await r.json();

  var geomA=new THREE.BoxGeometry(10.007,0.25,3);
  var geomB=new THREE.BoxGeometry(12.394,0.25,3);

  var panelMat=new THREE.MeshPhongMaterial({
    color:0x2266cc, emissive:0x001144, specular:0x5599ff, shininess:80,
    transparent:true, opacity:0.50, side:THREE.DoubleSide, depthWrite:true
  });
  var legMat=new THREE.MeshPhongMaterial({color:0x777777, emissive:0x222222, shininess:30});
  var legGeom=new THREE.CylinderGeometry(0.07,0.07,1,6);  // unit-length, scaled per leg

  tischeGroup=new THREE.Group();
  tischeGroup.renderOrder=5;
  tischeLbls=[];

  // Rotation: Ry(-az) * Rx(-60°)
  // Panel normal faces az-direction (tilted 60° from horizontal)
  // Front (lower) edge = local -Z side
  var TILT=60*Math.PI/180;
  var ct=Math.cos(TILT), st=Math.sin(TILT);  // ct=0.5, st=0.866
  var rotM=new THREE.Matrix4();
  var tmpQ=new THREE.Quaternion();
  var downDir=new THREE.Vector3(0,-1,0);

  data.forEach(function(t){
    var id=t[0],E=t[1],N=t[2],Z=t[3],az=t[4],len=t[5];
    var azR=az*Math.PI/180;
    var ca=Math.cos(azR), sa=Math.sin(azR);
    // Lift center +2m so lower edge clears terrain (~0.65m stub legs)
    var px=E-OE, py=Z-OZ+2.0, pz=-(N-ON);

    // Rotation matrix M = Ry(-az)*Rx(-60°)
    // Col X (long axis):   (ca, 0, sa)
    // Col Y (panel normal):(sa*st, ct, -ca*st)
    // Col Z (upper/back):  (-sa*ct, st, ca*ct)
    rotM.set(
      ca,   sa*st, -sa*ct, 0,
      0,    ct,     st,    0,
      sa,  -ca*st,  ca*ct, 0,
      0,    0,      0,     1
    );
    tmpQ.setFromRotationMatrix(rotM);

    var mesh=new THREE.Mesh(len<11?geomA:geomB, panelMat);
    mesh.position.set(px,py,pz);
    mesh.quaternion.copy(tmpQ);
    tischeGroup.add(mesh);

    // Two legs at front (lower) edge corners: local (±len/2, -0.125, -1.5)
    var half=len/2;
    [[half,-0.125,-1.5],[-half,-0.125,-1.5]].forEach(function(lc){
      // Transform corner to world space
      var wc=new THREE.Vector3(lc[0],lc[1],lc[2]).applyMatrix4(rotM)
              .add(new THREE.Vector3(px,py,pz));
      if(!terrainMesh) return;
      // Raycast down to terrain
      var orig=new THREE.Vector3(wc.x, wc.y+15, wc.z);
      var ray=new THREE.Raycaster(orig, downDir);
      var hits=ray.intersectObject(terrainMesh);
      if(!hits.length) return;
      var gY=hits[0].point.y;
      var legLen=wc.y-gY;
      if(legLen<0.1||legLen>25) return;
      // Scaled cylinder
      var leg=new THREE.Mesh(legGeom, legMat);
      leg.position.set(wc.x, gY+legLen/2, wc.z);
      leg.scale.y=legLen;
      tischeGroup.add(leg);
    });

    // ID label above panel center
    var div=document.createElement('div');
    div.className='lbl lbl-tisch'; div.textContent=id;
    var lbl=new THREE.CSS2DObject(div);
    lbl.position.set(px, py+2, pz);
    scene.add(lbl); tischeLbls.push(lbl);
  });

  scene.add(tischeGroup);
  console.info('Modultische: '+data.length+' (mit Beinen)');
}

window.toggleTische=function(){
  tischeOn=!tischeOn;
  if(tischeGroup) tischeGroup.visible=tischeOn;
  tischeLbls.forEach(function(l){l.visible=tischeOn;});
  document.getElementById('btnTische').classList.toggle('active',tischeOn);
};

/* ── GPS marker ──────────────────────────────────────────── */
function mkGps(){
  var g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(2.5,16,12),
    new THREE.MeshPhongMaterial({color:0x2196F3,emissive:0x0b4fa0,shininess:60})));
  var ring=new THREE.Mesh(new THREE.RingGeometry(4,6.5,32),
    new THREE.MeshBasicMaterial({color:0x2196F3,transparent:true,opacity:.5,side:THREE.DoubleSide}));
  ring.rotation.x=-Math.PI/2;
  g.add(ring);
  var d=document.createElement('div'); d.className='lbl lbl-gps'; d.textContent='📍 Mein Standort';
  var lbl=new THREE.CSS2DObject(d); lbl.position.set(0,10,0); g.add(lbl);
  return g;
}

/* ── Toggle UI ───────────────────────────────────────────── */
window.toggleTerrain=function(){
  terrainOn=!terrainOn; if(terrainMesh) terrainMesh.visible=terrainOn;
  document.getElementById('btnTerrain').classList.toggle('active',terrainOn);
};
window.toggleSat=function(){
  satOn=!satOn;
  if(terrainMesh){
    terrainMesh.material.map=satOn&&satTex?satTex:null;
    terrainMesh.material.color.set(satOn&&satTex?0xffffff:0x9acc9a);
    terrainMesh.material.needsUpdate=true;
  }
  document.getElementById('btnSat').classList.toggle('active',satOn);
};
window.toggleLayer=function(slot){
  var m=layers[slot]; if(!m) return;
  m.visible=!m.visible;
  document.getElementById(slot==='wl'?'btnWL':'btnErdung').classList.toggle('active',m.visible);
};
window.toggleLabels=function(){
  labelsOn=!labelsOn; allLbls.forEach(function(l){l.visible=labelsOn;});
  document.getElementById('btnLabels').classList.toggle('active',labelsOn);
};
window.toggleGps=function(){
  var btn=document.getElementById('btnGps');
  if(gpsOn){
    if(gpsWid!=null) navigator.geolocation.clearWatch(gpsWid);
    if(gpsGroup){scene.remove(gpsGroup);gpsGroup=null;}
    gpsOn=false; btn.classList.remove('gps-on');
    document.getElementById('sGps').textContent='GPS: inaktiv'; return;
  }
  if(!navigator.geolocation){alert('Kein GPS');return;}
  gpsOn=true; btn.classList.add('gps-on');
  gpsWid=navigator.geolocation.watchPosition(
    function(p){
      var s=gpsToScene(p.coords.latitude,p.coords.longitude,null);
      // Snap to terrain surface (GPS altitude is unreliable, use terrain mesh)
      if(terrainMesh){
        var tr=new THREE.Raycaster(new THREE.Vector3(s.x,500,s.z),new THREE.Vector3(0,-1,0));
        var th=tr.intersectObject(terrainMesh);
        if(th.length) s.y=th[0].point.y+1.5;
      }
      if(!gpsGroup){gpsGroup=mkGps();scene.add(gpsGroup);}
      gpsGroup.position.copy(s);
      document.getElementById('sGps').textContent=
        p.coords.latitude.toFixed(5)+'°N  '+p.coords.longitude.toFixed(5)+'°E  ±'+
        Math.round(p.coords.accuracy)+'m';
    },
    function(e){document.getElementById('sGps').textContent='GPS: '+e.message;},
    {enableHighAccuracy:true,timeout:30000,maximumAge:5000}
  );
};
window.resetCam=function(){
  camera.position.copy(camP1); controls.target.copy(camT1); controls.update();
};

/* ── Long-press → set orbit target ──────────────────────── */
function setOrbitTarget(clientX,clientY){
  var rect=renderer.domElement.getBoundingClientRect();
  var mouse=new THREE.Vector2(
    ((clientX-rect.left)/rect.width)*2-1,
    -((clientY-rect.top)/rect.height)*2+1
  );
  raycaster.setFromCamera(mouse,camera);
  var objects=[]; if(terrainMesh) objects.push(terrainMesh);
  Object.values(layers).forEach(function(m){objects.push(m);});
  var hits=raycaster.intersectObjects(objects);
  if(!hits.length) return;
  var pt=hits[0].point;
  controls.target.copy(pt); controls.update();
  // Orbit marker
  if(!orbitMarker){
    orbitMarker=new THREE.Mesh(
      new THREE.SphereGeometry(2.5,10,8),
      new THREE.MeshBasicMaterial({color:0xffcc00})
    );
    scene.add(orbitMarker);
  }
  orbitMarker.position.copy(pt); orbitMarker.visible=true;
  var hint=document.getElementById('orbitHint');
  hint.classList.add('show');
  if(navigator.vibrate) navigator.vibrate(60);
  setTimeout(function(){orbitMarker.visible=false; hint.classList.remove('show');},1800);
}

function bindLongPress(el){
  el.addEventListener('touchstart',function(e){
    if(arActive){clearTimeout(longTimer);return;}   // AR uses finger drag for alignment
    if(e.touches.length!==1){clearTimeout(longTimer);return;}
    var t=e.touches[0]; longPos={x:t.clientX,y:t.clientY};
    longTimer=setTimeout(function(){if(longPos) setOrbitTarget(longPos.x,longPos.y);},550);
  },{passive:true});
  el.addEventListener('touchmove',function(e){
    if(longPos&&e.touches.length){
      var t=e.touches[0];
      var d=Math.hypot(t.clientX-longPos.x,t.clientY-longPos.y);
      if(d>8){clearTimeout(longTimer);longPos=null;}
    }
  },{passive:true});
  el.addEventListener('touchend',function(){clearTimeout(longTimer);longPos=null;},{passive:true});
  el.addEventListener('touchcancel',function(){clearTimeout(longTimer);longPos=null;},{passive:true});
}

/* ── AR Mode ─────────────────────────────────────────────── */
function onAROrientation(e){
  // Prefer absolute orientation (Android); fall back to deviceorientation with iOS webkitCompassHeading
  if(e.type==='deviceorientationabsolute') arHasAbsOri=true;
  else if(arHasAbsOri) return;

  if(!arHasAbsOri && e.webkitCompassHeading!=null){
    // iOS: webkitCompassHeading = clockwise from north; alpha is also clockwise in absolute mode
    arOri.alpha = e.webkitCompassHeading;
  } else {
    arOri.alpha = e.alpha||0;
  }
  arOri.beta  = e.beta||0;
  arOri.gamma = e.gamma||0;
}

/* ── AR manual alignment (finger drag, PeakFinder-style) ─── */
function arMid(t){ return {x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2}; }

function arShowAdjust(){
  var deg=(arYawOffset*180/Math.PI)%360;
  if(deg>180) deg-=360; if(deg<-180) deg+=360;
  var d=Math.hypot(arPosOffset.x,arPosOffset.z);
  var el=document.getElementById('arAdjust');
  if(el) el.textContent='↻ '+deg.toFixed(0)+'°   ⇄ '+d.toFixed(1)+' m';
}

function arSaveCalib(){
  try{ localStorage.setItem('arCalib',
    JSON.stringify({y:arYawOffset,px:arPosOffset.x,py:arPosOffset.y,pz:arPosOffset.z})); }catch(e){}
}
function arLoadCalib(){
  try{
    var s=JSON.parse(localStorage.getItem('arCalib'));
    if(s){ arYawOffset=s.y||0; arPosOffset.set(s.px||0,s.py||0,s.pz||0); }
  }catch(e){}
}
window.arResetCalib=function(){
  arYawOffset=0; arPosOffset.set(0,0,0); arSaveCalib(); arShowAdjust();
  if(navigator.vibrate) navigator.vibrate(40);
};

function arTouchStart(e){
  if(!arActive) return;
  if(e.touches.length===1){
    arDrag={mode:'yaw', x:e.touches[0].clientX, y:e.touches[0].clientY};
  } else if(e.touches.length>=2){
    var m=arMid(e.touches);
    arDrag={mode:'pan', x:m.x, y:m.y};
  } else { arDrag=null; }
}
function arTouchMove(e){
  if(!arActive||!arDrag) return;
  if(arDrag.mode==='yaw' && e.touches.length===1){
    e.preventDefault();
    var dx=e.touches[0].clientX-arDrag.x;
    arDrag.x=e.touches[0].clientX; arDrag.y=e.touches[0].clientY;
    arYawOffset += dx*0.0040;                 // ~0.23°/px heading correction
    arSaveCalib(); arShowAdjust();
  } else if(arDrag.mode==='pan' && e.touches.length>=2){
    e.preventDefault();
    var m=arMid(e.touches);
    var dx=m.x-arDrag.x, dy=m.y-arDrag.y;
    arDrag.x=m.x; arDrag.y=m.y;
    // Move the model with the finger (grab-world): camera shifts opposite
    var fwd=new THREE.Vector3(); camera.getWorldDirection(fwd); fwd.y=0;
    if(fwd.lengthSq()<1e-6) fwd.set(0,0,-1);
    fwd.normalize();
    var right=new THREE.Vector3().crossVectors(fwd,arUp).normalize();
    var k=0.06;                               // m per pixel
    arPosOffset.addScaledVector(right, -dx*k);
    arPosOffset.addScaledVector(fwd,    dy*k);
    arSaveCalib(); arShowAdjust();
  }
}
function arTouchEnd(e){
  if(!e.touches || e.touches.length===0){ arDrag=null; return; }
  if(e.touches.length===1) arDrag={mode:'yaw', x:e.touches[0].clientX, y:e.touches[0].clientY};
}

window.toggleAR=function(){
  if(arActive) stopAR(); else startAR();
};

async function startAR(){
  // iOS 13+ requires explicit permission for DeviceOrientationEvent
  if(typeof DeviceOrientationEvent!=='undefined' &&
     typeof DeviceOrientationEvent.requestPermission==='function'){
    try{
      var p=await DeviceOrientationEvent.requestPermission();
      if(p!=='granted'){ alert('AR benötigt Zugriff auf Geräteausrichtung (Einstellungen → Safari → Bewegung & Ausrichtung).'); return; }
    }catch(e){ console.warn('DeviceOrientation permission error',e); }
  }

  // Rear camera
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    alert('Kamerazugriff wird von diesem Browser nicht unterstützt.'); return;
  }
  try{
    arStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'environment', width:{ideal:1920}, height:{ideal:1080}},
      audio:false
    });
  }catch(e){
    alert('Kamerazugriff verweigert. AR benötigt die hintere Kamera.'); return;
  }

  // Video element — inserted as first child of body, behind everything
  if(!arVideo){
    arVideo=document.createElement('video');
    arVideo.autoplay=true; arVideo.muted=true; arVideo.playsInline=true;
    arVideo.setAttribute('playsinline','');
    arVideo.setAttribute('webkit-playsinline','');
    arVideo.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;'
      +'object-fit:cover;z-index:-1;pointer-events:none;background:#000;';
    document.body.prepend(arVideo);
  }
  arVideo.srcObject=arStream;
  arVideo.style.display='block';
  try{ await arVideo.play(); }catch(e){ console.warn('AR video play:',e); }

  // Transparent Three.js background
  scene.background=null;
  scene.fog=null;
  renderer.setClearColor(0x000000,0);
  renderer.setClearAlpha(0);
  document.body.classList.add('ar-mode');
  // canvas3d sits above video (z-index 0 = auto stacking above z-index -1)
  document.getElementById('canvas3d').style.zIndex='0';

  // Hide terrain (real world is the background)
  if(terrainMesh) terrainMesh.visible=false;

  // FOV: typical phone rear camera ~60-70°
  camera.fov=67; camera.updateProjectionMatrix();

  // GPS for position tracking — snap to terrain (GPS altitude unreliable)
  if(navigator.geolocation){
    arGpsWid=navigator.geolocation.watchPosition(function(pos){
      var s=gpsToScene(pos.coords.latitude, pos.coords.longitude, null);
      if(terrainMesh){
        var tr=new THREE.Raycaster(new THREE.Vector3(s.x,500,s.z),new THREE.Vector3(0,-1,0));
        var th=tr.intersectObject(terrainMesh);
        if(th.length) s.y=th[0].point.y; // terrain height (eye offset +1.6m added in animate)
      }
      arPos=s;
      var acc=Math.round(pos.coords.accuracy);
      document.getElementById('arGpsInfo').textContent='GPS ±'+acc+'m';
    },function(err){
      document.getElementById('arGpsInfo').textContent='GPS: '+err.message;
    },{enableHighAccuracy:true,timeout:30000,maximumAge:2000});
  }

  // Device orientation listeners
  arHasAbsOri=false;
  window.addEventListener('deviceorientationabsolute',onAROrientation,true);
  window.addEventListener('deviceorientation',onAROrientation,true);

  // Disable orbit controls; stop fly-in
  controls.enabled=false;
  flyDone=true;

  arActive=true;
  arLoadCalib(); arShowAdjust();
  document.getElementById('btnAR').classList.add('active');
  document.getElementById('arOverlay').style.display='block';
}

function stopAR(){
  if(!arActive) return;

  // Stop camera stream
  if(arStream){ arStream.getTracks().forEach(function(t){t.stop();}); arStream=null; }
  if(arVideo){ arVideo.srcObject=null; arVideo.style.display='none'; }

  // Restore Three.js scene
  scene.background=new THREE.Color(0x0d1525);
  scene.fog=new THREE.Fog(0x0d1525,600,3500);
  renderer.setClearColor(0x0d1525,1);
  document.body.classList.remove('ar-mode');
  document.getElementById('canvas3d').style.zIndex='';
  if(terrainMesh) terrainMesh.visible=terrainOn;

  camera.fov=50; camera.updateProjectionMatrix();

  if(arGpsWid!==null){ navigator.geolocation.clearWatch(arGpsWid); arGpsWid=null; }

  window.removeEventListener('deviceorientationabsolute',onAROrientation,true);
  window.removeEventListener('deviceorientation',onAROrientation,true);

  controls.enabled=true;
  // Reset internal OrbitControls state to match current camera
  controls.target.copy(camT1);
  controls.update();
  arActive=false; arPos=null;
  document.getElementById('btnAR').classList.remove('active');
  document.getElementById('arOverlay').style.display='none';
  resetCam();
}

/* ── AR Test (fixer Standort im Perimeter) ───────────────── */
window.startARTest=async function(){
  await startAR();
  // Test-Position: Mitte der Modultische-Zone
  // LV95 E=2701700, N=1166000 → scene x=145, z=-359
  var tx=2701700-OE, tz=-(1166000-ON), ty=0;
  if(terrainMesh){
    var tr=new THREE.Raycaster(new THREE.Vector3(tx,500,tz),new THREE.Vector3(0,-1,0));
    var th=tr.intersectObject(terrainMesh);
    if(th.length) ty=th[0].point.y;
  }
  arPos=new THREE.Vector3(tx,ty,tz);
  document.getElementById('arGpsInfo').textContent=
    '🧪 Test: E 2701700 / N 1166000';
};

/* ── Resize ──────────────────────────────────────────────── */
function resize(){
  var c=document.getElementById('canvas3d');
  var w=c.clientWidth, h=c.clientHeight;
  if(!w||!h) return;
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h); lblRenderer.setSize(w,h);
}

/* ── Fly-in ──────────────────────────────────────────────── */
function easeIO(t){ return t<.5?2*t*t:-1+(4-2*t)*t; }

function startFlyIn(box){
  var c=box.getCenter(new THREE.Vector3());
  var s=box.getSize(new THREE.Vector3());
  var d=Math.max(s.x,s.z,80)*1.5;

  // Start high oblique
  camP0.set(c.x+8, d*3.5, c.z+d*1.5);
  camT0.copy(c);
  // End: nice 3/4 view from south-east
  camP1.set(c.x+d*.35, d*.9, c.z+d*1.15);
  camT1.copy(c);

  camera.position.copy(camP0);
  controls.target.copy(camT0);
  controls.update();
  flyT=0; flyDone=false;
}

/* ── Compass ─────────────────────────────────────────────── */
function updateCompass(){
  var dir=new THREE.Vector3();
  camera.getWorldDirection(dir);
  var az=-Math.atan2(dir.x,-dir.z)*180/Math.PI;
  document.getElementById('compassNeedle').style.transform='rotate('+az.toFixed(1)+'deg)';
}

/* ── Animation loop ──────────────────────────────────────── */
function animate(){
  requestAnimationFrame(animate);
  frameN++;

  // GPS ring pulse
  if(gpsGroup&&gpsGroup.children[1]){
    var t=clock.getElapsedTime();
    var ring=gpsGroup.children[1];
    var s=1+.3*Math.abs(Math.sin(t*1.8));
    ring.scale.set(s,s,s);
    ring.material.opacity=.3+.3*Math.abs(Math.sin(t*1.8));
  }

  // Fly-in
  if(!flyDone){
    flyT=Math.min(1,flyT+0.004);
    var tt=easeIO(flyT);
    camera.position.lerpVectors(camP0,camP1,tt);
    controls.target.lerpVectors(camT0,camT1,tt);
    if(flyT>=1) flyDone=true;
  }

  // AR camera: position from GPS (snapped to terrain), rotation from device orientation
  if(arActive){
    if(arPos){
      camera.position.set(arPos.x+arPosOffset.x, arPos.y+1.6+arPosOffset.y, arPos.z+arPosOffset.z);
    } else {
      // No GPS yet — stay at scene center at terrain level, show hint
      if(terrainMesh && frameN%90===0){
        document.getElementById('arGpsInfo').textContent='GPS: warte auf Signal …';
      }
    }
    // DeviceOrientationControls quaternion formula (Three.js standard)
    var _a=THREE.MathUtils.degToRad(arOri.alpha);
    var _b=THREE.MathUtils.degToRad(arOri.beta);
    var _g=THREE.MathUtils.degToRad(arOri.gamma);
    var _o=THREE.MathUtils.degToRad(
      window.screen&&window.screen.orientation
        ? window.screen.orientation.angle
        : (window.orientation||0)
    );
    arEul.set(_b,_a,-_g,'YXZ');
    camera.quaternion.setFromEuler(arEul);
    camera.quaternion.multiply(arQ1);
    arQ0.setFromAxisAngle(arZee,-_o);
    camera.quaternion.multiply(arQ0);
    // Manual heading correction (compass often unreliable) — world-space yaw
    if(arYawOffset!==0){
      arYawQuat.setFromAxisAngle(arUp,arYawOffset);
      camera.quaternion.premultiply(arYawQuat);
    }
  }

  // OrbitControls must NOT run in AR (would override camera position/rotation)
  if(!arActive) controls.update();
  updateCompass();

  // Elevation at target
  if(frameN%30===0){
    var elev=Math.round(controls.target.y+OZ);
    document.getElementById('sAlt').textContent='⛰ '+elev+' m ü.M.';
  }

  renderer.render(scene,camera);
  lblRenderer.render(scene,camera);
}

/* ── Init ────────────────────────────────────────────────── */
async function init(){
  try{
    if(typeof THREE==='undefined'){showErr('Three.js fehlt'); return;}
    txt('Szene aufbauen …'); pct(5);

    var container=document.getElementById('canvas3d');
    renderer=new THREE.WebGLRenderer({antialias:true, alpha:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    renderer.sortObjects=true;
    container.appendChild(renderer.domElement);

    lblRenderer=new THREE.CSS2DRenderer();
    lblRenderer.domElement.style.cssText='position:absolute;top:0;left:0;pointer-events:none;';
    document.getElementById('lblLayer').appendChild(lblRenderer.domElement);

    clock=new THREE.Clock();

    scene=new THREE.Scene();
    scene.background=new THREE.Color(0x0d1525);
    scene.fog=new THREE.Fog(0x0d1525,600,3500);

    // Y-up camera (Three.js default)
    camera=new THREE.PerspectiveCamera(50,1,0.5,6000);
    camera.position.set(150,400,700);
    camera.lookAt(150,20,-250);

    // Controls
    controls=new THREE.OrbitControls(camera,renderer.domElement);
    controls.enableDamping=true;
    controls.dampingFactor=0.07;
    controls.maxPolarAngle=Math.PI*0.88;
    controls.minDistance=5;
    controls.maxDistance=4000;
    controls.screenSpacePanning=false;
    // Strava-Style: 1 Finger = Karte verschieben (Auge vor/zurück/links/rechts),
    // 2 Finger = um den Orbit drehen (+ Pinch-Zoom)
    controls.touches={ONE:THREE.TOUCH.PAN, TWO:THREE.TOUCH.DOLLY_ROTATE};
    controls.update();

    // Lighting — warm sun from south-west at 40° altitude
    scene.add(new THREE.HemisphereLight(0x87ceeb, 0x5a3e28, 0.55));
    var sun=new THREE.DirectionalLight(0xfff0dd,1.3);
    sun.position.set(-200,500,-300); scene.add(sun);
    scene.add(new THREE.AmbientLight(0x203050,0.45));
    // Fill from east
    var fill=new THREE.DirectionalLight(0xaaccff,0.35);
    fill.position.set(400,200,0); scene.add(fill);

    resize();
    window.addEventListener('resize',resize);
    pct(10);

    await loadTerrain();
    pct(50);

    var loaded=0;
    for(var i=0;i<IFC.length;i++){
      try{ if(await loadLayer(IFC[i])) loaded++; }
      catch(e){ console.error(IFC[i].slot,e); }
      pct(50+(i+1)*20);
    }
    try{ await loadTische(); }catch(e){ console.warn('Tische:',e); }
    pct(100);

    // Bounding box of IFC geometry
    var box=new THREE.Box3();
    Object.values(layers).forEach(function(m){ box.expandByObject(m); });
    if(box.isEmpty()) box.set(new THREE.Vector3(0,-50,-550),new THREE.Vector3(300,60,-150));
    startFlyIn(box);

    // Bind long-press on canvas
    bindLongPress(renderer.domElement);

    // Bind AR finger-alignment gestures (active only while AR is on)
    renderer.domElement.addEventListener('touchstart', arTouchStart, {passive:false});
    renderer.domElement.addEventListener('touchmove',  arTouchMove,  {passive:false});
    renderer.domElement.addEventListener('touchend',   arTouchEnd,   {passive:false});
    renderer.domElement.addEventListener('touchcancel',arTouchEnd,   {passive:false});

    // Fade loading
    setTimeout(function(){
      var el=document.getElementById('loading');
      el.classList.add('fade');
      setTimeout(function(){el.style.display='none';},900);
    },500);

    document.getElementById('sLoad').textContent=
      loaded+' IFC-Layer  ·  '+GRID+'×'+GRID+' ('+EXTENT*2+'m)';

    animate();

  }catch(e){
    showErr(e.message||String(e));
    console.error('INIT ERROR:',e);
  }
}

window.addEventListener('load',function(){
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(function(){});
  init();
});
</script>
