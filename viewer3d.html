<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>NalpSolar 3D</title>
<link rel="manifest" href="manifest.json">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width:100%; height:100%; overflow:hidden;
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  background: #0d1117; color: #fff; user-select: none; }

/* ── Loading ─────────────────────────────────────────────── */
#loading {
  position:fixed; inset:0; z-index:500;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
  background: radial-gradient(ellipse at center, #0d1f3c 0%, #060b14 100%);
  transition: opacity .8s;
}
#loading.fade { opacity:0; pointer-events:none; }
#loading h1 { font-size:22px; font-weight:800; letter-spacing:.05em; }
#loading h1 span { color:#2196F3; }
#loadTxt { font-size:13px; opacity:.6; text-align:center; max-width:280px; line-height:1.5; }
#loadErr  { font-size:12px; color:#ff6b6b; text-align:center; max-width:300px; display:none; }
.progress-bar {
  width:200px; height:4px; background:rgba(255,255,255,.1); border-radius:2px; overflow:hidden;
}
.progress-fill {
  height:100%; width:0%; background: linear-gradient(90deg, #0b5fff, #2196F3);
  border-radius:2px; transition: width .4s;
}

/* ── Canvas ──────────────────────────────────────────────── */
#canvas3d { position:fixed; inset:0; }
#canvas3d canvas { width:100%!important; height:100%!important; display:block; }
#lblLayer  { position:fixed; inset:0; pointer-events:none; overflow:hidden; }

/* ── Toolbar ─────────────────────────────────────────────── */
#toolbar {
  position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; flex-wrap:wrap; align-items:center; gap:4px; padding:6px 8px;
  background: rgba(5,10,20,.85); backdrop-filter: blur(14px);
  border-bottom:1px solid rgba(255,255,255,.07);
}
.tb-btn {
  border: 1px solid rgba(255,255,255,.15); border-radius:8px;
  padding:5px 10px; font-size:12px; font-weight:700; cursor:pointer;
  background: rgba(255,255,255,.07); color:#fff; white-space:nowrap;
  transition: background .15s, border-color .15s;
}
.tb-btn:hover  { background:rgba(255,255,255,.15); }
.tb-btn.active { background:#0b5fff; border-color:#0b5fff; }
.tb-btn.gps-on { background:#1a6b35; border-color:#1a6b35; }
.tb-btn.tl-on  { background:#b34700; border-color:#b34700; }
.sep { width:1px; height:20px; background:rgba(255,255,255,.12); flex-shrink:0; }

/* ── Labels ──────────────────────────────────────────────── */
.lbl {
  background:rgba(0,0,0,.8); color:#fff; font-size:10px; font-weight:700;
  padding:2px 5px; border-radius:4px; white-space:nowrap;
  border:1px solid rgba(255,255,255,.2);
}
.lbl-gps {
  background:rgba(33,150,243,.9); border-color:#2196F3; font-size:11px;
  animation: gpsPulse 1.4s ease-in-out infinite;
}
@keyframes gpsPulse {
  0%,100% { box-shadow:0 0 0 0 rgba(33,150,243,.6); }
  50%      { box-shadow:0 0 0 8px rgba(33,150,243,0); }
}

/* ── Status bar ──────────────────────────────────────────── */
#statusBar {
  position:fixed; bottom:0; left:0; right:0; z-index:100;
  display:flex; gap:14px; align-items:center; padding:3px 10px;
  background:rgba(5,10,20,.82); font-size:11px;
  color:rgba(255,255,255,.55); border-top:1px solid rgba(255,255,255,.06);
}
#statusBar strong { color:rgba(255,255,255,.85); }

/* ── Compass ─────────────────────────────────────────────── */
#compass {
  position:fixed; right:12px; bottom:30px; z-index:99;
  width:42px; height:42px;
  background:rgba(5,10,20,.78); border:1px solid rgba(255,255,255,.12);
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  backdrop-filter:blur(6px);
}
#compass svg { width:26px; height:26px; }

/* ── Legend ──────────────────────────────────────────────── */
#legend {
  position:fixed; left:10px; bottom:30px; z-index:99;
  background:rgba(5,10,20,.78); border:1px solid rgba(255,255,255,.1);
  border-radius:10px; padding:8px 10px; font-size:11px;
  display:flex; flex-direction:column; gap:4px; backdrop-filter:blur(6px);
}
.leg { display:flex; align-items:center; gap:7px; }
.leg-dot { width:10px; height:10px; border-radius:2px; flex-shrink:0; }

/* ── Sun widget ──────────────────────────────────────────── */
#sunWidget {
  position:fixed; right:12px; top:52px; z-index:99;
  background:rgba(5,10,20,.78); border:1px solid rgba(255,255,255,.1);
  border-radius:10px; padding:8px 10px; font-size:11px;
  width:110px; backdrop-filter:blur(6px);
}
#sunWidget .sun-label { opacity:.55; margin-bottom:2px; font-size:10px; }
#sunWidget .sun-time  { font-weight:700; font-size:13px; margin-bottom:4px; }
#sunArc {
  width:100%; height:28px; position:relative;
}
#sunArc svg { width:100%; height:100%; overflow:visible; }
</style>

<script src="assets/js/three/three.min.js"></script>
<script src="assets/js/three/OrbitControls.js"></script>
<script src="assets/js/three/CSS2DRenderer.js"></script>
<script>
'use strict';

// ── Constants ────────────────────────────────────────────────────────────────
var ORIGIN_E = 2701555, ORIGIN_N = 1165641, BASE_ALT = 1950;
var LAT_DEG  = 46.6404,  LON_DEG  = 8.7687;
var EXTENT   = 360;   // half-width in metres
var GRID     = 64;
var IFC_FILES = [
  { slot:'wl',     base:'uploads/ifc/werkleitungen', col:[0.129,0.588,0.953] },
  { slot:'erdung', base:'uploads/ifc/erdung',        col:[1.0,0.596,0.0]     }
];
var SAT_URL = (
  'https://wms.geo.admin.ch/?SERVICE=WMS&REQUEST=GetMap&VERSION=1.3.0' +
  '&LAYERS=ch.swisstopo.swissimage&STYLES=&CRS=EPSG:2056' +
  '&WIDTH=1024&HEIGHT=1024&FORMAT=image/jpeg' +
  '&BBOX=' + (ORIGIN_E-EXTENT) + ',' + (ORIGIN_N-EXTENT) + ',' +
             (ORIGIN_E+EXTENT) + ',' + (ORIGIN_N+EXTENT)
);

// ── Sun Position (NOAA simplified) ───────────────────────────────────────────
function sunPosition(date) {
  var ms  = date.getTime();
  var jd  = ms / 86400000 + 2440587.5;
  var n   = jd - 2451545.0;
  var L   = ((280.46 + 0.9856474 * n) % 360 + 360) % 360;
  var g   = (((357.528 + 0.9856003 * n) % 360 + 360) % 360) * Math.PI / 180;
  var lam = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2*g)) * Math.PI / 180;
  var eps = 23.439 * Math.PI / 180;
  var ra  = Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam));
  var dec = Math.asin(Math.sin(eps) * Math.sin(lam));
  var utcH= date.getUTCHours() + date.getUTCMinutes()/60 + date.getUTCSeconds()/3600;
  var gmst= (6.697375 + 0.0657098242 * n + utcH) % 24;
  var lmst= (gmst + LON_DEG / 15) % 24;
  var haDeg=((lmst * 15 - ra * 180/Math.PI) % 360 + 360) % 360;
  if (haDeg > 180) haDeg -= 360;
  var ha  = haDeg * Math.PI / 180;
  var latR= LAT_DEG * Math.PI / 180;
  var alt = Math.asin(Math.sin(latR)*Math.sin(dec) + Math.cos(latR)*Math.cos(dec)*Math.cos(ha));
  var az  = Math.atan2(-Math.cos(dec)*Math.sin(ha),
                        Math.sin(dec)*Math.cos(latR) - Math.cos(dec)*Math.cos(ha)*Math.sin(latR));
  return { alt: alt, az: az };
}

// ── Globals ───────────────────────────────────────────────────────────────────
var scene, camera, renderer, controls, lblRenderer, clock;
var layers = {}, allLbls = [], labelsOn = false;
var terrainMesh = null, satTexture = null;
var terrainOn = true, satOn = true;
var gpsGroup = null, gpsWatch = null, gpsOn = false;
var sunLight, hemiLight, skyColor = new THREE.Color();
var timeOffset = 0, tlOn = false, tlRate = 3600;
var flyDone = false, flyT = 0;
var camTarget0 = new THREE.Vector3(), camPos0 = new THREE.Vector3();
var camTarget1 = new THREE.Vector3(), camPos1 = new THREE.Vector3();
var compass = document.getElementById('compass').querySelector('svg');

// ── DOM helpers ───────────────────────────────────────────────────────────────
function setTxt(t) { document.getElementById('loadTxt').textContent = t; }
function setProgress(p) { document.getElementById('progress').style.width = p + '%'; }
function showErr(msg) {
  var e = document.getElementById('loadErr');
  e.style.display = 'block'; e.textContent = '⚠ ' + msg;
  document.querySelector('.progress-fill').style.background = '#ff6b6b';
}

// ── WGS84 ↔ scene ─────────────────────────────────────────────────────────────
function wgs84ToScene(lat, lon, alt) {
  var phi = lat*3600, lam = lon*3600;
  var p = (phi - 169028.66) / 10000, l = (lam - 26782.5) / 10000;
  var E = 2600072.37 + 211455.93*l - 10938.51*l*p - 0.36*l*p*p - 44.54*l*l*l;
  var N = 1200147.07 + 308807.95*p + 3745.25*l*l + 76.63*p*p - 194.56*l*l*p + 119.79*p*p*p;
  return { x: E - ORIGIN_E, y: N - ORIGIN_N, z: (alt || BASE_ALT) - BASE_ALT };
}

// ── Sun visuals ───────────────────────────────────────────────────────────────
var SKY_NIGHT = new THREE.Color(0x020510);
var SKY_DAWN  = new THREE.Color(0x1a2a6c);
var SKY_MORN  = new THREE.Color(0xff8c42);
var SKY_DAY   = new THREE.Color(0x1565c0);

function lerpColor3(a, b, c, t) {
  if (t < 0.5) return new THREE.Color().lerpColors(a, b, t * 2);
  return new THREE.Color().lerpColors(b, c, (t - 0.5) * 2);
}

function updateSun(date) {
  var s   = sunPosition(date);
  var alt = s.alt;  // radians
  var az  = s.az;
  var D   = 900;

  // Light position
  if (sunLight) {
    sunLight.position.set(
      D * Math.cos(alt) * Math.sin(az),
      D * Math.cos(alt) * Math.cos(az),
      D * Math.sin(alt)
    );
    // Sun color: orange at horizon, white at zenith
    var t = Math.max(0, Math.min(1, alt / (Math.PI / 6)));
    sunLight.color.setRGB(1, 0.55 + 0.45*t, 0.2 + 0.8*t);
    sunLight.intensity = Math.max(0, Math.sin(Math.max(0, alt))) * 1.4 + 0.05;
  }

  // Sky color
  var tNorm = Math.max(-0.1, Math.min(0.4, alt)) / 0.4;  // -0.1…0.4 → 0…1
  var sky;
  if (tNorm < 0) sky = SKY_NIGHT.clone();
  else if (tNorm < 0.25) sky = new THREE.Color().lerpColors(SKY_DAWN, SKY_MORN, tNorm / 0.25);
  else sky = new THREE.Color().lerpColors(SKY_MORN, SKY_DAY, (tNorm - 0.25) / 0.75);

  if (scene) { scene.background = sky; scene.fog.color.copy(sky); }
  if (hemiLight) {
    hemiLight.color.setRGB(
      Math.min(1, sky.r + 0.1),
      Math.min(1, sky.g + 0.15),
      Math.min(1, sky.b + 0.3)
    );
  }

  // Sun widget
  var altDeg = alt * 180 / Math.PI;
  var h = date.getHours().toString().padStart(2, '0');
  var m = date.getMinutes().toString().padStart(2, '0');
  document.getElementById('sunTime').textContent = h + ':' + m;
  document.getElementById('sunAlt').textContent = 'Höhe: ' + altDeg.toFixed(1) + '°';

  // Sun arc dot: az ranges -π…+π, map to 5…95 on svg x, alt to y
  var azNorm = (az / Math.PI + 1) / 2;  // 0…1 from West through North to East (approx)
  var cx = 5 + azNorm * 90;
  var t2 = Math.max(0, Math.min(1, (alt + 0.2) / 0.8));
  var cy = 30 - t2 * 28;
  var dot = document.getElementById('sunDot');
  dot.setAttribute('cx', cx.toFixed(1));
  dot.setAttribute('cy', cy.toFixed(1));
  dot.setAttribute('fill', altDeg < 0 ? 'rgba(255,150,0,.3)' : '#FFA500');
}

// ── Terrain ───────────────────────────────────────────────────────────────────
async function loadTerrain() {
  setTxt('Lade Terrain-Daten …');
  setProgress(20);

  var resp = await fetch('uploads/terrain/terrain.json');
  if (!resp.ok) throw new Error('terrain.json nicht gefunden');
  var td = await resp.json();

  var G = td.grid;  // 64
  var ext = td.extent;

  // Positions
  var pos = new Float32Array(G * G * 3);
  var uvs = new Float32Array(G * G * 2);
  for (var row = 0; row < G; row++) {
    for (var col = 0; col < G; col++) {
      var idx = row * G + col;
      pos[idx*3]   = -ext + col * 2*ext / (G-1);
      pos[idx*3+1] = -ext + row * 2*ext / (G-1);
      pos[idx*3+2] = td.heights[idx] - BASE_ALT;
      uvs[idx*2]   = col / (G-1);
      uvs[idx*2+1] = row / (G-1);
    }
  }

  // Indices
  var idxArr = new Uint32Array((G-1) * (G-1) * 6);
  var ip = 0;
  for (var row = 0; row < G-1; row++) {
    for (var col = 0; col < G-1; col++) {
      var a = row*G + col, b = a+1, c = (row+1)*G + col, d = c+1;
      idxArr[ip++]=a; idxArr[ip++]=b; idxArr[ip++]=c;
      idxArr[ip++]=b; idxArr[ip++]=d; idxArr[ip++]=c;
    }
  }

  var geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geom.setAttribute('uv',       new THREE.BufferAttribute(uvs, 2));
  geom.setIndex(new THREE.BufferAttribute(idxArr, 1));
  geom.computeVertexNormals();  // fast for 64x64 terrain

  var mat = new THREE.MeshPhongMaterial({
    color: 0xaad5a0,
    transparent: true,
    opacity: 0.60,
    side: THREE.DoubleSide,
    specular: 0x223322,
    shininess: 8,
    depthWrite: false
  });

  terrainMesh = new THREE.Mesh(geom, mat);
  terrainMesh.renderOrder = 1;
  scene.add(terrainMesh);

  // Satellite texture (non-blocking)
  setTxt('Lade Satellitenbild …');
  setProgress(45);
  new THREE.TextureLoader().load(
    SAT_URL,
    function(tex) {
      tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
      satTexture = tex;
      terrainMesh.material.map = tex;
      terrainMesh.material.color.set(0xffffff);
      terrainMesh.material.needsUpdate = true;
    },
    undefined,
    function() { console.warn('Satellit-Textur konnte nicht geladen werden'); }
  );
}

// ── IFC layers ────────────────────────────────────────────────────────────────
async function loadLayer(cfg) {
  setTxt('Lade ' + cfg.slot + ' …');

  var metaR = await fetch(cfg.base + '.meta.json');
  if (!metaR.ok) return null;
  var meta = await metaR.json();

  var results = await Promise.all([
    fetch(cfg.base + '.v.bin').then(function(r){ return r.arrayBuffer(); }),
    fetch(cfg.base + '.f.bin').then(function(r){ return r.arrayBuffer(); })
  ]);
  var verts = new Float32Array(results[0]);
  var idxs  = new Uint32Array(results[1]);

  var geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  geom.setIndex(new THREE.BufferAttribute(idxs, 1));

  var c   = meta.color || cfg.col;
  var mat = new THREE.MeshPhongMaterial({
    color: new THREE.Color(c[0], c[1], c[2]),
    flatShading: true,
    side: THREE.DoubleSide,
    specular: new THREE.Color(0.1, 0.1, 0.1),
    shininess: 20
  });

  var mesh = new THREE.Mesh(geom, mat);
  scene.add(mesh);
  layers[cfg.slot] = mesh;

  (meta.labels || []).forEach(function(lbl) {
    var div = document.createElement('div');
    div.className = 'lbl';
    div.textContent = lbl.t;
    var obj = new THREE.CSS2DObject(div);
    obj.position.set(lbl.x, lbl.y, lbl.z + 4);
    obj.visible = false;
    scene.add(obj);
    allLbls.push(obj);
  });

  return mesh;
}

// ── GPS marker ────────────────────────────────────────────────────────────────
function mkGpsMarker() {
  var g = new THREE.Group();
  g.add(new THREE.Mesh(
    new THREE.SphereGeometry(2.5, 16, 12),
    new THREE.MeshPhongMaterial({ color:0x2196F3, flatShading:true, emissive:0x0b4fa0 })
  ));
  var ringGeo = new THREE.RingGeometry(4, 6.5, 32);
  g.add(new THREE.Mesh(ringGeo,
    new THREE.MeshBasicMaterial({ color:0x2196F3, transparent:true, opacity:.5, side:THREE.DoubleSide })
  ));
  var d = document.createElement('div');
  d.className = 'lbl lbl-gps'; d.textContent = '📍 Mein Standort';
  var lbl = new THREE.CSS2DObject(d); lbl.position.set(0, 0, 10);
  g.add(lbl);
  return g;
}

// ── Toggles ───────────────────────────────────────────────────────────────────
window.toggleTerrain   = function() {
  terrainOn = !terrainOn;
  if (terrainMesh) terrainMesh.visible = terrainOn;
  document.getElementById('btnTerrain').classList.toggle('active', terrainOn);
};
window.toggleSatellite = function() {
  satOn = !satOn;
  if (terrainMesh) {
    terrainMesh.material.map = satOn && satTexture ? satTexture : null;
    terrainMesh.material.color.set(satOn && satTexture ? 0xffffff : 0xaad5a0);
    terrainMesh.material.needsUpdate = true;
  }
  document.getElementById('btnSat').classList.toggle('active', satOn);
};
window.toggleLayer     = function(slot) {
  var m = layers[slot]; if (!m) return;
  m.visible = !m.visible;
  var id = slot === 'wl' ? 'btnWL' : 'btnErdung';
  document.getElementById(id).classList.toggle('active', m.visible);
};
window.toggleLabels    = function() {
  labelsOn = !labelsOn;
  allLbls.forEach(function(l) { l.visible = labelsOn; });
  document.getElementById('btnLabels').classList.toggle('active', labelsOn);
};
window.toggleGps       = function() {
  var btn = document.getElementById('btnGps');
  if (gpsOn) {
    if (gpsWatch != null) navigator.geolocation.clearWatch(gpsWatch);
    if (gpsGroup) { scene.remove(gpsGroup); gpsGroup = null; }
    gpsOn = false; btn.classList.remove('gps-on');
    document.getElementById('sGps').textContent = 'GPS: inaktiv';
    return;
  }
  if (!navigator.geolocation) { alert('Kein GPS'); return; }
  gpsOn = true; btn.classList.add('gps-on');
  gpsWatch = navigator.geolocation.watchPosition(
    function(p) {
      var s = wgs84ToScene(p.coords.latitude, p.coords.longitude, p.coords.altitude);
      if (!gpsGroup) { gpsGroup = mkGpsMarker(); scene.add(gpsGroup); }
      gpsGroup.position.set(s.x, s.y, s.z + 5);
      document.getElementById('sGps').textContent =
        p.coords.latitude.toFixed(4) + '°N  ' + p.coords.longitude.toFixed(4) + '°E  ' +
        '±' + Math.round(p.coords.accuracy) + 'm';
    },
    function(e) { document.getElementById('sGps').textContent = 'GPS: ' + e.message; },
    { enableHighAccuracy: true, timeout: 30000, maximumAge: 5000 }
  );
};
window.toggleTimelapse = function() {
  tlOn = !tlOn;
  document.getElementById('btnTL').classList.toggle('tl-on', tlOn);
  if (!tlOn) timeOffset = 0;  // reset on stop
};
window.resetCam        = function() {
  camera.position.copy(camPos1);
  controls.target.copy(camTarget1);
  controls.update();
};

// ── Compass update ────────────────────────────────────────────────────────────
function updateCompass() {
  var dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  var az = -Math.atan2(dir.x, dir.y) * 180 / Math.PI;
  compass.style.transform = 'rotate(' + az.toFixed(1) + 'deg)';
}

// ── Elevation readout ─────────────────────────────────────────────────────────
var lastAltFrame = 0;
function updateAltDisplay(frame) {
  if (frame - lastAltFrame < 30) return;
  lastAltFrame = frame;
  var tgt = controls.target;
  var z = tgt.z + BASE_ALT;
  document.getElementById('sAlt').textContent = '⛰ ' + Math.round(z) + ' m ü. M.';
}

// ── Camera fly-in ─────────────────────────────────────────────────────────────
function easeInOut(t) { return t < 0.5 ? 2*t*t : -1 + (4-2*t)*t; }

function startFlyIn(box) {
  var ctr = box.getCenter(new THREE.Vector3());
  var sz  = box.getSize(new THREE.Vector3());
  var d   = Math.max(sz.x, sz.y, sz.z);

  camTarget0.set(0, 0, 80);
  camPos0.set(0, 0, 600);

  camTarget1.copy(ctr);
  camPos1.set(ctr.x + d*0.2, ctr.y - d*1.1, ctr.z + d*0.6);

  camera.position.copy(camPos0);
  controls.target.copy(camTarget0);
  controls.update();
  flyT = 0;
  flyDone = false;
}

// ── Render loop ───────────────────────────────────────────────────────────────
var frame = 0;
var sunUpdateEvery = 90;   // frames between sun recalculation

function animate() {
  requestAnimationFrame(animate);
  frame++;

  // Timelapse
  var now = new Date(Date.now() + timeOffset * 1000);
  if (tlOn) timeOffset += tlRate / 60;

  // Sun update
  if (frame % sunUpdateEvery === 0 || tlOn) updateSun(now);

  // GPS ring pulse (CSS animation handles it)

  // Fly-in
  if (!flyDone) {
    flyT += 0.006;
    if (flyT >= 1) { flyT = 1; flyDone = true; }
    var t = easeInOut(flyT);
    camera.position.lerpVectors(camPos0, camPos1, t);
    controls.target.lerpVectors(camTarget0, camTarget1, t);
    controls.update();
  }

  controls.update();
  updateCompass();
  updateAltDisplay(frame);

  renderer.render(scene, camera);
  lblRenderer.render(scene, camera);
}

// ── Resize ────────────────────────────────────────────────────────────────────
function resize() {
  var c = document.getElementById('canvas3d');
  var w = c.clientWidth, h = c.clientHeight;
  if (!w || !h) return;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  lblRenderer.setSize(w, h);
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  try {
    if (typeof THREE === 'undefined') { showErr('Three.js fehlt'); return; }

    setProgress(5); setTxt('Szene aufbauen …');

    // Renderer
    var container = document.getElementById('canvas3d');
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.sortObjects = true;
    container.appendChild(renderer.domElement);

    // CSS2D
    lblRenderer = new THREE.CSS2DRenderer();
    lblRenderer.domElement.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none;';
    document.getElementById('lblLayer').appendChild(lblRenderer.domElement);

    // Clock
    clock = new THREE.Clock();

    // Scene
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1117);
    scene.fog = new THREE.FogExp2(0x0d1117, 0.0012);

    // Camera
    camera = new THREE.PerspectiveCamera(48, 1, 0.5, 4000);
    camera.up.set(0, 0, 1);
    camera.position.set(0, 0, 600);
    camera.lookAt(0, 0, 0);

    // Controls
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.maxPolarAngle = Math.PI * 0.9;
    controls.minDistance = 2;
    controls.maxDistance = 2000;
    controls.update();

    // Lights
    hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x5a3e28, 0.55);
    scene.add(hemiLight);

    sunLight = new THREE.DirectionalLight(0xffe8cc, 1.2);
    sunLight.position.set(200, -100, 400);
    scene.add(sunLight);

    scene.add(new THREE.AmbientLight(0x203050, 0.4));

    resize();
    window.addEventListener('resize', resize);

    // Initial sun update
    updateSun(new Date());
    setProgress(15);

    // Load terrain
    await loadTerrain();
    setProgress(55);

    // Load IFC
    var loaded = 0;
    for (var i = 0; i < IFC_FILES.length; i++) {
      try {
        if (await loadLayer(IFC_FILES[i])) loaded++;
      } catch(e) { console.warn(IFC_FILES[i].slot, e); }
      setProgress(55 + (i+1) * 20);
    }

    setProgress(100);
    setTxt('Bereit!');

    // Build bounding box
    var box = new THREE.Box3();
    Object.values(layers).forEach(function(m){ box.expandByObject(m); });
    if (box.isEmpty()) box.set(new THREE.Vector3(-100,-100,-50), new THREE.Vector3(100,100,50));

    // Fly-in animation
    startFlyIn(box);

    // Hide loading screen
    setTimeout(function() {
      var el = document.getElementById('loading');
      el.classList.add('fade');
      setTimeout(function(){ el.style.display='none'; }, 850);
    }, 600);

    document.getElementById('sLoad').textContent =
      loaded + ' IFC-Layer · ' + GRID + '×' + GRID + ' Terrain';

    // Start render loop
    animate();

  } catch(e) {
    showErr(e.message || String(e));
    console.error(e);
  }
}

window.addEventListener('load', function() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  }
  init();
});
</script>
