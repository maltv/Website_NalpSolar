<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NalpSolar 3D</title>

<script type="importmap">
{
  "imports": {
    "three":        "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
  }
}
</script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width:100%; height:100%; overflow:hidden; background:#12121e;
    font-family:Arial,Helvetica,sans-serif; color:#fff; }

  #toolbar {
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; flex-wrap:wrap; align-items:center; gap:5px; padding:5px 8px;
    background:rgba(10,10,26,0.9); backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  #toolbar button {
    border:1px solid rgba(255,255,255,0.2); border-radius:7px;
    padding:6px 11px; font-size:13px; font-weight:700; cursor:pointer;
    background:rgba(255,255,255,0.08); color:#fff; white-space:nowrap;
  }
  #toolbar button:hover  { background:rgba(255,255,255,0.18); }
  #toolbar button.active { background:#0b5fff; border-color:#0b5fff; }
  #toolbar button.gps-on { background:#1b7e3c; border-color:#1b7e3c; }
  .sep { width:1px; height:22px; background:rgba(255,255,255,0.15); }

  #canvas3d { position:fixed; top:42px; left:0; right:0; bottom:24px; }
  #canvas3d canvas { display:block; width:100%!important; height:100%!important; }

  #lblLayer {
    position:fixed; top:42px; left:0; right:0; bottom:24px;
    pointer-events:none; overflow:hidden;
  }
  .lbl {
    background:rgba(0,0,0,0.75); color:#fff; font-size:11px; font-weight:700;
    padding:2px 5px; border-radius:4px; white-space:nowrap;
    border:1px solid rgba(255,255,255,0.15);
  }
  .lbl-gps { background:rgba(33,150,243,0.92); border-color:#2196F3; font-size:12px; }

  #statusBar {
    position:fixed; bottom:0; left:0; right:0; z-index:100;
    display:flex; gap:14px; padding:3px 10px;
    background:rgba(10,10,26,0.88); font-size:11px;
    color:rgba(255,255,255,0.65); border-top:1px solid rgba(255,255,255,0.07);
  }

  #legend {
    position:fixed; right:10px; top:54px; z-index:99;
    background:rgba(10,10,26,0.85); border:1px solid rgba(255,255,255,0.1);
    border-radius:9px; padding:9px 11px; font-size:12px;
    display:flex; flex-direction:column; gap:5px;
  }
  .leg { display:flex; align-items:center; gap:7px; }
  .leg-dot { width:12px; height:12px; border-radius:3px; flex-shrink:0; }

  #loading {
    position:fixed; inset:0; z-index:200; background:rgba(12,12,24,0.97);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  }
  #loading h2 { font-size:18px; }
  #loading p  { font-size:13px; opacity:.65; max-width:320px; text-align:center; }
  .spinner {
    width:40px; height:40px; border:4px solid rgba(255,255,255,0.12);
    border-top-color:#0b5fff; border-radius:50%;
    animation:spin .75s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  #noData {
    position:fixed; inset:0; z-index:190; display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:12px;
    background:rgba(12,12,24,0.95);
  }
  #noData p { opacity:.7; font-size:14px; text-align:center; max-width:320px; }
  #noData button {
    border:1px solid #0b5fff; border-radius:8px; padding:8px 18px;
    font-weight:700; cursor:pointer; background:#0b5fff; color:#fff; font-size:14px;
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <h2>3D Viewer</h2>
  <p id="loadTxt">Initialisiere …</p>
</div>

<div id="noData">
  <p>Keine 3D-Daten gefunden.<br>Bitte zuerst im Admin-Tool hochladen.</p>
  <button onclick="location.href='admin.html'">Admin öffnen</button>
</div>

<div id="toolbar">
  <button onclick="location.href='index.html'">← Karte</button>
  <button onclick="location.href='admin.html'">Admin</button>
  <div class="sep"></div>
  <button id="btnLabels"  onclick="toggleLabels()">Labels</button>
  <button id="btnTerrain" onclick="toggleTerrain()" class="active">Terrain</button>
  <button id="btnWL"      onclick="toggleLayer('wl')"     class="active">Werkleitungen</button>
  <button id="btnErdung"  onclick="toggleLayer('erdung')"  class="active">Erdung</button>
  <div class="sep"></div>
  <button id="btnGps"  onclick="toggleGps()">GPS</button>
  <button onclick="resetCam()">Ansicht</button>
</div>

<div id="canvas3d"></div>
<div id="lblLayer"></div>

<div id="legend">
  <div class="leg"><div class="leg-dot" style="background:#2196F3"></div>Werkleitungen</div>
  <div class="leg"><div class="leg-dot" style="background:#FF9800"></div>Erdung</div>
  <div class="leg"><div class="leg-dot" style="background:rgba(120,210,120,.45)"></div>Terrain</div>
  <div class="leg"><div class="leg-dot" style="background:#2196F3;border-radius:50%"></div>GPS</div>
</div>

<div id="statusBar">
  <span id="sLoad">Lade …</span>
  <span id="sGps">GPS: inaktiv</span>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }          from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ── Scene ──────────────────────────────────────────────────────────────────
var container = document.getElementById('canvas3d');
var lblLayer  = document.getElementById('lblLayer');

var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

var lblRenderer = new CSS2DRenderer();
lblRenderer.domElement.style.cssText = 'position:absolute;top:0;pointer-events:none;';
lblLayer.appendChild(lblRenderer.domElement);

THREE.Object3D.DEFAULT_UP.set(0, 0, 1);   // Z-up = LV95 convention

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x12121e);
scene.fog = new THREE.Fog(0x12121e, 600, 1800);

var camera = new THREE.PerspectiveCamera(50, 1, 0.5, 3000);
camera.up.set(0, 0, 1);
camera.position.set(60, -260, 100);
camera.lookAt(0, 0, 0);

var controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.maxPolarAngle = Math.PI * 0.88;
controls.minDistance = 2;
controls.maxDistance = 1200;

// ── Lighting ───────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
var sun = new THREE.DirectionalLight(0xfff5dd, 1.1);
sun.position.set(100, -60, 300);
scene.add(sun);
scene.add(Object.assign(new THREE.DirectionalLight(0xaaccff, 0.3), {
  position: new THREE.Vector3(-100, 100, 50)
}));

// ── Terrain ────────────────────────────────────────────────────────────────
var ORIGIN_E = 2701555, ORIGIN_N = 1165641;
var terrainMat = new THREE.MeshLambertMaterial({
  color: 0x78d278, transparent: true, opacity: 0.22, side: THREE.DoubleSide
});
var terrainMesh = new THREE.Mesh(new THREE.PlaneGeometry(700, 700), terrainMat);
terrainMesh.position.z = 0;
scene.add(terrainMesh);

new THREE.TextureLoader().load(
  'https://wms.geo.admin.ch/?SERVICE=WMS&REQUEST=GetMap&VERSION=1.3.0'
  + '&LAYERS=ch.swisstopo.swissalti3d-reliefschattierung&STYLES=&CRS=EPSG:2056'
  + '&WIDTH=512&HEIGHT=512&FORMAT=image/png'
  + '&BBOX=' + (ORIGIN_E-350) + ',' + (ORIGIN_N-350) + ',' + (ORIGIN_E+350) + ',' + (ORIGIN_N+350),
  function (tex) {
    terrainMat.map = tex;
    terrainMat.color.set(0xffffff);
    terrainMat.opacity = 0.42;
    terrainMat.needsUpdate = true;
  }
);

// ── Layers + labels ────────────────────────────────────────────────────────
var layers  = {};
var allLbls = [];
var labelsOn = false;

var IFC_FILES = [
  { slot:'wl',     url:'uploads/ifc/werkleitungen.json' },
  { slot:'erdung', url:'uploads/ifc/erdung.json'        }
];

function b64ToBuffer(b64) {
  var bin = atob(b64);
  var len = bin.length;
  var bytes = new Uint8Array(len);
  for (var i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

async function loadLayer(cfg) {
  setTxt('Lade ' + cfg.slot + '.json …');
  var resp;
  try { resp = await fetch(cfg.url); }
  catch(e) { console.warn('Netzwerk:', cfg.url); return null; }
  if (!resp.ok) { console.info('Nicht gefunden:', cfg.url); return null; }

  setTxt('Verarbeite ' + cfg.slot + ' …');
  var data = await resp.json();

  var verts = new Float32Array(b64ToBuffer(data.v));
  var idxs  = new Uint32Array(b64ToBuffer(data.f));

  var geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  geom.setIndex(new THREE.BufferAttribute(idxs, 1));
  geom.computeVertexNormals();

  var [r,g,b] = data.color;
  var mat  = new THREE.MeshLambertMaterial({
    color: new THREE.Color(r, g, b),
    side: THREE.DoubleSide
  });
  var mesh = new THREE.Mesh(geom, mat);
  scene.add(mesh);
  layers[cfg.slot] = mesh;

  // Labels
  (data.labels || []).forEach(function(lbl) {
    var div = document.createElement('div');
    div.className = 'lbl';
    div.textContent = lbl.t;
    var obj = new CSS2DObject(div);
    obj.position.set(lbl.x, lbl.y, lbl.z + 3);
    obj.visible = false;
    scene.add(obj);
    allLbls.push(obj);
  });

  console.info(cfg.slot + ': ' + data.vCount + ' Punkte, ' + data.fCount + ' Dreiecke, ' + (data.labels||[]).length + ' Labels');
  return mesh;
}

// ── GPS ────────────────────────────────────────────────────────────────────
var gpsGroup = null, gpsWatch = null, gpsOn = false;

function wgs84ToScene(lat, lon, alt) {
  var phi = lat*3600, lam = lon*3600;
  var p = (phi-169028.66)/10000, l = (lam-26782.5)/10000;
  var E = 2600072.37+211455.93*l-10938.51*l*p-0.36*l*p*p-44.54*l*l*l;
  var N = 1200147.07+308807.95*p+3745.25*l*l+76.63*p*p-194.56*l*l*p+119.79*p*p*p;
  return { x: E-ORIGIN_E, y: N-ORIGIN_N, z: (alt||1950)-1950 };
}

function mkGps() {
  var g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(2.5,20,20),
    new THREE.MeshLambertMaterial({ color:0x2196F3 })));
  var ring = new THREE.Mesh(new THREE.RingGeometry(3.5,5.2,36),
    new THREE.MeshBasicMaterial({ color:0x2196F3, transparent:true, opacity:.45, side:THREE.DoubleSide }));
  g.add(ring);
  var d = document.createElement('div');
  d.className = 'lbl lbl-gps'; d.textContent = 'Mein Standort';
  var lbl = new CSS2DObject(d); lbl.position.set(0,0,8); g.add(lbl);
  return g;
}

window.toggleGps = function() {
  var btn = document.getElementById('btnGps');
  if (gpsOn) {
    if (gpsWatch!=null) navigator.geolocation.clearWatch(gpsWatch);
    if (gpsGroup) { scene.remove(gpsGroup); gpsGroup=null; }
    gpsOn=false; btn.classList.remove('gps-on');
    document.getElementById('sGps').textContent='GPS: inaktiv';
    return;
  }
  if (!('geolocation' in navigator)) { alert('Geolocation nicht verfügbar'); return; }
  gpsOn=true; btn.classList.add('gps-on');
  gpsWatch = navigator.geolocation.watchPosition(
    function(p) {
      var s = wgs84ToScene(p.coords.latitude, p.coords.longitude, p.coords.altitude);
      if (!gpsGroup) { gpsGroup=mkGps(); scene.add(gpsGroup); }
      gpsGroup.position.set(s.x, s.y, s.z+5);
      document.getElementById('sGps').textContent =
        'GPS: '+p.coords.latitude.toFixed(5)+'°N '+p.coords.longitude.toFixed(5)+'°E';
    },
    function(e) { document.getElementById('sGps').textContent='GPS: '+e.message; },
    { enableHighAccuracy:true, timeout:30000, maximumAge:5000 }
  );
};

// ── UI toggles ─────────────────────────────────────────────────────────────
var terrainOn = true;

window.toggleLabels = function() {
  labelsOn = !labelsOn;
  allLbls.forEach(function(l){ l.visible=labelsOn; });
  document.getElementById('btnLabels').classList.toggle('active', labelsOn);
};
window.toggleTerrain = function() {
  terrainOn=!terrainOn; terrainMesh.visible=terrainOn;
  document.getElementById('btnTerrain').classList.toggle('active', terrainOn);
};
window.toggleLayer = function(slot) {
  var m=layers[slot]; if(!m) return;
  m.visible=!m.visible;
  var id='btn'+slot.charAt(0).toUpperCase()+slot.slice(1);
  document.getElementById(id).classList.toggle('active', m.visible);
};
window.resetCam = function() {
  camera.position.set(60,-260,100); controls.target.set(0,0,0); controls.update();
};

function setTxt(t) { document.getElementById('loadTxt').textContent=t; }

// ── Resize ─────────────────────────────────────────────────────────────────
function resize() {
  var w=container.clientWidth, h=container.clientHeight;
  if(!w||!h) return;
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h); lblRenderer.setSize(w,h);
}

// ── Animate ────────────────────────────────────────────────────────────────
var clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  if (gpsGroup) {
    var t=clock.getElapsedTime();
    var ring=gpsGroup.children[1];
    if(ring){ var s=1+.25*Math.sin(t*2.5); ring.scale.set(s,s,1);
      ring.material.opacity=.25+.25*Math.abs(Math.sin(t*2.5)); }
  }
  renderer.render(scene,camera);
  lblRenderer.render(scene,camera);
}

// ── Init ───────────────────────────────────────────────────────────────────
async function init() {
  resize();
  window.addEventListener('resize', resize);

  var loaded = 0;
  for (var i=0; i<IFC_FILES.length; i++) {
    if (await loadLayer(IFC_FILES[i])) loaded++;
  }

  document.getElementById('loading').style.display = 'none';

  if (loaded===0) {
    document.getElementById('noData').style.display='flex';
    document.getElementById('sLoad').textContent='Keine Daten';
  } else {
    document.getElementById('sLoad').textContent = loaded+' Layer geladen';
    // Auto-fit camera
    var box = new THREE.Box3();
    Object.values(layers).forEach(function(m){ box.expandByObject(m); });
    if (!box.isEmpty()) {
      var c=box.getCenter(new THREE.Vector3());
      var s=box.getSize(new THREE.Vector3());
      var d=Math.max(s.x,s.y,s.z)*1.8+30;
      controls.target.copy(c);
      camera.position.set(c.x+d*.15, c.y-d, c.z+d*.5);
      controls.update();
    }
  }
  animate();
}

init();
</script>
</body>
</html>
