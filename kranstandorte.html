,8.7692711],[46.6377855,8.7692695],[46.6377878,8.7692676],[46.637789,8.7692666],[46.6377917,8.7692644],[46.6377922,8.769264],[46.6377934,8.7692631],[46.6377958,8.7692613],[46.6377971,8.7692604],[46.6377994,8.7692586],[46.6378014,8.7692571],[46.6378032,8.7692558],[46.6378076,8.7692525],[46.6378081,8.7692521],[46.6378127,8.7692491],[46.637816,8.7692469],[46.6378197,8.7692443],[46.6378201,8.7692441],[46.6378237,8.7692416],[46.6378243,8.7692413],[46.6378402,8.7692317],[46.6378407,8.7692314],[46.6378418,8.7692309],[46.6378464,8.7692284],[46.6378569,8.7692228],[46.6378572,8.7692227],[46.637867,8.7692178],[46.6378676,8.7692175],[46.637876,8.7692134],[46.6378784,8.7692122],[46.6378978,8.7692026],[46.6379011,8.7692009],[46.6379093,8.7691969],[46.6379144,8.7691943],[46.637924,8.7691896],[46.6379278,8.7691877],[46.6379288,8.7691872],[46.6379299,8.7691867],[46.6379316,8.7691858],[46.6379383,8.7691825],[46.6379453,8.769179],[46.6379486,8.7691773],[46.6379507,8.7691763],[46.6379588,8.7691723],[46.6379613,8.7691711],[46.6379649,8.7691693],[46.6379668,8.7691683],[46.6379688,8.7691674],[46.6379711,8.7691662],[46.6379796,8.769162],[46.6379855,8.7691591],[46.6379882,8.7691577],[46.6379952,8.7691542],[46.6380025,8.7691506],[46.6380054,8.7691492],[46.6380085,8.7691477],[46.6380218,8.769141],[46.6380272,8.7691384],[46.6380282,8.7691379],[46.6380325,8.7691358],[46.6380395,8.7691323],[46.6380428,8.7691306],[46.6380431,8.7691305],[46.6380465,8.7691288],[46.6380552,8.7691659],[46.6380518,8.7691676]]]},{"name":"Baupiste PZ4 Nordost (Plan PL 0478 K2)","quelle":"NalpSolar_51_PL_0478_K2_TB-2027-PZ4-Sit_260908.pdf (ILF, 1:1000, Legende «Baupisten»)","breite":3.4,"ringe":[[[46.6382963,8.7698922],[46.6382987,8.769894],[46.6383967,8.7703046],[46.6386867,8.7714376],[46.638686,8.7714416],[46.638661,8.7714552],[46.638658,8.7714532],[46.6383311,8.7701706],[46.638327,8.7701605],[46.6383189,8.7701519],[46.6382542,8.7701134],[46.6382433,8.7701113],[46.6380404,8.7702119],[46.6380312,8.770221],[46.6379592,8.7703414],[46.6379543,8.7703561],[46.6378732,8.7709727],[46.6378706,8.7709744],[46.6378432,8.7709654],[46.6379257,8.7703378],[46.6380242,8.7701732],[46.6382284,8.7700711],[46.6382356,8.770065],[46.6382407,8.7700554],[46.6382759,8.7699505],[46.638276,8.7699352],[46.63827,8.769907],[46.6382963,8.7698922]]]}]};

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const JAHRFARBE = { 2025: ['#6b7280', '#c4c9d0'], 2026: ['#0b4fb3', '#5b9bff'], 2027: ['#6d28d9', '#c4a8ff'] };
const farbe = j => JAHRFARBE[j] || ['#374151', '#e5e7eb'];

document.getElementById('standText').textContent =
  'Kranstandorte: Planung Frühling 2026 (Karte vom 18.05.2026) · Tische: Nalpi, Stand ' + D.stand + ' · Baupisten: Stand 14.09.2026';

const map = L.map('karte', { zoomControl: true, maxZoom: 22, zoomSnap: 0.5 });
const luftbild = L.tileLayer('https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.swissimage/default/current/3857/{z}/{x}/{y}.jpeg',
  { maxNativeZoom: 20, maxZoom: 22, attribution: '© swisstopo' }).addTo(map);
const landeskarte = L.tileLayer('https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/3857/{z}/{x}/{y}.jpeg',
  { maxNativeZoom: 18, maxZoom: 22, attribution: '© swisstopo' });
const ohne = L.tileLayer('', { maxZoom: 22 });

map.createPane('pisten').style.zIndex = 410;
map.createPane('tische').style.zIndex = 420;
map.createPane('kran').style.zIndex = 430;
map.createPane('nummern').style.zIndex = 620;
const tischRenderer = L.canvas({ pane: 'tische', padding: 0.3 });

// ---- Baupisten ----
const pistenLayer = L.layerGroup().addTo(map);
D.pisten.forEach(p => {
  L.polygon(p.ringe, { pane: 'pisten', color: '#7a4b00', weight: 2, fillColor: '#f5a623', fillOpacity: 0.55 })
    .bindPopup('<h3>' + esc(p.name) + '</h3>' + (p.breite ? 'Breite ' + esc(p.breite) + ' m<br>' : '') +
      '<span class="klein">Quelle: ' + esc(p.quelle) + '</span>')
    .addTo(pistenLayer);
});

// ---- Modultische ----
const tischLayer = { 2025: L.layerGroup(), 2026: L.layerGroup(), 2027: L.layerGroup(), x: L.layerGroup() };
const tischNach = {};
D.tische.forEach(t => {
  const f = farbe(t.jahr);
  const poly = L.polygon(t.p, { renderer: tischRenderer, color: f[0], weight: 1.5, fillColor: f[1], fillOpacity: 0.75 });
  poly.bindPopup(() => '<h3>Tisch ' + esc(t.nr) + '</h3><table>' +
    '<tr><td>Typ</td><td>' + esc(t.typ) + (t.module ? ' · ' + esc(t.module) + ' Module' : '') + '</td></tr>' +
    '<tr><td>Jahr (Nalpi)</td><td>' + esc(t.jahr) + '</td></tr>' +
    '<tr><td>Bereich</td><td>' + esc(t.bereich) + '</td></tr>' +
    '<tr><td>Stand Nalpi</td><td>' + esc(t.stand) + '</td></tr>' +
    '<tr><td>Kranstandort</td><td>' + (t.k.length ? t.k.map(k => '<a href="#" data-kran="' + k + '">K' + k + '</a>').join(', ')
      : 'in keinem Kranradius 2026') + '</td></tr></table>');
  poly.addTo(tischLayer[t.jahr] || tischLayer.x);
  t.layer = poly;
  tischNach[t.nr] = t;
});
[2025, 2026, 2027, 'x'].forEach(j => tischLayer[j].addTo(map));

// Tischnummern erst ab Zoom 19.5 und nur im Bildausschnitt
const nummernLayer = L.layerGroup().addTo(map);
let nummernAn = true;
function nummernZeichnen() {
  nummernLayer.clearLayers();
  if (!nummernAn || map.getZoom() < 19.5) return;
  const b = map.getBounds();
  D.tische.forEach(t => {
    if (!b.contains(t.c) || !map.hasLayer(tischLayer[t.jahr] || tischLayer.x)) return;
    L.marker(t.c, { pane: 'nummern', interactive: false,
      icon: L.divIcon({ className: 'tischnr', html: esc(t.nr), iconSize: [44, 14], iconAnchor: [22, 7] }) }).addTo(nummernLayer);
  });
}
map.on('moveend zoomend overlayadd overlayremove', nummernZeichnen);

// ---- Kranstandorte ----
const kranLayer = L.layerGroup().addTo(map);
const kranMarken = L.layerGroup().addTo(map);
const kranNach = {};
function kranPopup(k) {
  const q = k.quelle, typen = Object.entries(k.je_jahr).map(([a, n]) => n + ' × Jahr ' + esc(a)).join(', ');
  const plan = ['A', 'B', 'C', 'D', 'E'].filter(a => q[a]).map(a => q[a] + ' × ' + a).join(', ');
  return '<h3>Kranstandort K' + k.id + '</h3><table>' +
    '<tr><td>Bereich</td><td>' + esc(k.bereich) + '</td></tr>' +
    (k.radius ? '<tr><td>Radius</td><td>ca. ' + Math.round(k.radius) + ' m</td></tr>' : '') +
    (k.mitte_lv95 ? '<tr><td>Mittelpunkt LV95</td><td>' + k.mitte_lv95[0].toFixed(1) + ' / ' + k.mitte_lv95[1].toFixed(1) + '</td></tr>' : '') +
    '<tr><td>Tische im Radius</td><td><b>' + k.tische.length + '</b>' + (typen ? '<br>' + typen : '') + '</td></tr>' +
    '<tr><td>Kranplanung</td><td>' + (plan || '–') + (q.MT != null ? ' · MT ' + esc(q.MT) : '') + '</td></tr></table>' +
    (k.tische.length ? '<div class="tischliste">' + k.tische.map(n => '<a href="#" data-tisch="' + esc(n) + '">' + esc(n) + '</a>').join(' · ') + '</div>' : '') +
    '<div class="klein">«Tische im Radius» = Tischmitte liegt im Kranradius (Nalpi, ' + esc(D.stand) + '). «Kranplanung» = Zahlen je Typ aus der Kranplanung Frühling 2026, unverändert übernommen.</div>' +
    (k.mitte ? '<a class="nav" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=' + k.mitte[0] + ',' + k.mitte[1] + '">Dorthin navigieren</a>' : '');
}
D.kraene.forEach(k => {
  const poly = L.polygon(k.ring, { pane: 'kran', color: '#d4001a', weight: 2.5, fillColor: '#d4001a', fillOpacity: 0.07 })
    .bindPopup(() => kranPopup(k), { maxWidth: 300 }).addTo(kranLayer);
  poly.on('popupopen', () => markieren(k.id));
  k.layer = poly;
  kranNach[k.id] = k;
  if (k.mitte) {
    const b = String(k.id).length * 8 + 22;
    L.marker(k.mitte, { pane: 'nummern', icon: L.divIcon({ className: 'kranmarke', html: 'K' + k.id, iconSize: [b, 22], iconAnchor: [b / 2, 11] }) })
      .on('click', () => kranZeigen(k.id, false)).addTo(kranMarken);
  }
});

function kranZeigen(id, zoomen) {
  const k = kranNach[id];
  if (!k) return;
  if (!map.hasLayer(kranLayer)) kranLayer.addTo(map);
  if (zoomen) map.fitBounds(k.layer.getBounds(), { padding: [30, 30], maxZoom: 20 });
  k.layer.openPopup(k.mitte || k.layer.getBounds().getCenter());
  document.getElementById('seite').classList.remove('offen');
}
function tischZeigen(nr) {
  const t = tischNach[nr];
  if (!t) return false;
  const g = tischLayer[t.jahr] || tischLayer.x;
  if (!map.hasLayer(g)) g.addTo(map);
  map.setView(t.c, 20.5);
  t.layer.openPopup(t.c);
  document.getElementById('seite').classList.remove('offen');
  return true;
}
function markieren(id) {
  document.querySelectorAll('.zeile').forEach(z => z.classList.toggle('aktiv', z.dataset.kran == id));
  D.kraene.forEach(k => k.layer.setStyle({ weight: k.id == id ? 4.5 : 2.5, fillOpacity: k.id == id ? 0.18 : 0.07 }));
}
map.on('popupclose', () => markieren(null));
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-kran], a[data-tisch]');
  if (!a) return;
  e.preventDefault();
  if (a.dataset.kran) kranZeigen(Number(a.dataset.kran), true); else tischZeigen(a.dataset.tisch);
});

// ---- Liste ----
const liste = document.getElementById('liste');
D.kraene.forEach(k => {
  const z = document.createElement('div');
  z.className = 'zeile';
  z.dataset.kran = k.id;
  const typen = Object.entries(k.je_jahr).map(([a, n]) => a + ': ' + n).join(' · ');
  z.innerHTML = '<div class="nr">K' + k.id + '</div><div><div class="ber">' + esc(k.bereich) + '</div><div class="typen">' + typen + '</div></div>' +
    '<div class="anz"><b>' + k.tische.length + '</b> Tische</div>';
  z.addEventListener('click', () => kranZeigen(k.id, true));
  liste.appendChild(z);
});
const imRadius = D.tische.filter(t => t.k.length).length;
document.getElementById('summe').textContent = D.kraene.length + ' Kranstandorte · ' + imRadius + ' Tische in einem Kranradius · ' +
  D.tische.length + ' Tische total · ' + D.pisten.length + ' Baupisten';

document.getElementById('suchForm').addEventListener('submit', e => {
  e.preventDefault();
  const nr = document.getElementById('tischEingabe').value.trim();
  const out = document.getElementById('treffer');
  if (!nr) { out.textContent = ''; return; }
  const t = tischNach[nr];
  if (!t) { out.textContent = 'Tisch ' + nr + ' gibt es in Nalpi nicht.'; return; }
  out.innerHTML = 'Tisch ' + esc(nr) + ' (Typ ' + esc(t.typ) + ', ' + esc(t.jahr) + '): ' +
    (t.k.length ? t.k.map(k => '<a href="#" data-kran="' + k + '">K' + k + '</a>').join(', ') : 'in keinem Kranradius 2026');
  tischZeigen(nr);
});
document.getElementById('listeKnopf').addEventListener('click', () => document.getElementById('seite').classList.toggle('offen'));

L.control.layers(
  { 'Luftbild': luftbild, 'Landeskarte': landeskarte, 'Ohne Hintergrund': ohne },
  { 'Kranradien 2026': kranLayer, 'Kran-Nummern': kranMarken, 'Baupisten': pistenLayer,
    'Tische 2025': tischLayer[2025], 'Tische 2026': tischLayer[2026], 'Tische 2027': tischLayer[2027], 'Tischnummern': nummernLayer },
  { collapsed: true }).addTo(map);
map.on('overlayadd overlayremove', e => { if (e.layer === nummernLayer) { nummernAn = e.type === 'overlayadd'; nummernZeichnen(); } });
L.control.scale({ imperial: false }).addTo(map);

const alles = L.latLngBounds([]);
D.kraene.forEach(k => alles.extend(k.layer.getBounds()));
D.pisten.forEach(p => p.ringe.forEach(r => alles.extend(r)));
map.fitBounds(alles, { padding: [20, 20] });
</script>
</body>
