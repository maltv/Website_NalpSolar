<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NalpSolar Planhaus</title>
<link rel="stylesheet" href="assets/js/leaflet/leaflet.css">
<!--
  Bildschirm im Planhaus (TV Hisense 55A7KQ, VIDAA-Browser). Wechselt alle 15 s zwischen
  den Kennzahlen der Nalpi-Uebersicht und der Karte mit den Tischfarben aus Nalpi.

  Daten: Firebase-RTDB erfassung/planhaus/stand (Kennzahlen) + erfassung/planhaus/karte
  (Tischumrisse + Stufe + Farben). Geschrieben von Nalpi selbst (Planhaus-Sender in der
  Extension), sobald irgendwer im Team Nalpi offen hat - kein PC, kein Server.
  Diese Seite rechnet NICHTS nach, sie zeichnet nur; Regeln und Farben stehen in Nalpi.

  Bewusst altes JavaScript (var, function, XMLHttpRequest): der TV-Browser ist ein
  abgespecktes Chromium unbekannten Alters. Karte = Leaflet 2D (kein WebGL).
  Ohne PIN-Gate: es stehen nur Summen und Tischfarben drauf, wie in baustand.json.
  Aufruf-Schalter: ?sek=15 (Wechseltakt), ?nur=dash oder ?nur=karte (kein Wechsel).
-->
<style>
  :root {
    --bg: #f1f3f5;
    --card: #ffffff;
    --ink: #1a1b1e;
    --ink2: #495057;
    --muted: #868e96;
    --hair: #e2e8f0;
    --axis: #cbd5e1;
    --weekend: #eceff3;
    --bohr: #f97316;        /* Nalpi DRILLED */
    --bohr-bar: #fb923c;
    --bohr-line: #9a3412;
    --tisch: #2563eb;       /* Nalpi RACK_MOUNTED */
    --tisch-bar: #3b82f6;   /* gestapelt mit --pk-bar: geprueft auf Farbsehschwaeche (ΔE 25 deutan) */
    --tisch-line: #1d4ed8;
    --pk: #10b981;          /* Nalpi ASSEMBLED */
    --pk-bar: #10b981;
    --pk-line: #047857;
    --vs: #eab308;          /* Nalpi SCREWED_CARD_COLOR */
    --inj: #075985;         /* Nalpi INJECTED */
    --gut: #2f9e44;
    --warn: #e8590c;
    --alt: #c92a2a;
    --rot: #D72622;         /* STRABAG */
  }
  /* 1 rem = 1/96 der Breite: auf 1920 px sind das 20 px, auf jedem 16:9-Schirm gleich gross */
  html { font-size: 1.0417vw; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: Arial, Helvetica, sans-serif;
    height: 100vh; overflow: hidden;
  }
  .num { font-variant-numeric: tabular-nums; }
  .wrap { display: flex; flex-direction: column; height: 100vh; padding: 1rem 1.4rem 0.8rem; box-sizing: border-box; }

  header { display: flex; align-items: center; border-bottom: 0.2rem solid var(--rot); padding-bottom: 0.6rem; }
  header img { height: 2.4rem; margin-right: 1.2rem; }
  header h1 { font-size: 1.9rem; margin: 0; font-weight: 700; flex: 1; }
  header h1 span { color: var(--muted); font-weight: 400; }
  .zeit { text-align: right; }
  .uhr { font-size: 2.6rem; font-weight: 700; line-height: 1; }
  .datum { font-size: 1rem; color: var(--ink2); margin-top: 0.2rem; }
  .stand { margin-left: 2rem; font-size: 1rem; color: var(--ink2); text-align: right; line-height: 1.4; }
  .stand b { color: var(--ink); }
  .punkt { display: inline-block; width: 0.8rem; height: 0.8rem; border-radius: 50%; margin-right: 0.4rem; vertical-align: -0.05rem; background: var(--muted); }

  .reihe { display: flex; margin-top: 1rem; }
  .reihe > .karte + .karte { margin-left: 1rem; }
  .karte { background: var(--card); border-radius: 0.6rem; padding: 1rem 1.3rem; box-sizing: border-box; flex: 1; min-width: 0; }
  .titel { font-size: 0.85rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }

  /* Fortschrittsringe */
  .ring { display: flex; align-items: center; }
  .ring svg { width: 7.5rem; height: 7.5rem; flex: none; margin-right: 1.2rem; }
  .ring .gross { font-size: 2.6rem; font-weight: 700; line-height: 1; }
  .ring .gross small { font-size: 1.4rem; color: var(--muted); font-weight: 400; }
  .ring .was { font-size: 1.15rem; font-weight: 700; margin-top: 0.4rem; }

  /* Leistung pro Arbeitstag */
  .rate { display: flex; align-items: center; }
  .rate .wert { font-size: 4.4rem; font-weight: 700; line-height: 1; margin-right: 1.2rem; }
  .rate .teil { font-size: 1.05rem; line-height: 1.6; color: var(--ink2); }
  .rate .teil b { color: var(--ink); }
  .marke { display: inline-block; width: 0.7rem; height: 0.7rem; border-radius: 0.15rem; margin-right: 0.35rem; }
  .rate-was { font-size: 1.15rem; font-weight: 700; margin-top: 0.5rem; }
  .klein { font-size: 0.85rem; color: var(--muted); margin-top: 0.2rem; }

  /* Heute */
  .heute { display: flex; align-items: center; }
  .heute .titel { margin: 0 1.5rem 0 0; font-size: 1rem; color: var(--ink2); font-weight: 700; }
  .heute .posten { flex: 1; display: flex; align-items: baseline; }
  .heute .posten .z { font-size: 2.4rem; font-weight: 700; margin-right: 0.5rem; }
  .heute .posten .t { font-size: 1.05rem; color: var(--ink2); }

  /* Plots */
  .plots { flex: 1; min-height: 0; }
  .plots .karte { display: flex; flex-direction: column; }
  .plotkopf { display: flex; align-items: baseline; }
  .plotkopf .name { font-size: 1.25rem; font-weight: 700; flex: 1; white-space: nowrap; }
  .legende { font-size: 0.8rem; color: var(--ink2); flex: none; }
  .legende span { margin-left: 0.8rem; white-space: nowrap; }
  .legende i { display: inline-block; vertical-align: middle; margin-right: 0.35rem; }
  .plot { flex: 1; min-height: 0; margin-top: 0.4rem; }
  .plot svg { display: block; width: 100%; height: 100%; }

  .fuss { font-size: 0.8rem; color: var(--muted); margin-top: 0.6rem; display: flex; }
  .fuss span:first-child { flex: 1; }
  .hinweis { display: none; background: #fff4e6; color: #7c2d12; border-radius: 0.4rem; padding: 0.5rem 0.9rem; margin-top: 0.8rem; font-size: 1.1rem; }

  /* Zwei Seiten uebereinander, Wechsel per Ueberblendung */
  .seite { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; overflow: hidden; background: var(--bg);
    -webkit-transition: opacity 1.2s; transition: opacity 1.2s; }
  .seite.aus { opacity: 0; }

  /* Karte: Flaeche groesser als der Schirm, gleitet langsam hin und her (nur transform = fluessig) */
  #seiteKarte { background: #2b2f33; }
  #kartenFlaeche { position: absolute; left: 0; top: 0; }
  #kartenFlaeche .leaflet-container, #kartenFlaeche { background: #2b2f33; }
  .kkopf { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center;
    padding: 0.8rem 1.4rem 0.6rem; background: rgba(255, 255, 255, 0.92); border-bottom: 0.2rem solid var(--rot); }
  .kkopf img { height: 2.4rem; margin-right: 1.2rem; }
  .kkopf h1 { font-size: 1.9rem; margin: 0; font-weight: 700; flex: 1; }
  .kkopf h1 span { color: var(--muted); font-weight: 400; }
  .klegende { position: absolute; left: 1.4rem; bottom: 1.4rem; background: rgba(255, 255, 255, 0.94);
    border-radius: 0.6rem; padding: 0.9rem 1.2rem 0.7rem; font-size: 1.15rem; }
  .klegende .titel { margin-bottom: 0.4rem; }
  .klegende div.z { display: flex; align-items: center; line-height: 1.75; }
  .klegende i { display: inline-block; width: 1.5rem; height: 0.9rem; border-radius: 0.15rem; margin-right: 0.6rem;
    border: 0.08rem solid rgba(0, 0, 0, 0.35); }
  .klegende .n { font-weight: 700; min-width: 3.2rem; text-align: right; margin-right: 0.7rem; }
  .khinweis { display: none; position: absolute; left: 50%; top: 5.6rem; -webkit-transform: translateX(-50%); transform: translateX(-50%);
    background: #fff4e6; color: #7c2d12; border-radius: 0.4rem; padding: 0.5rem 0.9rem; font-size: 1.1rem; white-space: nowrap; }
  /* Gebrochener Zoom: Kacheln 1 px ueberlappen, sonst zeigen sich feine Naehte im Luftbild.
     Leaflet 1.9 blendet Kacheln mit plus-lighter - dann wuerde die Ueberlappung hell; darum normal. */
  #kartenFlaeche img.leaflet-tile { width: 257px !important; height: 257px !important; mix-blend-mode: normal !important; }
</style>
</head>
<body>
<div class="seite" id="seiteDash">
<div class="wrap">
  <header>
    <img src="assets/img/strabag-logo.png" alt="STRABAG">
    <h1>NalpSolar <span>· Baustand</span></h1>
    <div class="zeit"><div class="uhr num" id="uhr">--:--</div><div class="datum" id="datum"></div></div>
    <div class="stand" id="stand"><span class="punkt"></span>Nalpi wird geladen …</div>
  </header>

  <div class="hinweis" id="hinweis"></div>

  <div class="reihe">
    <div class="karte"><div class="titel">Fortschritt</div>
      <div class="ring" id="ringTische"></div></div>
    <div class="karte"><div class="titel">Fortschritt</div>
      <div class="ring" id="ringBohr"></div></div>
    <div class="karte"><div class="titel">Leistung</div>
      <div id="rateTische"></div></div>
    <div class="karte"><div class="titel">Leistung</div>
      <div id="rateBohr"></div></div>
  </div>

  <div class="reihe"><div class="karte heute" id="heute"></div></div>

  <div class="reihe plots">
    <div class="karte">
      <div class="plotkopf"><div class="name">Bohrungen pro Tag</div><div class="legende" id="legBohr"></div></div>
      <div class="plot" id="plotBohr"></div>
    </div>
    <div class="karte">
      <div class="plotkopf"><div class="name">Tische pro Tag</div><div class="legende" id="legTische"></div></div>
      <div class="plot" id="plotTische"></div>
    </div>
  </div>

  <div class="fuss"><span>Zahlen aus Nalpi, gleiche Regeln wie die Nalpi-Übersicht</span><span id="fussZeit"></span></div>
</div>
</div>

<div class="seite aus" id="seiteKarte">
  <div id="kartenFlaeche"></div>
  <div class="kkopf">
    <img src="assets/img/strabag-logo.png" alt="STRABAG">
    <h1>NalpSolar <span>· Karte Baustand</span></h1>
    <div class="zeit"><div class="uhr num" id="uhr2">--:--</div><div class="datum" id="datum2"></div></div>
    <div class="stand" id="stand2"><span class="punkt"></span></div>
  </div>
  <div class="khinweis" id="khinweis"></div>
  <div class="klegende" id="klegende"></div>
</div>

<script src="assets/js/leaflet/leaflet.js"></script>
<script>
(function () {
  var QUELLE = 'https://highscore-test-2e784-default-rtdb.europe-west1.firebasedatabase.app/erfassung/planhaus/stand.json';
  var ABFRAGE_MS = 60 * 1000;           // jede Minute nachsehen
  var NEU_LADEN_MS = 6 * 3600 * 1000;   // alle 6 h die ganze Seite neu (TV-Browser laufen sonst voll)
  var SPEICHER = 'nalp_planhaus_stand_v4';   // v4: Stand mit schnitt_pk (eigene Linie fuer die Primaerkonstruktion)
  var TAGE = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  var MONATE = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];

  var stand = null;          // letzter gueltiger Stand
  var letzteAntwort = null;  // Zeitpunkt der letzten erfolgreichen Abfrage

  function $(id) { return document.getElementById(id); }
  function zwei(n) { return (n < 10 ? '0' : '') + n; }
  function komma(x) { return (Math.round(x * 10) / 10).toFixed(1).replace('.', ','); }
  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).replace(/\s/g, ''); }
  function isoTag(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function kurzTag(s) { var p = s.split('-'); return p[2] + '.' + p[1] + '.'; }

  // ---------------------------------------------------------------- Uhr
  function uhr() {
    var d = new Date();
    var u = zwei(d.getHours()) + ':' + zwei(d.getMinutes());
    var t = TAGE[d.getDay()] + ', ' + d.getDate() + '. ' + MONATE[d.getMonth()] + ' ' + d.getFullYear();
    $('uhr').textContent = u; $('uhr2').textContent = u;
    $('datum').textContent = t; $('datum2').textContent = t;
    standZeile();
  }

  // Wie alt sind die Zahlen? Nie so tun, als waeren sie frisch.
  function standZeile() {
    if (!stand) return;
    var gelesen = new Date(stand.gelesen);
    var min = Math.round((new Date() - gelesen) / 60000);
    var farbe = min <= 30 ? css('--gut') : (min <= 180 ? css('--warn') : css('--alt'));
    var alter = min < 1 ? 'gerade eben' : (min < 60 ? 'vor ' + min + ' Min.' :
      (min < 60 * 24 ? 'vor ' + Math.floor(min / 60) + ' h ' + zwei(min % 60) + ' Min.' : 'vor ' + Math.floor(min / 1440) + ' Tagen'));
    var zeile = '<span class="punkt" style="background:' + farbe + '"></span>Nalpi-Stand <b class="num">' +
      zwei(gelesen.getHours()) + ':' + zwei(gelesen.getMinutes()) + '</b><br>' + alter;
    $('stand').innerHTML = zeile; $('stand2').innerHTML = zeile;
    var text = '';
    if (min > 180) {
      text = 'Die Zahlen sind nicht aktuell – Nalpi hat seit ' +
        zwei(gelesen.getHours()) + ':' + zwei(gelesen.getMinutes()) + ' Uhr keinen neuen Stand geschickt.';
    } else if (letzteAntwort && new Date() - letzteAntwort > 5 * 60000) {
      text = 'Keine Verbindung zum Internet – angezeigt wird der letzte Stand.';
    }
    var h = $('hinweis'), kh = $('khinweis');
    h.textContent = text; kh.textContent = text;
    h.style.display = text ? 'block' : 'none';
    kh.style.display = text ? 'block' : 'none';
  }

  // ---------------------------------------------------------------- Karten
  function ring(el, ist, soll, farbe, was) {
    var pct = soll > 0 ? Math.round(ist / soll * 100) : 0;
    var r = 42, u = 2 * Math.PI * r, bogen = u * Math.min(1, ist / soll);
    el.innerHTML =
      '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="' + r + '" fill="none" stroke="' + css('--hair') + '" stroke-width="10"/>' +
      '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="' + farbe + '" stroke-width="10" stroke-linecap="round"' +
      ' stroke-dasharray="' + bogen.toFixed(1) + ' ' + u.toFixed(1) + '" transform="rotate(-90 50 50)"/>' +
      '<text x="50" y="57" text-anchor="middle" font-size="22" font-weight="700" fill="' + css('--ink') + '">' + pct + '%</text></svg>' +
      '<div><div class="gross num">' + ist + ' <small>/ ' + soll + '</small></div><div class="was">' + was + '</div></div>';
  }

  function rate(el, wert, farbe, was, teile, kacheln) {
    var t = '';
    for (var i = 0; i < teile.length; i++) {
      t += '<div><span class="marke" style="background:' + teile[i][2] + '"></span><b class="num">' + komma(teile[i][0]) + '</b> ' + teile[i][1] + '</div>';
    }
    el.innerHTML = '<div class="rate"><div class="wert num" style="color:' + farbe + '">' + komma(wert) + '</div>' +
      (t ? '<div class="teil">' + t + '</div>' : '') + '</div>' +
      '<div class="rate-was">' + was + '</div>' +
      '<div class="klein">' + kurzTag(kacheln.von) + '–' + kurzTag(kacheln.bis) + ' · ' + kacheln.arbeitstage + ' Arbeitstage</div>';
  }

  function heute(h) {
    var posten = [
      ['gebohrt', 'gebohrt', css('--bohr')],
      ['injiziert', 'injiziert', css('--inj')],
      ['pk', 'Primärkonstr.', css('--pk')],
      ['mt', 'Modulträger', css('--tisch')],
      ['vs', 'verschraubt', css('--vs')]
    ];
    var s = '<div class="titel">Heute<br>bisher</div>';
    for (var i = 0; i < posten.length; i++) {
      s += '<div class="posten"><span class="marke" style="background:' + posten[i][2] + ';align-self:center"></span>' +
        '<span class="z num">' + (h[posten[i][0]] || 0) + '</span><span class="t">' + posten[i][1] + '</span></div>';
    }
    $('heute').innerHTML = s;
  }

  // ---------------------------------------------------------------- Plot
  // Balken = Tageswert je Serie, mehrere Serien NEBENEINANDER (gruppiert), je Serie eine Linie =
  // gleitender Schnitt je Arbeitstag (wie Nalpi), punktiert = EIN Ziel pro Arbeitstag, das fuer jede
  // Serie gilt (Victor 25.09.2026: im Schnitt 5 Primaerkonstruktionen UND 5 Modultraeger pro Tag).
  // Heute ist nie fertig: Balken blass.  serien = [[feld, farbeBalken, schnittFeld, farbeLinie], ...]
  function plot(el, reihe, serien, ziel) {
    var W = el.clientWidth, H = el.clientHeight;
    if (W < 50 || H < 50) return;
    var rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
    var fs = 0.8 * rem;
    var M = { l: 2.2 * rem, r: 3.6 * rem, t: 0.9 * rem, b: 1.6 * rem };
    var pw = W - M.l - M.r, ph = H - M.t - M.b;
    var n = reihe.length, step = pw / n;

    var k = serien.length, max = ziel;
    for (var i = 0; i < n; i++) {
      for (var j = 0; j < k; j++) max = Math.max(max, reihe[i][serien[j][0]] || 0, reihe[i][serien[j][2]] || 0);
    }
    var raster = max <= 12 ? 2 : (max <= 30 ? 5 : (max <= 60 ? 10 : 20));
    max = Math.ceil(max * 1.08 / raster) * raster;
    function y(v) { return M.t + ph - v / max * ph; }
    function x(i) { return M.l + step * i + step / 2; }

    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" font-family="Arial, Helvetica, sans-serif">';
    // Wochenenden grau hinterlegt (wie im Nalpi-Bautempo)
    for (i = 0; i < n; i++) {
      if (!reihe[i].at) s += '<rect x="' + (M.l + step * i) + '" y="' + M.t + '" width="' + step + '" height="' + ph + '" fill="' + css('--weekend') + '"/>';
    }
    // Raster
    for (var v = 0; v <= max; v += raster) {
      s += '<line x1="' + M.l + '" x2="' + (W - M.r) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="' + css('--hair') + '"/>' +
        '<text x="' + (M.l - 0.4 * rem) + '" y="' + (y(v) + fs * 0.35) + '" font-size="' + fs + '" text-anchor="end" fill="' + css('--muted') + '">' + v + '</text>';
    }
    // Balken je Serie nebeneinander: 2 px Luft zwischen Tagen, 1 px zwischen den Serien, oben gerundet
    var gw = Math.max(2, step - 2), bw = Math.max(1.5, (gw - (k - 1)) / k), rr = Math.min(4, bw / 2);
    for (i = 0; i < n; i++) {
      var op = (i === n - 1) ? ' opacity="0.45"' : '';
      for (var j = 0; j < k; j++) {
        var w = reihe[i][serien[j][0]] || 0;
        if (!w) continue;
        var bx = M.l + step * i + 1 + j * (bw + 1), by = y(w), bh = y(0) - by, r2 = Math.min(rr, bh);
        s += '<path d="M' + bx + ',' + y(0) + 'V' + (by + r2) + 'Q' + bx + ',' + by + ' ' + (bx + r2) + ',' + by +
          'H' + (bx + bw - r2) + 'Q' + (bx + bw) + ',' + by + ' ' + (bx + bw) + ',' + (by + r2) + 'V' + y(0) + 'Z" fill="' + serien[j][1] + '"' + op + '/>';
      }
    }
    // Ziel: EINE Linie, gilt fuer jede Serie
    s += '<line x1="' + M.l + '" x2="' + (W - M.r) + '" y1="' + y(ziel) + '" y2="' + y(ziel) + '" stroke="' + css('--ink2') + '" stroke-width="1.5" stroke-dasharray="2 5"/>';
    var marken = [{ y: y(ziel), text: 'Ziel ' + ziel, fett: false, farbe: css('--ink2'), fs: fs }];
    // Gleitender Schnitt je Serie, Endpunkt mit Ø-Beschriftung (Punkt in der Serienfarbe davor)
    for (j = 0; j < k; j++) {
      var sf = serien[j][2], pfad = '', letzt = -1;
      for (i = 0; i < n; i++) {
        var sv = reihe[i][sf];
        if (sv === undefined || sv === null) continue;
        pfad += (pfad ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(sv).toFixed(1);
        letzt = i;
      }
      if (!pfad) continue;
      var lv = reihe[letzt][sf];
      s += '<path d="' + pfad + '" fill="none" stroke="' + serien[j][3] + '" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>' +
        '<circle cx="' + x(letzt) + '" cy="' + y(lv) + '" r="5" fill="' + serien[j][3] + '" stroke="#fff" stroke-width="2"/>';
      marken.push({ y: y(lv), text: 'Ø ' + komma(lv), fett: true, farbe: css('--ink'), punkt: (k > 1 ? serien[j][3] : null), fs: fs * 1.15 });
    }
    // Beschriftungen rechts: nach Hoehe sortieren und auseinanderschieben, damit nichts uebereinander liegt
    marken.sort(function (a, b) { return a.y - b.y; });
    for (i = 1; i < marken.length; i++) {
      if (marken[i].y - marken[i - 1].y < fs * 1.3) marken[i].y = marken[i - 1].y + fs * 1.3;
    }
    for (i = 0; i < marken.length; i++) {
      var mk = marken[i], mx = W - M.r + 0.4 * rem;
      if (mk.punkt) { s += '<circle cx="' + (mx + 0.22 * rem) + '" cy="' + mk.y + '" r="' + (0.22 * rem) + '" fill="' + mk.punkt + '"/>'; mx += 0.65 * rem; }
      s += '<text x="' + mx + '" y="' + (mk.y + mk.fs * 0.35) + '" font-size="' + mk.fs + '"' + (mk.fett ? ' font-weight="700"' : '') + ' fill="' + mk.farbe + '">' + mk.text + '</text>';
    }
    // Achse + Tage: jeder Montag und heute
    s += '<line x1="' + M.l + '" x2="' + (W - M.r) + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="' + css('--axis') + '"/>';
    for (i = 0; i < n; i++) {
      var d = isoTag(reihe[i].tag);
      if (d.getDay() === 1 || i === n - 1) {
        s += '<text x="' + x(i) + '" y="' + (H - 0.35 * rem) + '" font-size="' + fs + '" text-anchor="middle" fill="' + css('--ink2') + '">' +
          (i === n - 1 ? 'heute' : 'Mo ' + kurzTag(reihe[i].tag)) + '</text>';
      }
    }
    el.innerHTML = s + '</svg>';
  }

  // serien wie bei plot(), namen = Text je Serie; die Ø-Linie zeigt bei mehreren Serien beide Linienfarben
  function legende(el, serien, namen) {
    var s = '', lf = serien[0][3];
    for (var i = 0; i < serien.length; i++) {
      s += '<span><i style="width:0.8rem;height:0.8rem;border-radius:0.15rem;background:' + serien[i][1] + '"></i>' + namen[i] + '</span>';
    }
    if (serien.length > 1) lf = 'linear-gradient(90deg,' + serien[0][3] + ' 50%,' + serien[1][3] + ' 50%)';
    el.innerHTML = s +
      '<span><i style="width:1.4rem;height:0.2rem;background:' + lf + '"></i>Ø 14 Tage je Arbeitstag</span>' +
      '<span><i style="width:1.4rem;border-top:0.12rem dotted ' + css('--ink2') + '"></i>Ziel</span>';
  }

  // ---------------------------------------------------------------- Zeichnen
  function zeichnen() {
    if (!stand) return;
    var s = stand.summe, z = stand.ziele, k = stand.kacheln;
    ring($('ringTische'), s.montiert, z.tische, css('--tisch'), 'Tische montiert');
    ring($('ringBohr'), s.gebohrt, z.bohrungen, css('--bohr'), 'Bohrungen gebohrt');
    rate($('rateTische'), k.mt.pro_at, css('--tisch'), 'Tische pro Arbeitstag',
      [[k.pk.pro_at, 'Primärkonstruktion', css('--pk')], [k.mt.pro_at, 'Modulträger', css('--tisch')]], k);
    rate($('rateBohr'), k.gebohrt.pro_at, css('--bohr'), 'Bohrungen pro Arbeitstag', [], k);
    heute(stand.heute || {});
    // Tische (Victor 25.09.2026): im Schnitt 5 Primärkonstruktionen UND 5 Modulträger pro Tag -
    // beide Serien nebeneinander, je eine Ø-Linie, EINE Ziellinie (Nalpi-Ziel Tische/AT) für beide
    var SB = [['gebohrt', css('--bohr-bar'), 'schnitt_gebohrt', css('--bohr-line')]];
    var ST = [['pk', css('--pk-bar'), 'schnitt_pk', css('--pk-line')], ['mt', css('--tisch-bar'), 'schnitt_mt', css('--tisch-line')]];
    legende($('legBohr'), SB, ['gebohrt']);
    legende($('legTische'), ST, ['Primärkonstr.', 'Modulträger']);
    plot($('plotBohr'), stand.reihe, SB, z.bohr_pro_at);
    plot($('plotTische'), stand.reihe, ST, z.tische_pro_at);
    standZeile();
  }

  // ---------------------------------------------------------------- Karte
  // Umrisse, Stufe und Farben kommen fertig aus Nalpi (erfassung/planhaus/karte, geschrieben von
  // NalpsChromeExtension src/hooks/data/use-planhaus-sender.ts, Format domain/planhaus/planhaus-payload.ts):
  //   { gelesen, stufen: [{key, name, farbe, n}], wgs: {lat0, lng0}, tische: [[stufe, dLat1, dLng1, ...], ...] }
  //   dLat/dLng = Millionstel Grad relativ zu lat0/lng0 (~0.1 m). Die Seite ordnet keine Farbe selbst zu.
  var KQUELLE = QUELLE.replace('/stand.json', '/karte.json');
  var KSPEICHER = 'nalp_planhaus_karte_v1';
  var FAKTOR = 1.5;          // Kartenflaeche 1.5 x Schirm = leicht hineingezoomt, gleitet darueber
  var karte = null, map = null, tischEbene = null, grenzen = null;
  var fahrt = { a: null, b: null, hin: true };

  function transform(el, x, y) {
    var t = 'translate3d(' + Math.round(x) + 'px,' + Math.round(y) + 'px,0)';
    el.style.webkitTransform = t; el.style.transform = t;
  }

  // Gleitweg: von «oben links» der Anlage nach «unten rechts» und zurueck. Der Kopfbalken deckt
  // oben einen Streifen ab, darum dort mehr Rand.
  function fahrtBerechnen() {
    var W = window.innerWidth, H = window.innerHeight, FW = W * FAKTOR, FH = H * FAKTOR;
    var rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
    var kopf = 5 * rem, m = 1.5 * rem;
    var p1 = map.latLngToContainerPoint(grenzen.getNorthWest()), p2 = map.latLngToContainerPoint(grenzen.getSouthEast());
    function achse(lo, hi, rand0, fenster, flaeche) {
      var a = rand0 - lo, b = fenster - m - hi;       // Anfang sichtbar / Ende sichtbar
      if (a < b) a = b = (a + b) / 2;                 // passt ganz hinein -> mittig, kein Weg
      return [Math.min(0, Math.max(fenster - flaeche, a)), Math.min(0, Math.max(fenster - flaeche, b))];
    }
    var ax = achse(p1.x, p2.x, m, W, FW), ay = achse(p1.y, p2.y, kopf + m, H, FH);
    fahrt.a = [ax[0], ay[0]];
    fahrt.b = [ax[1], ay[1]];
    fahrt.hin = true;
    var fl = $('kartenFlaeche');
    fl.style.webkitTransition = 'none'; fl.style.transition = 'none';
    transform(fl, fahrt.a[0], fahrt.a[1]);
  }

  function gleiten() {
    if (!fahrt.a) return;
    var fl = $('kartenFlaeche'), ziel = fahrt.hin ? fahrt.b : fahrt.a;
    fahrt.hin = !fahrt.hin;
    fl.style.webkitTransition = '-webkit-transform ' + (SEK + 1) + 's ease-in-out';
    fl.style.transition = 'transform ' + (SEK + 1) + 's ease-in-out';
    transform(fl, ziel[0], ziel[1]);
  }

  function kartenLegende() {
    var s = '<div class="titel">Tische nach Baustand</div>';
    for (var i = 0; i < karte.stufen.length; i++) {
      var st = karte.stufen[i];
      if (!st.n) continue;
      s += '<div class="z"><i style="background:' + st.farbe + '"></i><span class="n num">' + st.n + '</span>' + st.name + '</div>';
    }
    $('klegende').innerHTML = s + '<div class="klein">Farben wie die Nalpi-Karte · Luftbild © swisstopo</div>';
  }

  // neuAusrichten: Flaeche an den Schirm anpassen und Gleitweg neu (Start, Groessenaenderung)
  function karteZeichnen(neuAusrichten) {
    if (!karte || !karte.tische || typeof L === 'undefined') return;
    var fl = $('kartenFlaeche');
    if (!map) {
      neuAusrichten = true;
      map = L.map(fl, { zoomControl: false, attributionControl: false, dragging: false, touchZoom: false,
        scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false, keyboard: false,
        zoomSnap: 0, fadeAnimation: false, zoomAnimation: false, markerZoomAnimation: false, inertia: false });
      L.tileLayer('https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.swissimage/default/current/3857/{z}/{x}/{y}.jpeg',
        { maxNativeZoom: 20, maxZoom: 22, keepBuffer: 4 }).addTo(map);
      tischEbene = L.layerGroup().addTo(map);
    }
    tischEbene.clearLayers();
    var rd = L.canvas({ padding: 0.1 }), lat0 = karte.wgs.lat0, lng0 = karte.wgs.lng0, g = null;
    for (var i = 0; i < karte.tische.length; i++) {
      var t = karte.tische[i], st = karte.stufen[t[0]];
      if (!st) continue;
      var pts = [];
      for (var j = 1; j + 1 < t.length; j += 2) pts.push([lat0 + t[j] / 1e6, lng0 + t[j + 1] / 1e6]);
      if (pts.length < 3) continue;
      var poly = L.polygon(pts, { renderer: rd, interactive: false, color: 'rgba(0,0,0,0.6)', weight: 1,
        fillColor: st.farbe, fillOpacity: 0.95 });
      tischEbene.addLayer(poly);
      if (g) g.extend(poly.getBounds()); else g = poly.getBounds();
    }
    kartenLegende();
    if (!g || !neuAusrichten) return;
    grenzen = g;
    fl.style.width = Math.round(window.innerWidth * FAKTOR) + 'px';
    fl.style.height = Math.round(window.innerHeight * FAKTOR) + 'px';
    map.invalidateSize(false);
    map.fitBounds(grenzen, { padding: [20, 20], animate: false });
    fahrtBerechnen();
  }

  function karteUebernehmen(d) {
    if (!d || !d.tische || !d.stufen || !d.wgs) return false;
    karte = d;
    karteZeichnen(false);
    return true;
  }

  function karteHolen() {
    var x = new XMLHttpRequest();
    x.open('GET', KQUELLE + '?t=' + new Date().getTime(), true);
    x.timeout = 30000;
    x.onload = function () {
      if (x.status !== 200) return;
      try {
        if (karteUebernehmen(JSON.parse(x.responseText))) {
          try { localStorage.setItem(KSPEICHER, x.responseText); } catch (e) {}
        }
      } catch (e) {}
    };
    x.send();
  }

  // ---------------------------------------------------------------- Wechsel Dashboard <-> Karte
  function param(n) {
    var m = new RegExp('[?&]' + n + '=([^&]*)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : '';
  }
  var SEK = Math.max(5, parseInt(param('sek'), 10) || 15);
  var NUR = param('nur');
  var zeigtKarte = false;

  function wechsel() {
    if (NUR === 'dash') return;
    var kann = !!(map && fahrt.a);            // ohne Kartendaten bleibt das Dashboard stehen
    zeigtKarte = kann && (NUR === 'karte' ? true : !zeigtKarte);
    $('seiteKarte').className = 'seite' + (zeigtKarte ? '' : ' aus');
    $('seiteDash').className = 'seite' + (zeigtKarte ? ' aus' : '');
    if (zeigtKarte) gleiten();
  }

  // ---------------------------------------------------------------- Laden
  function uebernehmen(d) {
    if (!d || !d.summe || !d.reihe) return false;
    stand = d;
    zeichnen();
    setTimeout(zeichnen, 500);   // nochmals, wenn das Layout steht (Plothoehe)
    return true;
  }

  function holen() {
    var x = new XMLHttpRequest();
    x.open('GET', QUELLE + '?t=' + new Date().getTime(), true);
    x.timeout = 20000;
    x.onload = function () {
      if (x.status !== 200) return;
      try {
        var d = JSON.parse(x.responseText);
        if (uebernehmen(d)) {
          letzteAntwort = new Date();
          $('fussZeit').textContent = 'abgefragt ' + zwei(letzteAntwort.getHours()) + ':' + zwei(letzteAntwort.getMinutes());
          try { localStorage.setItem(SPEICHER, x.responseText); } catch (e) {}
          // Karte nur holen, wenn Nalpi eine neue geschickt hat (~80 KB, nicht jede Minute)
          if (!karte || (d.karte_gelesen && d.karte_gelesen !== karte.gelesen)) karteHolen();
        }
      } catch (e) {}
    };
    x.send();
  }

  // Letzten Stand sofort zeigen (auch ohne Netz), dann frisch holen
  try { var alt = localStorage.getItem(SPEICHER); if (alt) uebernehmen(JSON.parse(alt)); } catch (e) {}
  try { var altK = localStorage.getItem(KSPEICHER); if (altK) karteUebernehmen(JSON.parse(altK)); } catch (e) {}
  letzteAntwort = new Date();
  uhr();
  holen();
  if (NUR === 'karte') setTimeout(wechsel, 1500);
  setInterval(uhr, 15000);
  setInterval(holen, ABFRAGE_MS);
  setInterval(wechsel, SEK * 1000);
  setTimeout(function () { location.reload(); }, NEU_LADEN_MS);
  var warte;
  window.addEventListener('resize', function () {
    clearTimeout(warte);
    warte = setTimeout(function () { zeichnen(); karteZeichnen(true); }, 200);
  });
})();
</script>
</body>
