<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bauprogramm-Animation · NalpSolar</title>
<script>
  window.NALP_GATE_KEY   = 'nalp_portal_unlock_v1';
  window.NALP_GATE_TITEL = 'Bauprogramm-Animation';
  window.NALP_GATE_SUB   = 'Code eingeben / Enter code';
</script>
<script src="assets/js/nalp-gate.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{ color-scheme:light; --rot:#D72622; --ink:#1a1a1a; --mut:#63676d; --line:#e3e5e8;
         --bohren:#008000; --stahl:#6b238e; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{ display:flex; flex-direction:column; font-family:Arial,"Helvetica Neue",sans-serif;
        color:var(--ink); background:#eef0f3; }
  header{ display:flex; align-items:center; gap:10px; padding:9px 12px;
          background:#fff; border-bottom:4px solid var(--rot); z-index:20; }
  header a.home{ color:var(--ink); text-decoration:none; font-size:20px; }
  header .logo img{ height:20px; display:block; }
  header h1{ font-size:15px; margin:0; font-weight:900; flex:1; white-space:nowrap;
             overflow:hidden; text-overflow:ellipsis; }
  header .stand{ font-size:11px; color:var(--mut); white-space:nowrap; }

  .tabs{ display:flex; gap:8px; padding:8px 12px; background:#fff; border-bottom:1px solid var(--line); }
  .tab{ flex:1; max-width:230px; padding:9px 12px; border:1px solid var(--line); border-radius:6px;
        background:#f6f7f9; font-weight:900; font-size:14px; cursor:pointer; text-align:center; }
  .tab.on[data-g="bohren"]{ background:var(--bohren); border-color:var(--bohren); color:#fff; }
  .tab.on[data-g="stahlbau"]{ background:var(--stahl); border-color:var(--stahl); color:#fff; }

  #map{ flex:1; min-height:260px; }

  .hud{ background:#fff; border-top:1px solid var(--line);
        padding:8px 12px calc(10px + env(safe-area-inset-bottom)); }
  .zeile1{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .kw{ font-size:16px; font-weight:900; min-width:215px; }
  .kw small{ font-weight:400; color:var(--mut); }
  .btn{ border:1px solid var(--line); background:#f6f7f9; border-radius:6px; padding:7px 12px;
        font-size:14px; font-weight:700; cursor:pointer; }
  .btn.play{ min-width:46px; }
  .saison{ font-size:11.5px; color:var(--mut); margin-left:auto; }
  .strip{ width:100%; height:14px; display:block; margin:7px 0 2px; border:1px solid var(--line);
          border-radius:3px; }
  input[type=range]{ width:100%; margin:2px 0 6px; accent-color:var(--rot); }

  .aktiv-liste{ display:flex; flex-wrap:wrap; gap:6px; min-height:30px; align-items:center; }
  .chip{ font-size:12.5px; font-weight:700; padding:4px 9px; border-radius:20px; color:#fff; }
  .chip small{ font-weight:400; opacity:.9; }
  .chip.ohne{ background:#8a5a00; }
  .chip.hinweis{ background:#555; }
  .leer{ font-size:12.5px; color:var(--mut); }

  .legende{ display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--mut); margin-top:6px; }
  .legende b{ display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:4px;
              vertical-align:-1px; }
  .quelle{ font-size:10.5px; color:#9aa0a7; margin-top:6px; line-height:1.5; }
  .toast{ position:absolute; left:50%; top:14px; transform:translateX(-50%); z-index:900;
          background:rgba(20,25,32,.85); color:#fff; padding:7px 14px; border-radius:20px;
          font-size:13px; opacity:0; transition:opacity .3s; pointer-events:none; }
  .toast.on{ opacity:1; }
  .hull-tip{ font-family:Arial,sans-serif; font-size:12px; font-weight:700; }
  @media (max-width:560px){
    .kw{ min-width:0; font-size:14px; }
    header .stand{ display:none; }
  }
</style>
</head>
<body>
<header>
  <a class="home" href="index.html">←</a>
  <div class="logo"><img src="assets/img/strabag-logo.png" alt="STRABAG"></div>
  <h1>Bauprogramm-Animation</h1>
  <div class="stand" id="stand"></div>
</header>

<div class="tabs">
  <button class="tab on" data-g="bohren"  onclick="setGewerk('bohren')">🟢 Bohren</button>
  <button class="tab"    data-g="stahlbau" onclick="setGewerk('stahlbau')">🟣 Stahlbau</button>
</div>

<div id="map"><div class="toast" id="toast"></div></div>

<div class="hud">
  <div class="zeile1">
    <span class="kw" id="kwLabel">–</span>
    <button class="btn play" id="btnPlay" onclick="togglePlay()">▶</button>
    <button class="btn" onclick="step(-1)">−1 Wo</button>
    <button class="btn" onclick="step(1)">+1 Wo</button>
    <button class="btn" onclick="gehZuHeute()">Heute</button>
    <span class="saison" id="saison"></span>
  </div>
  <canvas class="strip" id="strip" height="14"></canvas>
  <input type="range" id="slider" min="0" max="1" value="0" step="1">
  <div class="aktiv-liste" id="aktivListe"></div>
  <div class="legende" id="legende"></div>
  <div class="quelle" id="quelle"></div>
</div>

<script>
'use strict';
var GG={ bohren:{name:'Bohren', col:'#008000', icon:'🟢'},
         stahlbau:{name:'Stahlbau', col:'#6b238e', icon:'🟣'} };
var DATA=null, map=null, canvasR=null, gewerk='bohren';
var dots={};            // code -> [circleMarker,...]
var dotState={};        // code -> zuletzt gesetzter Stil-Key
var hulls={};           // code -> L.polygon (nur wenn aktiv)
var anim={ bohren:{weeks:[],idx:0,byWeek:[]}, stahlbau:{weeks:[],idx:0,byWeek:[]} };
var playTimer=null;

function pd(s){ var t=s.split('-'); return new Date(Date.UTC(+t[0],+t[1]-1,+t[2])); }
function iso(d){ return d.toISOString().slice(0,10); }
function fmt(s){ var t=s.split('-'); return t[2]+'.'+t[1]+'.'+t[0]; }
function fmtK(s){ var t=s.split('-'); return t[2]+'.'+t[1]+'.'; }
function monday(d){ var x=new Date(d); var w=(x.getUTCDay()+6)%7; x.setUTCDate(x.getUTCDate()-w); return x; }
function isoWeek(d){ var x=new Date(d); x.setUTCDate(x.getUTCDate()+3-((x.getUTCDay()+6)%7));
  var w1=new Date(Date.UTC(x.getUTCFullYear(),0,4)); w1.setUTCDate(w1.getUTCDate()+3-((w1.getUTCDay()+6)%7));
  return 1+Math.round((x-w1)/6048e5); }

/* ── Wochenraster + Aktivitaet je Gewerk vorberechnen ── */
function buildAnim(g){
  var es=DATA.eintraege.filter(function(e){ return e.gewerk===g; });
  var min=null,max=null;
  es.forEach(function(e){ e.segmente.forEach(function(s){
    if(!min||s[0]<min) min=s[0];
    if(!max||s[1]>max) max=s[1];
  });});
  var weeks=[], w=monday(pd(min)), end=pd(max);
  while(w<=end){ weeks.push(new Date(w)); w=new Date(w); w.setUTCDate(w.getUTCDate()+7); }
  var byWeek=weeks.map(function(mo){
    var so=new Date(mo); so.setUTCDate(so.getUTCDate()+6);
    var a=iso(mo), b=iso(so);
    var akt=[];
    es.forEach(function(e){
      e.segmente.forEach(function(s){
        if(s[0]<=b && s[1]>=a) akt.push({e:e,von:s[0],bis:s[1]});
      });
    });
    return akt;
  });
  anim[g]={weeks:weeks, idx:0, byWeek:byWeek, eintraege:es};
}

/* ── Karte ── */
function initMap(){
  canvasR=L.canvas({padding:.3});
  map=L.map('map',{renderer:canvasR, zoomControl:true});
  L.tileLayer('https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.swissimage/default/current/3857/{z}/{x}/{y}.jpeg',
    {maxZoom:20, attribution:'© swisstopo'}).addTo(map);
  var all=[];
  Object.keys(DATA.tische).forEach(function(code){
    dots[code]=DATA.tische[code].map(function(t){
      all.push([t[1],t[2]]);
      return L.circleMarker([t[1],t[2]],{radius:4,stroke:false,fillOpacity:.9,fillColor:'#bbb'})
              .bindTooltip('Tisch '+t[0]+' · '+code,{sticky:true});
    });
    dots[code].forEach(function(m){ m.addTo(map); });
  });
  map.fitBounds(L.latLngBounds(all).pad(0.06));
}

/* Stil je Zustand: aktiv | teils | erledigt | offen | kein */
function styleFor(state,col){
  if(state==='aktiv')    return {fillColor:col,fillOpacity:1,radius:5.5};
  if(state==='erledigt') return {fillColor:'#2b3a46',fillOpacity:.85,radius:4};
  if(state==='teils')    return {fillColor:'#7d919e',fillOpacity:.85,radius:4};
  if(state==='offen')    return {fillColor:'#d7dbdf',fillOpacity:.9,radius:3.5};
  return {fillColor:'#e7e9ec',fillOpacity:.5,radius:2.5};   // kein Programm in diesem Gewerk
}

function render(){
  var A=anim[gewerk], col=GG[gewerk].col;
  var mo=A.weeks[A.idx], so=new Date(mo); so.setUTCDate(so.getUTCDate()+6);
  var a=iso(mo), b=iso(so);

  /* Zustand je Bereichs-Code */
  var st={};
  A.eintraege.forEach(function(e){
    if(!e.code) return;
    var s=st[e.code]||{done:0,tot:0,akt:false};
    e.segmente.forEach(function(seg){
      s.tot++;
      if(seg[1]<a) s.done++;
      if(seg[0]<=b && seg[1]>=a) s.akt=true;
    });
    st[e.code]=s;
  });
  Object.keys(dots).forEach(function(code){
    var s=st[code];
    var state=!s?'kein':(s.akt?'aktiv':(s.done===s.tot?'erledigt':(s.done>0?'teils':'offen')));
    var key=state+gewerk;
    if(dotState[code]===key) return;
    dotState[code]=key;
    var sty=styleFor(state,col);
    dots[code].forEach(function(m){ m.setStyle(sty); });
  });

  /* Huellen aktiver Bereiche */
  Object.keys(hulls).forEach(function(code){
    if(!st[code]||!st[code].akt){ map.removeLayer(hulls[code]); delete hulls[code]; }
  });
  var akt=A.byWeek[A.idx];
  akt.forEach(function(x){
    var c=x.e.code;
    if(!c||hulls[c]||!DATA.huellen[c]) return;
    hulls[c]=L.polygon(DATA.huellen[c],{color:col,weight:2.5,fillColor:col,fillOpacity:.14})
      .bindTooltip('<span class="hull-tip">'+c+' · '+GG[gewerk].name+' '+fmtK(x.von)+'–'+fmt(x.bis)+
                   (x.e.mt?' · '+x.e.mt+' MT':'')+'</span>',{sticky:true})
      .addTo(map);
  });

  /* HUD */
  document.getElementById('kwLabel').innerHTML='KW '+isoWeek(mo)+' <small>'+
    fmtK(a)+'–'+fmt(b)+'</small>';
  var sl=document.getElementById('slider'); sl.max=A.weeks.length-1; sl.value=A.idx;

  var L1=document.getElementById('aktivListe'); L1.innerHTML='';
  var saison=[];
  var karte=akt.filter(function(x){ return x.e.code; });
  var ohneK=karte.filter(function(x){ return !DATA.tische[x.e.code]; });
  var mitK=karte.filter(function(x){ return DATA.tische[x.e.code]; });
  var hinw=akt.filter(function(x){ return x.e.tag==='hinweis'; });
  akt.filter(function(x){ return x.e.tag==='saison'; }).forEach(function(x){
    saison.push(x.e.label.replace(' (Saison)','')+' '+fmtK(x.von)+'–'+fmt(x.bis));
  });
  function chip(x,cls,extra){
    var d=document.createElement('span'); d.className='chip '+(cls||'');
    if(!cls) d.style.background=GG[gewerk].col;
    d.innerHTML=x.e.label+(x.e.mt?' <small>('+x.e.mt+' MT)</small>':'')+
      ' <small>'+fmtK(x.von)+'–'+fmtK(x.bis)+'</small>'+(extra||'');
    L1.appendChild(d);
  }
  mitK.forEach(function(x){ chip(x); });
  ohneK.forEach(function(x){ chip(x,'ohne',' <small>· ohne Karte (PZ3–6)</small>'); });
  hinw.forEach(function(x){ chip(x,'hinweis'); });
  if(!L1.children.length){
    var mth=mo.getUTCMonth()+1;
    L1.innerHTML='<span class="leer">'+((mth<=3||mth>=12)?'Winterpause – ':'')+
      'keine '+GG[gewerk].name+'-Arbeiten in dieser Woche</span>';
  }
  document.getElementById('saison').textContent=saison.join(' · ');
  drawStrip();
}

function drawStrip(){
  var A=anim[gewerk], cv=document.getElementById('strip');
  cv.width=cv.clientWidth*(window.devicePixelRatio||1);
  var ctx=cv.getContext('2d'), W=cv.width, H=cv.height, n=A.weeks.length;
  ctx.clearRect(0,0,W,H);
  for(var i=0;i<n;i++){
    var akt=A.byWeek[i].some(function(x){ return x.e.code; });
    ctx.fillStyle=akt?GG[gewerk].col:'#eceef1';
    ctx.fillRect(i/n*W,0,Math.max(1,W/n-0.5),H);
  }
  /* Heute-Markierung */
  var t=monday(new Date()), i0=A.weeks.findIndex(function(w){ return iso(w)===iso(t); });
  if(i0>=0){ ctx.fillStyle='#D72622'; ctx.fillRect(i0/n*W,0,2,H); }
  /* Cursor */
  ctx.strokeStyle='#1a1a1a'; ctx.lineWidth=2;
  ctx.strokeRect(A.idx/n*W,1,Math.max(2,W/n),H-2);
}

/* ── Steuerung ── */
function setGewerk(g){
  gewerk=g;
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('on',t.dataset.g===g); });
  dotState={};                       // Stile neu setzen
  Object.keys(hulls).forEach(function(c){ map.removeLayer(hulls[c]); delete hulls[c]; });
  stopPlay(); render();
}
function step(d){
  var A=anim[gewerk];
  A.idx=Math.min(Math.max(A.idx+d,0),A.weeks.length-1);
  render();
}
function nextActiveWeek(from){
  var A=anim[gewerk];
  for(var i=from;i<A.weeks.length;i++)
    if(A.byWeek[i].some(function(x){ return x.e.code; })) return i;
  return -1;
}
function tick(){
  var A=anim[gewerk];
  if(A.idx>=A.weeks.length-1){ stopPlay(); return; }
  var nxt=A.idx+1;
  if(!A.byWeek[nxt].some(function(x){ return x.e.code; })){
    var j=nextActiveWeek(nxt);
    if(j>nxt){
      toast('⏭ '+(j-nxt)+' Wochen ohne '+GG[gewerk].name+' übersprungen (Winter)');
      nxt=j;
    } else if(j<0){ A.idx=A.weeks.length-1; render(); stopPlay(); return; }
  }
  A.idx=nxt; render();
}
function togglePlay(){
  if(playTimer){ stopPlay(); return; }
  var A=anim[gewerk];
  if(A.idx>=A.weeks.length-1) A.idx=0;
  playTimer=setInterval(tick,850);
  document.getElementById('btnPlay').textContent='⏸';
}
function stopPlay(){
  if(playTimer){ clearInterval(playTimer); playTimer=null; }
  document.getElementById('btnPlay').textContent='▶';
}
function gehZuHeute(){
  var A=anim[gewerk], t=iso(monday(new Date()));
  var i=A.weeks.findIndex(function(w){ return iso(w)===t; });
  if(i<0) i=(t<iso(A.weeks[0]))?0:A.weeks.length-1;
  stopPlay(); A.idx=i; render();
}
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('on'); },2200);
}

/* ── Start ── */
fetch('uploads/bauprogramm_gantt.json',{cache:'no-store'})
  .then(function(r){ if(!r.ok) throw 0; return r.json(); })
  .then(function(j){
    DATA=j;
    document.getElementById('stand').textContent='Bauprogramm 2026+ · Stand '+j.stand;
    document.getElementById('quelle').textContent='Quelle: '+j.quelle+' — '+j.hinweis;
    document.getElementById('legende').innerHTML=
      '<span><b style="background:#008000"></b>aktiv (Bohren)</span>'+
      '<span><b style="background:#6b238e"></b>aktiv (Stahlbau)</span>'+
      '<span><b style="background:#2b3a46"></b>erledigt</span>'+
      '<span><b style="background:#7d919e"></b>teilweise erledigt</span>'+
      '<span><b style="background:#d7dbdf"></b>ausstehend</span>'+
      '<span><b style="background:#e7e9ec"></b>kein Eintrag in diesem Gewerk</span>';
    buildAnim('bohren'); buildAnim('stahlbau');
    initMap();
    gehZuHeute();
    /* Deep-Link: ?g=stahlbau&w=2027-06-15 (Woche, die dieses Datum enthaelt) */
    try{
      var q=new URLSearchParams(location.search);
      var g=q.get('g'); if(g&&GG[g]) setGewerk(g);
      var wq=q.get('w');
      if(wq&&/^\d{4}-\d{2}-\d{2}$/.test(wq)){
        var A=anim[gewerk], zi=iso(monday(pd(wq)));
        var i=A.weeks.findIndex(function(x){ return iso(x)===zi; });
        if(i>=0){ A.idx=i; render(); }
      }
    }catch(e){}
    document.getElementById('slider').addEventListener('input',function(){
      stopPlay(); anim[gewerk].idx=+this.value; render();
    });
    window.addEventListener('resize',drawStrip);
  })
  .catch(function(){ alert('Bauprogramm-Daten konnten nicht geladen werden.'); });

if('serviceWorker' in navigator)
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
</script>
</body>
</html>
