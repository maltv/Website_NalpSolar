<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NalpSolar · Erfassungen</title>
<meta name="theme-color" content="#0b1826">
<script src="assets/js/nalp-gate.js"></script>
<style>
  :root{--bg:#eef1f5;--card:#fff;--line:rgba(10,22,38,.12);--txt:#14202e;--muted:#5b6b7c;--blue:#0b5fff;--green:#12a457;--orange:#ff8a3d;--red:#e5484d;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{display:flex;flex-direction:column;background:var(--bg);color:var(--txt);font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;}

  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px calc(10px + env(safe-area-inset-top));
    color:#e8eef7;background:radial-gradient(120% 160% at 0 0,#173657,#0b1826);box-shadow:0 2px 14px rgba(0,0,0,.3);}
  .top .brand{font-size:10px;letter-spacing:.22em;font-weight:800;color:#ffc340;text-transform:uppercase;}
  .top h1{font-size:16px;font-weight:900;margin:1px 0 0;}
  .top .sp{flex:1;}
  .btn{border:0;border-radius:11px;padding:10px 14px;font-weight:800;font-size:14px;color:#fff;cursor:pointer;white-space:nowrap;}
  .btn.home{background:linear-gradient(135deg,#0b5fff,#2196F3);}
  .btn.exp{background:linear-gradient(135deg,#1c8a4a,#12a457);}
  .btn.ghost{background:rgba(255,255,255,.14);}

  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--line);}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tab{border:1px solid var(--line);background:#f6f8fb;color:var(--txt);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:800;cursor:pointer;}
  .tab.on{background:var(--blue);border-color:var(--blue);color:#fff;}
  .tab .n{opacity:.65;font-weight:700;margin-left:5px;}
  .tab.on .n{opacity:.85;}
  .search{flex:1;min-width:160px;}
  .search input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;background:#fff;color:var(--txt);}
  .count{font-size:12px;color:var(--muted);white-space:nowrap;}

  .wrap{flex:1;min-height:0;overflow:auto;padding:12px 14px 40px;}
  table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px;}
  thead th{position:sticky;top:0;background:#f3f6fa;text-align:left;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;
    color:var(--muted);padding:10px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;z-index:2;}
  thead th .ar{opacity:.5;font-size:10px;}
  tbody td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  tbody tr:last-child td{border-bottom:0;}
  tbody tr:nth-child(even){background:#fafbfd;}
  .chip{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;color:#fff;white-space:nowrap;}
  .chip.primaer{background:var(--blue);} .chip.modultraeger{background:var(--green);} .chip.vorkommnis{background:var(--orange);}
  .chip.stahlteile{background:#c85a12;}
  .sev{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 7px;}
  .sev.Info{background:#e6effb;color:#25507f;} .sev.Mittel{background:#fff6d6;color:#8a6d00;}
  .sev.Hoch{background:#ffe6d3;color:#b5510f;} .sev.Stopp{background:#fde2e2;color:#b0242a;}
  .tid{font-weight:800;} .von{color:var(--muted);}
  .syn{display:inline-block;width:8px;height:8px;border-radius:50%;}
  .syn.ok{background:var(--green);} .syn.off{background:#e8a012;}
  .empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px;}
  .note{font-size:11.5px;color:var(--muted);padding:8px 2px 0;line-height:1.5;}
  .err{color:#b0242a;font-weight:700;}
  @media(max-width:640px){ .top h1{font-size:15px;} table{font-size:12.5px;} }
</style>
</head>
<body>
<div class="top">
  <button class="btn home" onclick="location.href='index.html'">🏠 Start</button>
  <div><div class="brand">NalpSolar · STRABAG B8-13</div><h1>📋 Erfassungen</h1></div>
  <span class="sp"></span>
  <button class="btn ghost" onclick="load(true)">⟳ Aktualisieren</button>
  <button class="btn exp" onclick="exportCsv()">⬇ CSV / Excel</button>
</div>

<div class="bar">
  <div class="tabs" id="tabs"></div>
  <span class="sp"></span>
  <div class="search"><input id="q" type="search" placeholder="Suche: Tisch-ID, Text, Name …"></div>
  <span class="count" id="count">–</span>
</div>

<div class="wrap">
  <div id="tableHost"></div>
  <div class="note" id="note"></div>
</div>

<script>
var DB='https://highscore-test-2e784-default-rtdb.europe-west1.firebasedatabase.app';
var KINDS={ primaer:'Primärkonstruktion', modultraeger:'Modulträger', vorkommnis:'Vorkommnis', stahlteile:'Stahlteil (GPS)' };
var LS_LOG='nalp_erfassung_log_v1';
var state={ rows:[], filter:'alle', q:'', sortKey:'ts', sortDir:-1 };

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmtDate(iso){ if(!iso) return ''; var p=String(iso).split('-'); return p.length===3? p[2]+'.'+p[1]+'.'+p[0] : iso; }
function fmtTs(ts){ if(!ts) return ''; var d=new Date(ts); function z(n){return String(n).padStart(2,'0');} return z(d.getDate())+'.'+z(d.getMonth()+1)+'.'+d.getFullYear()+' '+z(d.getHours())+':'+z(d.getMinutes()); }

function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_LOG)||'[]'); }catch(e){ return []; } }

function normalize(rec, art, fb){
  return { art:art||rec.art||'', tischId:rec.tischId||'', typ:rec.typ||rec.teilTyp||'', schwere:rec.schwere||'',
    titel:rec.titel||'', text:rec.text||'', bemerkung:rec.bemerkung||'', datum:rec.datum||'',
    von:rec.von||'', ts:rec.ts||0, fb: fb===true ? true : (rec.fb===true),
    anzahl:rec.anzahl||'', lat:(typeof rec.lat==='number'?rec.lat:null), lon:(typeof rec.lon==='number'?rec.lon:null), acc:rec.acc||'' };
}

function merge(fbData, local){
  var byTs={};
  function add(r){ if(!r) return; var k=r.ts||(r.art+'|'+r.tischId+'|'+r.titel+'|'+r.datum+'|'+r.von); byTs[k]=Object.assign({}, byTs[k]||{}, r, { fb: (byTs[k]&&byTs[k].fb) || r.fb }); }
  if(fbData){ Object.keys(KINDS).forEach(function(art){ var node=fbData[art]; if(node) Object.keys(node).forEach(function(id){ add(normalize(node[id], art, true)); }); }); }
  local.forEach(function(r){ add(normalize(r, r.art, r.fb)); });
  return Object.keys(byTs).map(function(k){return byTs[k];});
}

function load(force){
  setNote('Lade aus Firebase …');
  fetch(DB+'/erfassung.json',{cache:'no-store'})
    .then(function(r){ return r.ok? r.json():null; })
    .then(function(data){
      state.rows = merge(data, lsLoad());
      setNote(data===null ? '<span class="err">Firebase nicht erreichbar</span> – es werden nur lokal auf diesem Gerät gespeicherte Einträge gezeigt.' :
        'Live aus Firebase (Projekt highscore-test-2e784) · '+state.rows.length+' Einträge gesamt · Stand '+fmtTs(Date.now()));
      render();
    })
    .catch(function(){ state.rows = merge(null, lsLoad()); setNote('<span class="err">Offline</span> – nur lokale Einträge.'); render(); });
}

function setNote(h){ document.getElementById('note').innerHTML=h; }

function filtered(){
  var q=state.q.toLowerCase();
  var rows=state.rows.filter(function(r){
    if(state.filter!=='alle' && r.art!==state.filter) return false;
    if(!q) return true;
    return [r.tischId,r.typ,r.schwere,r.titel,r.text,r.bemerkung,r.von,fmtDate(r.datum)].join(' ').toLowerCase().indexOf(q)>=0;
  });
  var k=state.sortKey, d=state.sortDir;
  rows.sort(function(a,b){ var x=a[k], y=b[k];
    if(k==='tischId'){ x=parseInt(x,10)||0; y=parseInt(y,10)||0; }
    if(x<y) return -1*d; if(x>y) return 1*d; return 0; });
  return rows;
}

var COLS=[
  {k:'ts',      t:'Erfasst'},
  {k:'art',     t:'Art'},
  {k:'tischId', t:'Tisch-ID'},
  {k:'typ',     t:'Typ'},
  {k:'schwere', t:'Schwere'},
  {k:'inhalt',  t:'Titel / Bemerkung', ns:true},
  {k:'datum',   t:'Datum'},
  {k:'von',     t:'Erfasst von'}
];

function renderTabs(){
  var counts={alle:state.rows.length}; Object.keys(KINDS).forEach(function(a){ counts[a]=state.rows.filter(function(r){return r.art===a;}).length; });
  var defs=[['alle','Alle']].concat(Object.keys(KINDS).map(function(a){return [a,KINDS[a]];}));
  document.getElementById('tabs').innerHTML=defs.map(function(d){
    return '<button class="tab'+(state.filter===d[0]?' on':'')+'" data-f="'+d[0]+'">'+d[1]+'<span class="n">'+(counts[d[0]]||0)+'</span></button>';
  }).join('');
  document.querySelectorAll('.tab').forEach(function(b){ b.onclick=function(){ state.filter=b.dataset.f; render(); }; });
}

function render(){
  renderTabs();
  var rows=filtered();
  document.getElementById('count').textContent=rows.length+' angezeigt';
  var host=document.getElementById('tableHost');
  if(!rows.length){ host.innerHTML='<div class="empty">Keine Einträge.'+(state.q?' (Filter/Suche aktiv)':'')+'</div>'; return; }
  var head='<tr>'+COLS.map(function(c){
    var ar = state.sortKey===c.k ? (state.sortDir<0?' ▼':' ▲') : '';
    return '<th data-k="'+c.k+'">'+c.t+'<span class="ar">'+ar+'</span></th>';
  }).join('')+'<th>DB</th></tr>';
  var body=rows.map(function(r){
    var inhalt = r.art==='vorkommnis'
      ? (r.titel?'<b>'+esc(r.titel)+'</b>':'')+(r.text?(r.titel?'<br>':'')+esc(r.text):'')
      : esc(r.bemerkung);
    if(r.art==='stahlteile'){
      var extra=[];
      if(r.anzahl && r.anzahl!=='1') extra.push('Anzahl '+esc(r.anzahl));
      if(r.lat!=null && r.lon!=null) extra.push('📍 '+r.lat.toFixed(5)+', '+r.lon.toFixed(5)+' (±'+esc(r.acc||'?')+' m)');
      inhalt=[esc(r.bemerkung||''), extra.join(' · ')].filter(Boolean).join('<br>');
    }
    return '<tr>'+
      '<td>'+esc(fmtTs(r.ts))+'</td>'+
      '<td><span class="chip '+r.art+'">'+esc(KINDS[r.art]||r.art)+'</span></td>'+
      '<td class="tid">'+esc(r.tischId)+'</td>'+
      '<td>'+esc(r.typ)+'</td>'+
      '<td>'+(r.schwere?'<span class="sev '+esc(r.schwere)+'">'+esc(r.schwere)+'</span>':'')+'</td>'+
      '<td>'+inhalt+'</td>'+
      '<td>'+esc(fmtDate(r.datum))+'</td>'+
      '<td class="von">'+esc(r.von)+'</td>'+
      '<td><span class="syn '+(r.fb?'ok':'off')+'" title="'+(r.fb?'in Firebase':'nur lokal')+'"></span></td>'+
    '</tr>';
  }).join('');
  host.innerHTML='<table><thead>'+head+'</thead><tbody>'+body+'</tbody></table>';
  host.querySelectorAll('th[data-k]').forEach(function(th){ th.onclick=function(){
    var k=th.dataset.k; if(state.sortKey===k) state.sortDir*=-1; else { state.sortKey=k; state.sortDir=(k==='ts'||k==='datum')?-1:1; } render();
  };});
}

function exportCsv(){
  var rows=filtered();
  var head=['Erfasst','Art','Tisch-ID','Typ','Schwere','Titel','Beschreibung/Bemerkung','Datum','Erfasst von','in Firebase'];
  function cell(v){ v=String(v==null?'':v).replace(/"/g,'""'); return '"'+v+'"'; }
  var lines=[head.map(cell).join(';')];
  rows.forEach(function(r){
    var bem = r.art==='vorkommnis' ? r.text : r.bemerkung;
    if(r.art==='stahlteile' && r.lat!=null && r.lon!=null) bem=(bem?bem+' ':'')+'[GPS '+r.lat.toFixed(6)+','+r.lon.toFixed(6)+' ±'+(r.acc||'?')+'m]';
    lines.push([fmtTs(r.ts), KINDS[r.art]||r.art, r.tischId, r.typ, r.schwere,
      (r.art==='vorkommnis'?r.titel:''), bem,
      fmtDate(r.datum), r.von, r.fb?'ja':'nein'].map(cell).join(';'));
  });
  var csv='﻿'+lines.join('\r\n');  // BOM für Excel-Umlaute
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob), a=document.createElement('a');
  var d=new Date(); function z(n){return String(n).padStart(2,'0');}
  a.href=url; a.download='NalpSolar_Erfassungen_'+d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+'.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(url);},1500);
}

document.getElementById('q').addEventListener('input', function(){ state.q=this.value.trim(); render(); });
load(true);

if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
</body>
</html>
