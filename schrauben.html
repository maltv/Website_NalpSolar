<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NalpSolar · Schrauben je Bereich</title>
<meta name="theme-color" content="#ffffff">
<script>
  window.NALP_GATE_CODE  = '6460';
  window.NALP_GATE_KEY   = 'nalp_portal_unlock_v1';
  window.NALP_GATE_TITEL = 'Schrauben je Bereich';
  window.NALP_GATE_SUB   = 'Code eingeben / Enter code / Wpisz kod';
</script>
<script src="assets/js/nalp-gate.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{ color-scheme:light; --rot:#D72622; --ink:#1a1a1a; --mut:#63676d; --line:#e3e5e8;
         --blau:#1565c0; --gelb:#e0a800; --gruen:#1e9e5a; --grau:#8a8e94; --bg:#eef0f3; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); min-height:100vh; color:var(--ink);
        font-family:Arial,"Helvetica Neue",sans-serif; }
  header{ position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:8px;
          padding:9px 10px; background:#fff; border-bottom:4px solid var(--rot); }
  header a.home{ color:var(--ink); text-decoration:none; font-size:20px; }
  header h1{ font-size:14.5px; margin:0; flex:1; font-weight:800; }
  main{ max-width:820px; margin:0 auto; padding:10px 10px 60px; }
  .box{ background:#fff; border:1px solid var(--line); border-left:5px solid var(--rot);
        border-radius:6px; padding:12px; margin-bottom:11px; box-shadow:0 1px 4px rgba(20,25,32,.07); }
  .box h2{ font-size:13px; margin:0 0 9px; text-transform:uppercase; letter-spacing:.04em; color:var(--mut); }
  .box.plain{ border-left-color:#c9ccd2; }
  .sub{ font-size:12px; color:var(--mut); line-height:1.5; }

  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chips button{ border:1.5px solid #c9ccd2; background:#fff; color:var(--ink); border-radius:20px;
        padding:7px 11px; font-size:12.5px; font-weight:800; cursor:pointer; font-family:inherit; }
  .chips button.on{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .chips button small{ font-weight:700; opacity:.75; margin-left:4px; }
  .gruppe{ font-size:11px; font-weight:800; color:var(--mut); text-transform:uppercase;
        letter-spacing:.05em; margin:10px 0 5px; }
  .gruppe:first-child{ margin-top:0; }

  #kartenBox{ padding:0; overflow:hidden; }
  #karte{ height:340px; width:100%; background:#dde1e6; }

  .legende{ display:flex; flex-wrap:wrap; gap:9px; padding:9px 12px; border-top:1px solid var(--line);
        font-size:11.5px; color:var(--mut); }
  .legende span{ display:flex; align-items:center; gap:4px; }
  .legende i{ width:12px; height:12px; border-radius:50%; display:inline-block; border:1.5px solid #fff;
        box-shadow:0 0 0 1px rgba(0,0,0,.25); }

  table.t{ width:100%; border-collapse:collapse; font-size:13.5px; }
  table.t th{ text-align:left; font-size:11px; color:var(--mut); text-transform:uppercase;
        letter-spacing:.04em; padding:4px 5px; border-bottom:1px solid var(--line); }
  table.t td{ padding:5px; border-bottom:1px solid var(--line); }
  table.t td.n{ text-align:right; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
  table.t tr.gross td{ font-size:15px; font-weight:900; border-bottom:none; }
  .warn{ background:#fdeeee; border:1px solid #e0a3a1; border-radius:5px; padding:9px 11px;
        font-size:12px; color:#8a1f1c; line-height:1.5; margin-top:9px; }
  .btnzeile{ display:flex; gap:8px; flex-wrap:wrap; margin-top:11px; }
  .btn{ background:var(--ink); color:#fff; border:none; border-radius:6px; padding:11px 15px;
        font-size:13.5px; font-weight:800; cursor:pointer; font-family:inherit; }
  .btn.ghost{ background:#fff; color:var(--ink); border:1.5px solid #c9ccd2; }
  .quelle{ font-size:11px; color:var(--mut); line-height:1.55; margin-top:9px; }
  @media print{ header,.chips,.btnzeile,#kartenBox{ display:none; } body{ background:#fff; } }
</style>
</head>
<body>

<header>
  <a class="home" href="index.html" title="Portal">←</a>
  <h1>Schrauben je Bereich</h1>
</header>

<main>

  <div class="box">
    <h2>Bereich wählen</h2>
    <div id="bereiche" class="sub">lade …</div>
  </div>

  <div class="box plain" id="kartenBox">
    <div id="karte"></div>
    <div class="legende" id="legende"></div>
  </div>

  <div class="box" id="ergebnis"></div>

</main>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════
   Schrauben je Bereich
   Bereich  → uploads/tables/bereiche.json  (Nalpi, Bauphasen_STRABAG_260410)
   Typ      → uploads/tables/typen.json     (ILF-Belegungslisten)
   Lage     → uploads/tables/modultische_all.json  [id,E,N,H,azimut,laenge,typ,h2]
   Schraube → RTDB erfassung/schrauben/<TYP>, im Admin erfasst (je Knieträger,
              hier × 2 Knieträger × Anzahl Konstruktionen)
   ══════════════════════════════════════════════════════════════ */
var RTDB='https://highscore-test-2e784-default-rtdb.europe-west1.firebasedatabase.app/erfassung/schrauben';
var TYPFARBE={ A:'#1565c0', B:'#D72622', C:'#8a8e94', D:'#1e9e5a', E:'#e0a800' };

var BEREICHE={}, TYPEN={}, LAGE={}, REGELN={}, AKTIV=null;
var karte=null, ebene=null;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function typName(t){ var m=/^([A-E])_?(.*)$/.exec(t||''); return m?('Typ '+m[1]+(m[2]?' '+m[2]:'')):(t||'?'); }
function grundTyp(t){ return (String(t).charAt(0)||'?').toUpperCase(); }
function heute(){ var d=new Date();
  return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear(); }

/* LV95 → WGS84 (Näherungsformeln swisstopo, wie in karte.html) */
function ch1903PlusToWgs84(north, east){
  var x=(north-1200000)/1000000, y=(east-2600000)/1000000;
  var latSex=16.9023892+3.238272*x-0.270978*y*y-0.002528*x*x-0.0447*y*y*x-0.0140*x*x*x;
  var lngSex=2.6779094+4.728982*y+0.791484*y*x+0.1306*y*x*x-0.0436*y*y*y;
  return [latSex*100/36, lngSex*100/36];
}

Promise.all([
  fetch('uploads/tables/bereiche.json').then(function(r){ return r.json(); }),
  fetch('uploads/tables/typen.json').then(function(r){ return r.json(); }),
  fetch('uploads/tables/modultische_all.json').then(function(r){ return r.json(); }),
  fetch(RTDB+'.json?_='+Date.now(),{cache:'no-store'}).then(function(r){ return r.json(); }).catch(function(){ return null; })
]).then(function(a){
  BEREICHE=a[0].bereiche||{};
  TYPEN=(a[1]&&a[1].typen)||{};
  (a[2]||[]).forEach(function(z){ LAGE[String(z[0])]={ e:z[1], n:z[2], typ:z[6] }; });
  REGELN=a[3]||{};
  chipsZeichnen();
  karteAufbauen();
  var bs=sortBereiche();
  if(bs.length) waehlen(bs[0]);
}).catch(function(){
  $('bereiche').innerHTML='<div class="warn">Daten konnten nicht geladen werden. '
    +'Einmal mit Internet öffnen, danach geht es auch offline.</div>';
});

function sortBereiche(){
  var s={};
  Object.keys(BEREICHE).forEach(function(id){ s[BEREICHE[id]]=(s[BEREICHE[id]]||0)+1; });
  return Object.keys(s).sort();
}
function gruppiert(){
  var g={};
  sortBereiche().forEach(function(b){
    var k=/^26_BP/.test(b)?'Baupiste B (2026)'
        :/^27_BP/.test(b)?'Baupiste C/D (2027)'
        :/^26_/.test(b)?'2026':'2027';
    (g[k]=g[k]||[]).push(b);
  });
  return g;
}

function chipsZeichnen(){
  var g=gruppiert(), h='';
  Object.keys(g).forEach(function(k){
    h+='<div class="gruppe">'+esc(k)+'</div><div class="chips">';
    g[k].forEach(function(b){
      var n=Object.keys(BEREICHE).filter(function(id){ return BEREICHE[id]===b; }).length;
      h+='<button data-b="'+esc(b)+'" onclick="waehlen(\''+esc(b)+'\')">'
        +esc(b.replace(/^2[67]_/,''))+'<small>'+n+'</small></button>';
    });
    h+='</div>';
  });
  $('bereiche').innerHTML=h;
}

function karteAufbauen(){
  karte=L.map('karte',{ zoomControl:true, attributionControl:false });
  L.tileLayer('https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.swissimage/default/current/3857/{z}/{x}/{y}.jpeg',
    { maxZoom:20, maxNativeZoom:19 }).addTo(karte);
  karte.setView([46.71,8.72],14);
  ebene=L.layerGroup().addTo(karte);
  var l='';
  ['A','B','C','D','E'].forEach(function(t){
    l+='<span><i style="background:'+TYPFARBE[t]+'"></i>Typ '+t+'</span>'; });
  l+='<span style="margin-left:auto">Farben wie der Normteile-Farbcode</span>';
  $('legende').innerHTML=l;
}

function waehlen(b){
  if(!b) return;
  AKTIV=b;
  Array.prototype.forEach.call(document.querySelectorAll('#bereiche button'),function(x){
    x.classList.toggle('on', x.getAttribute('data-b')===b); });

  var ids=Object.keys(BEREICHE).filter(function(id){ return BEREICHE[id]===b; }).sort(function(p,q){
    return (parseInt(p,10)||0)-(parseInt(q,10)||0); });

  // Karte
  ebene.clearLayers();
  var punkte=[];
  ids.forEach(function(id){
    var g=LAGE[id]; if(!g) return;
    var ll=ch1903PlusToWgs84(g.n, g.e);
    punkte.push(ll);
    var t=TYPEN[id]||g.typ||'?';
    L.circleMarker(ll,{ radius:6, weight:2, color:'#fff', fillColor:TYPFARBE[grundTyp(t)]||'#555',
      fillOpacity:.95 }).bindPopup('<b>Tisch '+esc(id)+'</b><br>'+esc(typName(t))+'<br>'+esc(b)).addTo(ebene);
  });
  if(punkte.length) karte.fitBounds(L.latLngBounds(punkte).pad(0.25));

  // Typen zählen
  var proTyp={}, ohneTyp=[];
  ids.forEach(function(id){
    var t=TYPEN[id]||(LAGE[id]&&LAGE[id].typ);
    if(!t){ ohneTyp.push(id); return; }
    (proTyp[t]=proTyp[t]||[]).push(id);
  });

  // Schrauben summieren
  var summe={}, ohneListe=[];
  Object.keys(proTyp).forEach(function(t){
    var r=REGELN[t];
    if(!r||!r.pos){ ohneListe.push(t); return; }
    var n=proTyp[t].length;
    r.pos.forEach(function(p){
      if(p.ort!=='berg'||!p.proKT) return;
      var stk=p.proKT*2*n;                       // je Knieträger × 2 × Konstruktionen
      summe[p.was]=(summe[p.was]||0)+stk;
      if(p.km){ var g=(String(p.was).match(/M\d+/)||[''])[0];
        summe['Kontermutter '+g]=(summe['Kontermutter '+g]||0)+stk; }
    });
  });

  // Ausgabe
  var h='<h2>'+esc(b)+' · '+ids.length+' Konstruktion'+(ids.length===1?'':'en')+'</h2>';
  h+='<table class="t"><thead><tr><th>Typ</th><th style="text-align:right">Stück</th><th>Tisch-Nr.</th></tr></thead><tbody>';
  Object.keys(proTyp).sort().forEach(function(t){
    h+='<tr><td><b style="color:'+(TYPFARBE[grundTyp(t)]||'#555')+'">■</b> '+esc(typName(t))+'</td>'
      +'<td class="n">'+proTyp[t].length+'</td>'
      +'<td style="font-size:11.5px;color:var(--mut)">'+esc(proTyp[t].join(', '))+'</td></tr>';
  });
  h+='</tbody></table>';

  var k=Object.keys(summe).sort();
  h+='<h2 style="margin-top:15px">Schrauben für den Berg – gesamt</h2>';
  if(k.length){
    h+='<table class="t"><tbody>';
    k.forEach(function(x){ h+='<tr class="gross"><td>'+esc(x)+'</td><td class="n">'+summe[x]+'</td></tr>'; });
    h+='</tbody></table>';
  } else {
    h+='<div class="sub">Für keinen Typ in diesem Bereich ist eine Schraubenliste erfasst.</div>';
  }

  if(ohneListe.length) h+='<div class="warn"><b>Noch keine Liste erfasst für: '
    +ohneListe.map(typName).map(esc).join(', ')+'.</b><br>'
    +'Diese Konstruktionen fehlen in der Summe. Im Admin unter «Schrauben» erfassen.</div>';
  if(ohneTyp.length) h+='<div class="warn">Ohne Typ in den Belegungslisten: '+esc(ohneTyp.join(', '))+'</div>';

  h+='<div class="btnzeile"><button class="btn" onclick="window.print()">🖨 Drucken / als PDF</button>'
    +'<button class="btn ghost" onclick="kopieren()">Liste kopieren</button></div>';

  h+='<div class="quelle">Bereich aus Nalpi (Bauphasen_STRABAG_260410), Typ aus den ILF-Belegungslisten, '
    +'Schraubenlisten im Admin erfasst (Anzahl je Knieträger × 2 Knieträger × Konstruktionen). '
    +'Nur Bergmontage – was im Tal vormontiert wird, steht nicht drin. Stand '+heute()+'.</div>';

  $('ergebnis').innerHTML=h;
  LETZTE={ b:b, summe:summe, proTyp:proTyp };
}

var LETZTE=null;
function kopieren(){
  if(!LETZTE) return;
  var t='Schrauben fuer den Berg · Bereich '+LETZTE.b+' · '+heute()+'\n';
  Object.keys(LETZTE.proTyp).sort().forEach(function(x){
    t+='  '+typName(x)+': '+LETZTE.proTyp[x].length+' Stk\n'; });
  t+='\n';
  Object.keys(LETZTE.summe).sort().forEach(function(x){ t+=LETZTE.summe[x]+' x '+x+'\n'; });
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(function(){ alert('Liste kopiert.'); });
  else prompt('Kopieren:', t);
}

if('serviceWorker' in navigator){ window.addEventListener('load',function(){
  navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
</body>
</html>
