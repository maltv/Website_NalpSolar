<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NalpSolar · Tagesrapport</title>
<meta name="theme-color" content="#0b1826">
<link rel="manifest" href="manifest.json">
<script>
  window.NALP_GATE_CODE  = '6460';
  window.NALP_GATE_KEY   = 'nalp_portal_unlock_v1';
  window.NALP_GATE_TITEL = 'Tagesrapport';
  window.NALP_GATE_SUB   = 'Code eingeben / Enter code / Wpisz kod';
</script>
<script src="assets/js/nalp-gate.js"></script>
<style>
  :root{
    --bg:#eef1f5; --card:#fff; --line:rgba(10,22,38,.12); --txt:#14202e; --muted:#5b6b7c;
    --blue:#0b5fff; --red:#d63a3f; --green:#1c8a4a; --amber:#e8a012;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;line-height:1.45;}
  .wrap{max-width:820px;margin:0 auto;padding:0 14px 60px;}

  .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 14px calc(10px + env(safe-area-inset-top));margin:0 -14px 14px;
    color:#e8eef7;background:radial-gradient(120% 160% at 0 0,#173657,#0b1826);box-shadow:0 2px 14px rgba(0,0,0,.3);}
  .top .brand{font-size:10px;letter-spacing:.22em;font-weight:800;color:#ffc340;text-transform:uppercase;}
  .top h1{font-size:16px;font-weight:900;margin:1px 0 0;}
  .top .sp{flex:1;}
  .home{border:0;border-radius:11px;padding:10px 14px;font-weight:800;font-size:14px;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,#0b5fff,#2196F3);white-space:nowrap;text-decoration:none;display:inline-block;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;
    box-shadow:0 6px 18px rgba(10,22,38,.06);}
  h2{font-size:15px;font-weight:900;margin:0 0 10px;display:flex;align-items:center;gap:8px;}
  .lead{font-size:12.5px;color:var(--muted);margin:-6px 0 12px;}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">

<div class="top">
  <div>
    <div class="brand">NalpSolar B8-13</div>
    <h1>Tagesrapport</h1>
  </div>
  <div class="sp"></div>
  <a class="home" href="index.html">Portal</a>
</div>

  <!-- ============ Im Aufbau (23.09.2026) – Inhalt folgt nach Beschreibung Victor ============ -->
  <div class="card">
    <h2>Im Aufbau</h2>
    <p class="lead">Der digitale Tagesrapport wird gerade gebaut.</p>
    <p class="hint">Bis dahin gilt der bisherige Weg.</p>
  </div>

</div>
<script>
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
</body>
</html>
