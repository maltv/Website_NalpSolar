<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NalpSolar · Schrägpfahl Lage & Auszug</title>
<meta name="theme-color" content="#0b1826">
<link rel="manifest" href="manifest.json">
<script src="assets/js/nalp-gate.js"></script>
<style>
  :root{
    --bg:#eef1f5; --card:#fff; --line:rgba(10,22,38,.12); --txt:#14202e; --muted:#5b6b7c;
    --blue:#0b5fff; --orange:#e0691b; --orange2:#ff8a3d; --red:#d63a3f; --green:#1c8a4a; --amber:#e8a012;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;line-height:1.45;}
  .wrap{max-width:820px;margin:0 auto;padding:0 14px 60px;}

  .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 14px calc(10px + env(safe-area-inset-top));margin:0 -14px 14px;
    color:#e8eef7;background:radial-gradient(120% 160% at 0 0,#173657,#0b1826);box-shadow:0 2px 14px rgba(0,0,0,.3);}
  .top .brand{font-size:10px;letter-spacing:.22em;font-weight:800;color:#ffc340;text-transform:uppercase;}
  .top h1{font-size:16px;font-weight:900;margin:1px 0 0;}
  .top .sp{flex:1;}
  .home{border:0;border-radius:11px;padding:10px 14px;font-weight:800;font-size:14px;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,#0b5fff,#2196F3);white-space:nowrap;text-decoration:none;display:inline-block;}
  .lang{display:flex;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.3);}
  .lang button{border:0;background:transparent;color:#e8eef7;font-weight:800;font-size:13px;padding:9px 11px;cursor:pointer;}
  .lang button.on{background:#ffc340;color:#0b1826;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;
    box-shadow:0 6px 18px rgba(10,22,38,.06);}
  h2{font-size:15px;font-weight:900;margin:0 0 10px;display:flex;align-items:center;gap:8px;}
  .lead{font-size:12.5px;color:var(--muted);margin:-6px 0 12px;}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;}

  .pick{display:flex;gap:6px;flex-wrap:wrap;}
  .pick button{flex:1;min-width:52px;border:1.5px solid var(--line);border-radius:12px;padding:11px 6px;
    font-weight:900;font-size:15px;background:#f7f9fc;color:var(--muted);cursor:pointer;}
  .pick button.on{background:linear-gradient(135deg,#0b5fff,#2196F3);color:#fff;border-color:transparent;}
  .pick.two button{font-size:13.5px;min-width:130px;line-height:1.25;}
  .pick.two button.on{background:linear-gradient(135deg,#e0691b,#ff8a3d);}
  .pick.two button small{display:block;font-weight:600;font-size:11px;}
  .sublbl{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;margin:12px 0 4px;}

  .inrow{display:flex;gap:8px;flex-wrap:wrap;}
  .fld{flex:1;min-width:140px;}
  .fld label{display:block;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;margin-bottom:3px;}
  .fld input{width:100%;font-size:19px;font-weight:800;padding:11px;border-radius:10px;border:1.5px solid var(--line);
    background:#fff;color:var(--txt);}
  .fld input:focus{outline:none;border-color:var(--blue);}
  .fld .u{font-size:11px;color:var(--muted);margin-top:2px;}

  .res{border-radius:14px;padding:14px;margin-top:4px;}
  .res.ok{background:#e9f7ee;border:1px solid #bfe3cc;}
  .res.warn{background:#fdf3e3;border:1px solid #f0d9a8;}
  .res.err{background:#fdeaea;border:1px solid #f2c2c2;}
  .res.neutral{background:#eef4ff;border:1px solid #cfe0ff;}
  .res .act{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;opacity:.75;}
  .res .bigv{font-size:40px;font-weight:900;line-height:1.05;margin:2px 0;}
  .res .bigv small{font-size:17px;font-weight:800;}
  .res .sub{font-size:13.5px;margin-top:6px;}
  .res.ok .act,.res.ok .bigv,.res.ok .sub{color:#14532d;}
  .res.warn .act,.res.warn .bigv,.res.warn .sub{color:#7a5410;}
  .res.err .act,.res.err .bigv,.res.err .sub{color:#8f1d1d;}
  .res.neutral .act,.res.neutral .bigv,.res.neutral .sub{color:#0b3ea8;}

  .zeile{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .zeile:last-child{border-bottom:0;}
  .zeile .lb{flex:1;color:var(--muted);}
  .zeile .vv{font-weight:900;font-size:16px;white-space:nowrap;}
  .zeile .nt{font-size:11.5px;color:#5b6b7c;}
  .flag{font-size:11.5px;font-weight:800;border-radius:7px;padding:3px 8px;color:#fff;white-space:nowrap;}
  .flag.g{background:var(--green);} .flag.a{background:var(--amber);} .flag.r{background:var(--red);}

  .warnbox{margin-top:10px;font-size:13px;border-radius:10px;padding:10px 12px;}
  .warnbox.a{background:#fdf3e3;border:1px solid #f0d9a8;color:#7a5410;}
  .warnbox.r{background:#fdeaea;border:1px solid #f2c2c2;color:#8f1d1d;font-weight:700;}

  .sk{margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#f7f9fc;}
  .sk + .sk{margin-top:10px;}
  .legende{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px;}
  .legende span::before{content:"";display:inline-block;width:18px;height:6px;border-radius:3px;margin-right:6px;vertical-align:middle;}
  .legende .l-soll::before{background:#9aa7b4;} .legende .l-ist::before{background:#e0691b;} .legende .l-neu::before{background:#1c8a4a;}
  .legende .l-st::before{background:#3d4a5c;} .legende .l-rad::before{background:#7a1fa2;}

  .formel{background:linear-gradient(135deg,#12304f,#0b1826);color:#e8eef7;border-radius:14px;padding:14px;}
  .formel .f{font-size:18px;font-weight:900;margin:6px 0;}
  .formel .f b{color:#ffc340;}
  .formel .n{font-size:12.5px;opacity:.8;}
  @media (max-width:430px){ .formel .f{font-size:15.5px;} }

  table.st{border-collapse:collapse;width:100%;font-size:13px;}
  table.st th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);text-align:left;
    padding:6px 8px;border-bottom:2px solid var(--line);}
  table.st th i{font-style:normal;text-transform:none;}
  table.st td{padding:7px 8px;border-bottom:1px solid var(--line);}
  table.st td b{font-size:15px;}
  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}

  details{margin-top:10px;} summary{font-size:13px;font-weight:800;color:var(--blue);cursor:pointer;}
  details .inner{margin-top:10px;}
  .quelle{font-size:11.5px;color:var(--muted);line-height:1.6;}
  svg{display:block;width:100%;height:auto;}
</style>
</head>
<body>
<div class="top">
  <div>
    <div class="brand">NalpSolar B8-13</div>
    <h1 data-i="titel"></h1>
  </div>
  <div class="sp"></div>
  <div class="lang" id="pLang"><button data-v="de">DE</button><button data-v="en">EN</button></div>
  <a class="home" href="index.html">Portal</a>
</div>

<div class="wrap">

  <!-- ============ Worum es geht ============ -->
  <div class="card">
    <h2 data-i="warum_h"></h2>
    <div class="lead" style="margin-bottom:8px;" data-i="warum_lead"></div>
    <div class="sk" id="skWarum"></div>
    <div class="hint" data-i="warum_hint"></div>
  </div>

  <!-- ============ 1. Pfahl ============ -->
  <div class="card">
    <h2 data-i="s1_h"></h2>
    <div class="sublbl" style="margin-top:0;" data-i="s1_typ"></div>
    <div class="pick" id="pTyp"></div>
    <div class="inrow" style="margin-top:12px;">
      <div class="fld" style="max-width:260px;">
        <label data-i="s1_eps"></label>
        <input id="iEps" inputmode="decimal" value="30">
        <div class="u" data-i="s1_eps_u"></div>
      </div>
    </div>
    <div class="hint" id="stuetzeInfo" style="margin-top:10px;"></div>
  </div>

  <!-- ============ 2. Messung ============ -->
  <div class="card">
    <h2 data-i="s2_h"></h2>
    <div class="sublbl" style="margin-top:0;" data-i="s2_kopf"></div>
    <div class="pick two" id="pRicht">
      <button data-v="berg" data-i="s2_berg"></button>
      <button data-v="tal" data-i="s2_tal"></button>
    </div>
    <div class="inrow" style="margin-top:12px;">
      <div class="fld">
        <label data-i="s2_lage"></label>
        <input id="iLage" inputmode="decimal" data-ip="s2_lage_ph">
        <div class="u" data-i="s2_lage_u"></div>
      </div>
    </div>
    <div class="sublbl" data-i="s2_hoehe"></div>
    <div class="inrow">
      <div class="fld">
        <label data-i="s2_soll"></label>
        <input id="iHSoll" inputmode="decimal" placeholder="2046.340">
        <div class="u" data-i="s2_soll_u"></div>
      </div>
      <div class="fld">
        <label data-i="s2_ist"></label>
        <input id="iHIst" inputmode="decimal" placeholder="2045.940">
        <div class="u" data-i="s2_ist_u"></div>
      </div>
    </div>
    <details id="dOkt">
      <summary data-i="s2_okt_sum"></summary>
      <div class="inner">
        <div class="inrow">
          <div class="fld">
            <label data-i="s2_okt"></label>
            <input id="iOkt" inputmode="decimal" placeholder="2045.850">
            <div class="u" data-i="s2_okt_u"></div>
          </div>
        </div>
      </div>
    </details>
  </div>

  <!-- ============ 3. Ergebnis ============ -->
  <div class="card">
    <h2 data-i="s3_h"></h2>
    <div id="out"></div>
    <div id="skizzen"></div>
  </div>

  <!-- ============ Formel ============ -->
  <div class="card">
    <h2 data-i="f_h"></h2>
    <div class="formel">
      <div class="f" data-i="f_1"></div>
      <div class="n" data-i="f_1n"></div>
      <div class="f" style="margin-top:12px;" data-i="f_2"></div>
      <div class="n" data-i="f_2n"></div>
    </div>
    <div class="tblwrap" style="margin-top:12px;">
      <table class="st">
        <thead><tr data-i="f_th"></tr></thead>
        <tbody id="tbMerk"></tbody>
      </table>
    </div>
    <div class="hint" data-i="f_hint"></div>
    <details>
      <summary data-i="q_sum"></summary>
      <div class="inner quelle" data-i="q_text"></div>
    </details>
  </div>

</div>

  var LANG='de';

  // ---- Typendaten -----------------------------------------------------------------------
  // eps = Pfahlneigung (Typenplan PL 0289 A1) · R = Stützenlänge [m] (B aus MAAG-Plan 4225 + Passstück; übrige im
  // Verhältnis der ILF-Referenzlängen) · spiel = Langloch längs [mm] · Stütze immer in Pfahlrichtung (β = ε)
  var TYP = {
    A:{eps:30, len:2.00, R:4.9, spiel:{'2026':26.5,'2025':35.0}},
    B:{eps:30, len:2.00, R:4.5, spiel:{'2026':26.5,'2025':35.0}},
    C:{eps:30, len:2.50, R:5.1, spiel:{'2026':24.5,'2025':37.0}},
    D:{eps:30, len:2.50, R:4.0, spiel:{'2026':24.5,'2025':37.0}},
    E:{eps:35, len:3.00, R:4.1, spiel:{'2026':22.5,'2025':35.0}}
  };
  var TOL_HOEHE = 50, TOL_LAGE = 30, MAX_UEBER = 150;
  var S = { typ:'B', richt:'berg', R:null, spiel:null };

  function $(id){ return document.getElementById(id); }
  function num(id){ var v = parseFloat(String($(id).value).replace(',','.')); return isFinite(v)?v:null; }
  function rad(g){ return g*Math.PI/180; }
  function ab(v,d){ return Math.abs(v).toFixed(d===undefined?0:d); }
  function cm(v){ return (Math.abs(v)/10).toFixed(1)+' cm'; }
  function cmv(v){ return (v>=0?'+':'−')+(Math.abs(v)/10).toFixed(1)+' cm'; }
  function cmk(v){ var c=Math.abs(v)/10; return (Math.abs(c-Math.round(c))<0.05?String(Math.round(c)):c.toFixed(1))+' cm'; }   // kompakt für Skizzen

  // ---- Kern: Kopf auf den Stützenkreis ziehen ------------------------------------------
  // u + = bergwärts, z + = hoch, SOLL-Kopf = (0,0), alles mm. e = Lage IST-Kopf (+ bergwärts), dz = Höhe IST-Kopf (+ höher).
  function rechneKreis(eps, beta, Rmm, e, dz){
    var se=Math.sin(rad(eps)), ce=Math.cos(rad(eps)), sb=Math.sin(rad(beta)), cb=Math.cos(rad(beta));
    var A = {u:-Rmm*sb, z:Rmm*cb}, d = {u:-se, z:ce}, n = {u:ce, z:se}, P = {u:e-A.u, z:dz-A.z};
    function schnitt(dir){ var pd=P.u*dir.u+P.z*dir.z, pp=P.u*P.u+P.z*P.z, disc=pd*pd-(pp-Rmm*Rmm);
      if(disc<0) return null; var r=Math.sqrt(disc), t1=-pd-r, t2=-pd+r; return Math.abs(t1)<Math.abs(t2)?t1:t2; }
    var tt = schnitt(d), lam = schnitt(n);
    if(tt===null) return null;
    var H = {u:e+tt*d.u, z:dz+tt*d.z};
    var v0={u:-A.u, z:-A.z}, v1={u:H.u-A.u, z:H.z-A.z};
    var delta = Math.atan2(v0.u*v1.z-v0.z*v1.u, v0.u*v1.u+v0.z*v1.z);
    var tFull = -dz/ce;
    return { A:A, t:tt, lam:lam, H:H, delta:delta, bogen:Rmm*delta, tFull:tFull, uFull:e+tFull*d.u, se:se, ce:ce };
  }

  // ---- Knöpfe ---------------------------------------------------------------------------
  var ht=''; for(var k in TYP){ ht += '<button data-v="'+k+'">'+k+'</button>'; }
  $('pTyp').innerHTML = ht;
  function markiere(box, wert){ var bs=box.querySelectorAll('button'); for(var i=0;i<bs.length;i++){ bs[i].className=(bs[i].getAttribute('data-v')===wert)?'on':''; } }
  function bindePick(boxId, fn){
    var box=$(boxId);
    box.addEventListener('click', function(ev){ var b=ev.target.closest?ev.target.closest('button'):null; if(!b||!box.contains(b)) return; fn(b.getAttribute('data-v')); });
  }
  bindePick('pTyp', function(v){ S.typ=v; markiere($('pTyp'),v); $('iEps').value=TYP[v].eps; rechne(); });
  bindePick('pRicht', function(v){ S.richt=v; markiere($('pRicht'),v); rechne(); });
  bindePick('pLang', function(v){ sprache(v,true); });
  ['iEps','iLage','iHSoll','iHIst','iOkt'].forEach(function(id){ $(id).addEventListener('input', rechne); });

  function merktabelle(){
    var h='';
    ['A','B','C','D','E'].forEach(function(k){ var T=TYP[k], r=rechneKreis(T.eps,T.eps,T.R*1000,0,-100);
      h+='<tr><td><b>'+k+'</b></td><td>'+T.eps+'°</td><td>'+T.R.toFixed(1)+' m</td><td><b>'+(r?cm(r.t):'–')+'</b></td><td>'+(r?cm(r.tFull):'–')+'</td></tr>'; });
    $('tbMerk').innerHTML=h;
  }

  // ---- Rechnung -------------------------------------------------------------------------
  // Konstruktionskonstanten, keine Eingaben: Stützenneigung = Pfahlneigung, Radius je Typ, Langloch Serie 2026 (konservativ).
  function rechne(){
    var eps=num('iEps'), beta=eps, Rm=(S.R||TYP[S.typ].R), spiel=(S.spiel||TYP[S.typ].spiel['2026']);
    var lage=num('iLage'), hSoll=num('iHSoll'), hIst=num('iHIst'), okt=num('iOkt');
    $('stuetzeInfo').innerHTML=f('info',{b:(eps!==null?(90-eps).toFixed(0):'–'), t:S.typ, r:Rm.toFixed(1), s:(spiel/10).toFixed(1)});
    if(eps===null||eps<=0||eps>=90){ $('out').innerHTML='<div class="res err"><div class="sub">'+t('err_eps')+'</div></div>'; $('skizzen').innerHTML=''; return; }
    var e=(lage===null?0:Math.abs(lage)*10)*(S.richt==='berg'?1:-1);
    var dz=(hSoll!==null&&hIst!==null)?(hIst-hSoll)*1000:null;
    $('skWarum').innerHTML = skQuerschnitt('warum', eps, beta, Rm*1000, 0, 0, null);
    if(dz===null && lage===null){
      $('out').innerHTML='<div class="res neutral"><div class="act">'+t('bereit')+'</div><div class="sub">'+t('bereit_t')+'</div></div>'; $('skizzen').innerHTML=''; return; }
    var dzr=dz===null?0:dz, r=rechneKreis(eps,beta,Rm*1000,e,dzr);
    if(!r){ $('out').innerHTML='<div class="res err"><div class="sub">'+t('err_kreis')+'</div></div>'; $('skizzen').innerHTML=''; return; }

    var raus=r.t>=0, reicht=r.lam!==null&&Math.abs(r.lam)<=spiel, h='';
    var vA=raus?t('v_raus'):t('v_rein'), dGrad=ab(r.delta*180/Math.PI,1);
    if(Math.abs(r.t)<1){
      h+='<div class="res ok"><div class="act">'+t('nichts')+'</div><div class="bigv">0 <small>cm</small></div><div class="sub">'+t('nichts_t')+'</div></div>';
    } else if(reicht){
      h+='<div class="res ok"><div class="act">'+t('lassen')+'</div><div class="bigv">'+(Math.abs(r.lam)/10).toFixed(1)+' <small>'+t('lassen_u')+'</small></div>'
        +'<div class="sub">'+f('lassen_t',{l:cm(r.lam), r:(r.lam>0?t('berg'):t('tal')), s:(spiel/10).toFixed(1), a:vA, t:cm(r.t)})+'</div></div>';
    } else {
      h+='<div class="res warn"><div class="act">'+(raus?t('raus'):t('rein'))+'</div><div class="bigv">'+(Math.abs(r.t)/10).toFixed(1)+' <small>'+t('raus_u')+'</small></div>'
        +'<div class="sub">'+f('raus_t',{d:dGrad})+(r.lam!==null?f('raus_ll',{l:cm(r.lam), s:(spiel/10).toFixed(1)}):'')+'</div></div>';
    }
    h+='<div style="margin-top:12px;">';
    var flL=Math.abs(r.H.u)<=TOL_LAGE?'g':'a', flH=Math.abs(r.H.z)<=TOL_HOEHE?'g':'a';
    h+=zeile(t('z_lage'), cm(r.H.u)+' '+(r.H.u>0?t('berg'):t('tal')), '<span class="flag '+flL+'">'+(flL==='g'?t('fl_in3'):t('fl_ue3'))+'</span>');
    h+=zeile(t('z_hoehe'), cmv(r.H.z), '<span class="flag '+flH+'">'+(flH==='g'?t('fl_in5'):t('fl_ue5'))+'</span>');
    if(hIst!==null) h+=zeile(t('z_kh'), (hIst+(r.t*r.ce)/1000).toFixed(3)+' m', null);
    h+=zeile(t('z_st'), t('z_st_v'), '<span class="nt">'+f('z_st_n',{d:dGrad, b:cm(r.bogen)})+'</span>');
    if(dz!==null&&Math.abs(dz)>=1) h+=zeile(t('z_ohne'), cm(r.tFull)+' '+(r.tFull>=0?t('v_zieh'):t('v_rein')), '<span class="nt">'+f('z_ohne_n',{u:cm(r.uFull), r:(r.uFull>0?t('berg'):t('tal'))})+'</span>');
    if(Math.abs(e)>=1) h+=zeile(t('z_urs'), cm(e/Math.tan(rad(eps))), '<span class="nt">'+t('z_urs_n')+'</span>');
    if(flL!=='g'||flH!=='g') h+='<div class="warnbox a">'+t('w_tol')+'</div>';
    if(okt!==null&&hIst!==null){
      var ueNeu=(hIst+(r.t*r.ce)/1000-okt)*1000, einb=TYP[S.typ].len*1000-ueNeu/r.ce, flU=ueNeu>MAX_UEBER?'r':(ueNeu<0?'a':'g');
      h+=zeile(t('z_ue'), cm(ueNeu), '<span class="flag '+flU+'">'+(flU==='g'?t('fl_u15'):flU==='r'?t('fl_o15'):t('fl_terr'))+'</span>');
      h+=zeile(t('z_einb'), (einb/1000).toFixed(2)+' m', null);
      if(ueNeu>MAX_UEBER) h+='<div class="warnbox r">'+t('w_ue')+'</div>'; else if(ueNeu<0) h+='<div class="warnbox a">'+t('w_terr')+'</div>';
    }
    h+='</div><div class="hint" style="margin-top:12px;">'+t('merke')+'</div>';
    $('out').innerHTML=h;

    var sk='<div class="sk">'+skQuerschnitt('problem',eps,beta,Rm*1000,e,dzr,r)+'</div>';
    if(Math.abs(r.t)>=1) sk+='<div class="sk">'+skQuerschnitt('loesung',eps,beta,Rm*1000,e,dzr,r)+'</div>';
    sk+='<div class="legende">'+t('leg')+'</div><div class="hint">'+t('sk_hint')+'</div>';
    $('skizzen').innerHTML=sk;
  }
  function zeile(lb,v,extra){ return '<div class="zeile"><span class="lb">'+lb+'</span>'+(extra||'')+'<span class="vv">'+v+'</span></div>'; }

  // ---- Querschnitt (massstäblich, Typ B nach MAAG-Plan 24027-S-0-M-009) + Lupe am Pfahlkopf ------------
  function T(x,y,txt,farbe,anchor,size,bold){ return '<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" font-size="'+(size||12)+'" font-weight="'+(bold===false?'700':'900')+'" fill="'+farbe+'" text-anchor="'+(anchor||'start')+'">'+txt+'</text>'; }
  function L(x1,y1,x2,y2,farbe,w,dash){ return '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="'+farbe+'" stroke-width="'+w+'" stroke-linecap="round"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>'; }
  function C(x,y,r,fill,stroke){ return '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r+'" fill="'+fill+'"'+(stroke?' stroke="'+stroke+'" stroke-width="2"':'')+'/>'; }
  function bogen(cx,cy,Rpx,phi0,span,farbe,w){ var p=[]; for(var i=0;i<=40;i++){ var a=phi0-span/2+span*i/40; p.push((cx+Rpx*Math.cos(a)).toFixed(1)+','+(cy+Rpx*Math.sin(a)).toFixed(1)); }
    return '<polyline points="'+p.join(' ')+'" fill="none" stroke="'+farbe+'" stroke-width="'+w+'" stroke-dasharray="7 5"/>'; }
  function profil(x1,y1,x2,y2,w,farbe){ return L(x1,y1,x2,y2,farbe,w)+L(x1,y1,x2,y2,'#8d9bb0',Math.max(1,w-5)); }

  function skQuerschnitt(mode, eps, beta, Rmm, e, dz, r){
    var W=600,H=400, k=0.044, ox=112, oy=336;
    var X=function(u){return ox+u*k;}, Y=function(z){return oy-z*k;};
    var se=Math.sin(rad(eps)), ce=Math.cos(rad(eps)), sb=Math.sin(rad(beta)), cb=Math.cos(rad(beta));
    // MAAG-Plan Typ B: Talstütze 3645 (+ Passstück), Modulträger 60° durch den Talstützenkopf, DET 3 1236 darüber,
    // Bergstütze von dort in Pfahlrichtung mit Länge R
    var TS=3645+150, D2={u:0, z:TS};
    var mt=function(sm){ return {u:D2.u+sm*0.5, z:D2.z+sm*0.866}; };
    var A=mt(1236), Hs={u:A.u+Rmm*sb, z:A.z-Rmm*cb}, m0=mt(-160), m1=mt(2420), st='#3d4a5c';
    var s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" role="img"><rect width="'+W+'" height="'+H+'" fill="#f7f9fc"/>';
    var tan=Hs.z/Hs.u;
    s+='<path d="M'+X(-2600)+','+Y(-2600*tan)+' L'+X(Hs.u+9000)+','+Y(Hs.z+9000*tan)+' L'+X(Hs.u+9000)+','+(H-4)+' L'+X(-2600)+','+(H-4)+' Z" fill="#e6ded2" stroke="#b9a98f" stroke-width="1.5"/>';
    s+=T(14,22,mode==='problem'?t('sk_problem'):mode==='loesung'?t('sk_loesung'):t('sk_titel'),'#14202e','start',13);
    s+=T(X(-2400),H-14,t('sk_tal'),'#7a6a52','start',13); s+=T(X(Hs.u+3800),Y(Hs.z+3800*tan)+30,t('sk_berg'),'#7a6a52','start',13);
    s+=L(X(0),Y(0),X(0),Y(-2000),'#8a8f97',6,'8 6');
    s+=profil(X(0),Y(0),X(D2.u),Y(D2.z),9,st);
    s+='<rect x="'+(X(0)-10)+'" y="'+(Y(0)-3)+'" width="20" height="5" fill="'+st+'"/>';
    s+=profil(X(m0.u),Y(m0.z),X(m1.u),Y(m1.z),8,st);
    var nx=-0.866*190, nz=0.5*190;
    s+=L(X(m0.u+nx),Y(m0.z+nz),X(m1.u+nx),Y(m1.z+nz),'#1e3a5f',7);
    s+=L(X(m0.u+nx),Y(m0.z+nz),X(m1.u+nx),Y(m1.z+nz),'#5f9bff',2);
    var d4={u:A.u+1500*sb, z:A.z-1500*cb};
    s+=profil(X(d4.u),Y(d4.z),X(d4.u+1250),Y(d4.z+620),6,'#8d9bb0');
    s+=L(X(Hs.u),Y(Hs.z),X(Hs.u+2000*se),Y(Hs.z-2000*ce),'#8a8f97',6,'8 6');
    var stFarbe = mode==='loesung' ? '#9aa7b4' : st;
    s+=profil(X(Hs.u),Y(Hs.z),X(A.u),Y(A.z),9,stFarbe);
    s+='<rect x="'+(X(Hs.u)-10)+'" y="'+(Y(Hs.z)-3)+'" width="20" height="5" fill="'+st+'" transform="rotate('+(-eps).toFixed(1)+' '+X(Hs.u).toFixed(1)+' '+Y(Hs.z).toFixed(1)+')"/>';
    s+=C(X(A.u),Y(A.z),6,'#fff','#14202e'); s+=C(X(Hs.u),Y(Hs.z),6,'#fff','#14202e');
    var Rpx=Rmm*k, phi0=Math.atan2(Y(Hs.z)-Y(A.z), X(Hs.u)-X(A.u));
    s+=bogen(X(A.u),Y(A.z),Rpx,phi0,0.36,'#7a1fa2',2.5);
    if(mode==='warum'){
      s+=T(X(0)-12,Y(1900),t('sk_ts'),'#14202e','end',12); s+=T(X(0)-12,Y(1600),t('sk_lot'),'#5b6b7c','end',11,false);
      s+=T(X(m1.u)+10,Y(m1.z)+4,t('sk_mt'),'#14202e','start',12);
      s+=T(X(A.u)+14,Y(A.z)-8,t('sk_go'),'#0b3ea8','start',12);
      var mid={u:(Hs.u+A.u)/2, z:(Hs.z+A.z)/2};
      s+=T(X(mid.u)+16,Y(mid.z)+18,t('sk_bs'),'#14202e','start',12); s+=T(X(mid.u)+16,Y(mid.z)+32,f('sk_bs2',{b:(90-beta).toFixed(0)}),'#5b6b7c','start',10.5,false);
      s+=T(X(Hs.u)+16,Y(Hs.z)+16,t('sk_gu'),'#0b3ea8','start',12); s+=T(X(Hs.u)+16,Y(Hs.z)+29,t('sk_gu2'),'#5b6b7c','start',10.5,false);
      s+=T(X(Hs.u+2000*se)+8,Y(Hs.z-2000*ce)+4,f('sk_pf',{e:eps.toFixed(0)}),'#5b6b7c','start',12);
      s+=T(X(0)+8,Y(-1300),t('sk_pfl'),'#5b6b7c','start',11,false);
      var rl={x:X(Hs.u)+34, y:Y(Hs.z)-108};
      s+=T(rl.x,rl.y,t('sk_rad'),'#7a1fa2','start',12); s+=T(rl.x,rl.y+14,t('sk_rad2'),'#7a1fa2','start',11,false);
      s+=L(rl.x+40,rl.y+20,X(Hs.u)+Rpx*0.16*Math.cos(phi0+0.12),Y(Hs.z)-6,'#7a1fa2',1,'3 3');
      s+='</svg>'; return s;
    }
    var Hi={u:Hs.u+e, z:Hs.z+dz};
    s+=L(X(Hi.u),Y(Hi.z),X(Hi.u+2000*se),Y(Hi.z-2000*ce),'#e0691b',5);
    if(mode==='loesung' && r){
      var Hn={u:Hs.u+r.H.u, z:Hs.z+r.H.z};
      s+=profil(X(Hn.u),Y(Hn.z),X(A.u),Y(A.z),9,'#1c8a4a'); s+=C(X(Hn.u),Y(Hn.z),6,'#fff','#1c8a4a');
      var vA=r.t>=0?t('v_raus'):t('v_rein'); vA=vA.charAt(0).toUpperCase()+vA.slice(1);
      s+=T(14,44,f('sk_c_raus',{a:vA, t:cmk(r.t)}),'#14532d','start',13.5);
      s+=T(14,60,f('sk_c_raus2',{d:ab(r.delta*180/Math.PI,1)}),'#14532d','start',11.5,false);
    } else {
      var x=(Math.abs(dz)>=1?cmk(dz)+' '+(dz<0?t('sk_zutief'):t('sk_zuhoch')):'')+(Math.abs(dz)>=1&&Math.abs(e)>=1?', ':'')+(Math.abs(e)>=1?cmk(e)+' '+t('sk_zuweit')+' '+(e>0?t('berg'):t('tal')):'');
      s+=T(14,44,f('sk_c_prob',{x:x}),'#8f1d1d','start',13.5);
      s+=T(14,60,t('sk_c_prob2'),'#8f1d1d','start',11.5,false);
    }
    // Lupe oben rechts
    var lx=455, ly=108, lr=96;
    s+=L(lx-lr*0.55,ly+lr*0.82,X(Hs.u)+8,Y(Hs.z)-10,'#5b6b7c',1.2,'3 4');
    s+='<clipPath id="lupe'+mode+'"><circle cx="'+lx+'" cy="'+ly+'" r="'+(lr-2)+'"/></clipPath>';
    s+=C(lx,ly,lr,'#fff','#5b6b7c');
    var span=Math.max(60, Math.abs(e), Math.abs(dz), r?Math.abs(r.t):0), ki=Math.min(0.5, 62/span);
    var Xi=function(u){return lx-e*ki/2+u*ki;}, Yi=function(z){return ly+dz*ki/2-z*ki;};
    var g='<g clip-path="url(#lupe'+mode+')">';
    g+=L(Xi(0),Yi(0),Xi(-600/ki*sb),Yi(600/ki*cb),'#9aa7b4',7); g+=L(Xi(0),Yi(0),Xi(600/ki*se),Yi(-600/ki*ce),'#9aa7b4',7,'9 7');
    var Ai={u:-Rmm*sb, z:Rmm*cb}, Rpi=Rmm*ki, ph=Math.atan2(Yi(0)-Yi(Ai.z), Xi(0)-Xi(Ai.u));
    g+=bogen(Xi(Ai.u),Yi(Ai.z),Rpi,ph,Math.min(1.5,600/Rpi),'#7a1fa2',2.5);
    g+='<rect x="'+(Xi(0)-16)+'" y="'+(Yi(0)-7)+'" width="32" height="7" rx="2" fill="#9aa7b4"/>';
    g+=T(Xi(0)+(e>=0?-22:22),Yi(0)-12,t('sk_soll'),'#6b7986',e>=0?'end':'start',11);
    g+=L(Xi(e),Yi(dz),Xi(e+600/ki*se),Yi(dz-600/ki*ce),'#e0691b',7);
    g+='<rect x="'+(Xi(e)-16)+'" y="'+(Yi(dz)-7)+'" width="32" height="7" rx="2" fill="#e0691b"/>';
    g+=T(Xi(e)+(e>=0?22:-22),Yi(dz)+(dz<-5?16:-12),t('sk_ist'),'#b5510f',e>=0?'start':'end',11);
    if(mode==='loesung' && r){
      g+=L(Xi(e),Yi(dz),Xi(r.H.u),Yi(r.H.z),'#1c8a4a',5);
      g+=L(Xi(r.H.u),Yi(r.H.z),Xi(r.H.u+(Ai.u-r.H.u)*(600/ki/Rmm)),Yi(r.H.z+(Ai.z-r.H.z)*(600/ki/Rmm)),'#1c8a4a',4,'5 4');
      g+='<rect x="'+(Xi(r.H.u)-16)+'" y="'+(Yi(r.H.z)-7)+'" width="32" height="7" rx="2" fill="#1c8a4a"/>';
      g+=T(Xi(r.H.u)-22,Yi(r.H.z)+18,t('sk_auf'),'#14532d','end',11);
    }
    g+='</g>'; s+=g;
    s+=T(lx,ly+lr+16,t('sk_lupe'),'#5b6b7c','middle',11,false);
    s+='</svg>'; return s;
  }

  // ---- Start: Adresse, gemerkte Sprache -------------------------------------------------
  (function(){
    var q={}; (location.search||'').replace(/^\?/,'').split('&').forEach(function(p){ if(!p) return; var kv=p.split('='); q[decodeURIComponent(kv[0])]=decodeURIComponent(kv[1]||''); });
    if(q.typ && TYP[q.typ.toUpperCase()]) S.typ=q.typ.toUpperCase();
    if(q.richt==='tal'||q.richt==='berg') S.richt=q.richt;
    markiere($('pTyp'),S.typ); markiere($('pRicht'),S.richt);
    $('iEps').value=TYP[S.typ].eps;
    var M={eps:'iEps',lage:'iLage',hsoll:'iHSoll',hist:'iHIst',okt:'iOkt'};
    for(var kk in M){ if(q[kk]!==undefined) $(M[kk]).value=q[kk]; }
    if(q.r && isFinite(parseFloat(q.r)) && parseFloat(q.r)>0) S.R=parseFloat(q.r);
    if(q.spiel && isFinite(parseFloat(q.spiel)) && parseFloat(q.spiel)>0) S.spiel=parseFloat(q.spiel);
    if(q.okt) $('dOkt').open=true;
    var l=q.lang; if(!l){ try{ l=localStorage.getItem('nalp_pfahllage_lang'); }catch(e){} }
    sprache(l||'de', !!q.lang);
  })();
})();
