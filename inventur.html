<link rel="stylesheet" href="assets/js/leaflet/leaflet.css">
<style>
  /* Inventur 2026 (Auftrag Victor 02.11.2026, WERKZEUGE.md §87).
     Perimeter: Pfähle (Gewinde Pflicht, Schaden / Pfahlkopfplatte / Foto optional) + Einzelfundamente (Typ + Foto Pflicht).
     Daten: uploads/inventur.json (Tools\Inventur_Daten_Bauen.py, Buildtrack-API). Der Pfahl unter den Füssen wird per GPS
     gewählt (mit RTK-Test als Handy-Standort auf Zentimeter). Läuft offline: Erfassungen + Fotos warten in der IndexedDB
     und gehen von selbst raus, sobald Netz da ist. RTDB erfassung/inventur26/{pfaehle,fundamente,berg}/<id>,
     Fotos erfassung/inventur26_fotos/<fid>. Berg = Normteile, Passstücke, Schrauben, Sonstiges. Tal = vormontage.html#lager. */
  :root{ color-scheme:light; --rot:#D72622; --ink:#1a1a1a; --mut:#63676d; --line:#e3e5e8;
         --gruen:#1e9e5a; --blau:#1565c0; --orange:#e08a00; --gelb:#f2b600; --grau:#8a8e94; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:#eef0f3; min-height:100vh; color:var(--ink); font-family:Arial,"Helvetica Neue",sans-serif; }
  header{ position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:8px; height:50px;
          padding:0 10px; background:#fff; border-bottom:4px solid var(--rot); }
  header a.home{ color:var(--ink); text-decoration:none; font-size:24px; line-height:1; padding:4px; }
  header .logo img{ height:20px; display:block; }
  header h1{ font-size:16px; margin:0; flex:1; min-width:0; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .netz{ font-size:12px; font-weight:800; color:var(--gruen); white-space:nowrap; }
  header .netz.off{ color:var(--rot); }
  .tabs{ display:flex; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:50px; z-index:19; }
  .tabs button{ flex:1 1 0; min-width:0; border:none; background:none; padding:12px 2px; font-size:14px; font-weight:800;
        color:var(--mut); cursor:pointer; border-bottom:3px solid transparent; }
  .tabs button.on{ color:var(--rot); border-bottom-color:var(--rot); }
  main{ max-width:820px; margin:0 auto; padding:10px 10px 90px; }
  section[hidden]{ display:none; }
  .box{ background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px;
        box-shadow:0 1px 4px rgba(20,25,32,.07); }
  .sub{ font-size:12.5px; color:var(--mut); line-height:1.45; }
  label.f{ display:block; font-size:13px; font-weight:800; margin:12px 0 6px; color:#33373c; }
  label.f .pf{ color:var(--rot); }
  label.f span{ font-weight:400; color:var(--mut); }
  input[type=text], input[type=number], textarea{ width:100%; font:16px Arial; padding:11px; border:1px solid #c9ccd2;
        border-radius:7px; background:#fff; }
  textarea{ min-height:54px; resize:vertical; }

  /* grosse Knöpfe (Handschuhe) */
  .wahl{ display:grid; gap:8px; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); }
  .wahl button{ min-height:62px; border:2px solid #c9ccd2; border-radius:10px; background:#fff; font:800 18px Arial;
        color:var(--ink); cursor:pointer; padding:6px 4px; line-height:1.15; }
  .wahl button small{ display:block; font-size:11px; font-weight:400; color:var(--mut); margin-top:2px; }
  .wahl button.on{ border-color:var(--rot); background:#fdecec; color:var(--rot); box-shadow:inset 0 0 0 2px var(--rot); }
  .wahl.klein button{ min-height:50px; font-size:15.5px; }
  .wahl button.g5.on{ border-color:var(--blau); background:#e8f0fb; color:var(--blau); box-shadow:inset 0 0 0 2px var(--blau); }
  .wahl button.g6.on{ border-color:#b48a00; background:#fff6d6; color:#8a6a00; box-shadow:inset 0 0 0 2px #b48a00; }
  .btn{ display:block; width:100%; border:none; border-radius:10px; padding:17px 16px; font:800 19px Arial;
        cursor:pointer; color:#fff; background:var(--gruen); text-align:center; text-decoration:none; }
  .btn.w{ background:#fff; color:var(--ink); border:2px solid #c9ccd2; font-size:16px; padding:13px; }
  .btn.rot{ background:var(--rot); }
  .btn[disabled]{ opacity:.4; cursor:default; }
  .reihe{ display:flex; gap:8px; }
  .reihe > *{ flex:1 1 0; min-width:0; }

  /* Kopf: Punkt links, Mini-Karte oben rechts – bleibt beim Scrollen oben */
  .kopf{ position:sticky; top:95px; z-index:15; display:flex; gap:10px; align-items:stretch; background:#fff;
         border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:10px;
         box-shadow:0 2px 8px rgba(20,25,32,.12); }
  .kopf .info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .kopf .pid{ font-size:30px; font-weight:900; line-height:1.05; letter-spacing:-.5px; }
  .kopf .pid.leer{ font-size:17px; color:var(--mut); font-weight:800; }
  .kopf .zeile{ font-size:13.5px; color:#33373c; }
  .kopf .zeile b{ color:var(--ink); }
  .kopf .weg{ font-size:15px; font-weight:800; }
  .badge{ display:inline-block; font-size:12.5px; font-weight:800; border-radius:6px; padding:3px 7px; margin-top:3px; }
  .badge.ok{ background:#e4f5ec; color:var(--gruen); }
  .badge.offen{ background:#fff1dc; color:#a86400; }
  .mini{ flex:0 0 auto; width:132px; display:flex; flex-direction:column; gap:4px; }
  #miniMap{ width:132px; height:132px; border-radius:7px; border:1px solid #c9ccd2; background:#dfe3e8; cursor:pointer; }
  .gps{ font-size:12px; font-weight:800; text-align:center; border-radius:5px; padding:3px 2px; background:#f1f2f4; color:var(--mut); }
  .gps.gut{ background:#e4f5ec; color:var(--gruen); } .gps.mittel{ background:#fff1dc; color:#a86400; } .gps.schlecht{ background:#fdecec; color:var(--rot); }
  @media (min-width:700px){ .mini{ width:220px; } #miniMap{ width:220px; height:220px; } .kopf .pid{ font-size:40px; } }

  .modus{ display:flex; gap:8px; margin-bottom:10px; }
  .modus button{ flex:1; min-height:54px; border:2px solid #c9ccd2; border-radius:10px; background:#fff; font:800 15.5px Arial;
        cursor:pointer; color:var(--ink); }
  .modus button.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .nachbarn{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .nachbarn button{ flex:1 1 70px; min-height:46px; border:1px solid #c9ccd2; border-radius:8px; background:#f7f8fa;
        font:800 14px Arial; cursor:pointer; padding:4px 2px; }
  .nachbarn button small{ display:block; font-weight:400; font-size:11px; color:var(--mut); }
  .nachbarn button.ok{ background:#e4f5ec; border-color:#a9dcbf; }
  .schalt{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:14px; font-weight:800; }
  .schalt button{ min-width:96px; min-height:42px; border-radius:21px; border:2px solid #c9ccd2; background:#fff; font:800 14px Arial; cursor:pointer; }
  .schalt button.on{ background:var(--gruen); border-color:var(--gruen); color:#fff; }
  .fotos{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .fotos .pg{ position:relative; width:84px; height:84px; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .fotos .pg img{ width:100%; height:100%; object-fit:cover; display:block; }
  .fotos .pg button{ position:absolute; top:2px; right:2px; width:26px; height:26px; border:none; border-radius:50%;
        background:rgba(0,0,0,.65); color:#fff; font-size:14px; cursor:pointer; }
  .stand{ font-size:13px; color:#33373c; line-height:1.6; }
  .stand b{ font-size:15px; }
  .liste{ font-size:13px; }
  .liste div{ padding:7px 2px; border-bottom:1px solid var(--line); }
  .liste div:last-child{ border-bottom:none; }
  .liste small{ color:var(--mut); }
  #toast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(150%); background:#1a1a1a; color:#fff;
        padding:13px 18px; border-radius:10px; font-size:15px; font-weight:800; z-index:60; transition:transform .25s; max-width:92vw; text-align:center; }
  #toast.on{ transform:translateX(-50%) translateY(0); }
  #toast.err{ background:var(--rot); }

  /* Grosse Karte */
  #gross{ position:fixed; inset:0; z-index:50; background:#fff; display:none; flex-direction:column; }
  #gross.an{ display:flex; }
  #gross .leiste{ display:flex; align-items:center; gap:8px; padding:8px 10px; border-bottom:3px solid var(--rot); }
  #gross .leiste b{ flex:1; font-size:15px; }
  #gross .leiste button{ min-width:52px; min-height:44px; font:800 20px Arial; border:1px solid #c9ccd2; border-radius:8px; background:#fff; cursor:pointer; }
  #grossMap{ flex:1; }
  .legende{ font-size:12px; padding:6px 10px; color:var(--mut); display:flex; gap:12px; flex-wrap:wrap; }
  .legende i{ display:inline-block; width:11px; height:11px; border-radius:50%; vertical-align:-1px; margin-right:4px; }
</style>
</head>

          <button data-v="E" onclick="bSetze('typ','E')">E</button>

        <div class="wahl klein" id="bSerie">
          <button data-v="2025" onclick="bSetze('serie','2025')">2025</button>

      <input type="text" id="bOrt" placeholder="z.B. Depot 7.2 / Container Berg">

<script>
(function(){
  'use strict';
  var DATEN='uploads/inventur.json';
  var RTDB='https://highscore-test-2e784-default-rtdb.europe-west1.firebasedatabase.app/erfassung';
  var P_BASIS='inventur26', P_FOT='inventur26_fotos', P_GEW_ALT='gewinde';
  var LS_VON='nalp_erfasser_v1', LS_CACHE='nalp_inventur26_cache_v1', LS_ORT='nalp_inventur26_ort_v1',
      LS_AUTO='nalp_inventur26_auto_v1', LS_MODUS='nalp_inventur26_modus_v1', LS_LETZTE='nalp_inventur26_letzte_v1';
  var IDB_NAME='nalp_inventur26_v1', IDB_STORE='warteschlange', MAX_FOTOS=3;
  var STUFE={0:'geplant',1:'abgesteckt',2:'gebohrt',3:'fixiert',4:'injiziert'};

  var PUNKTE=[], PI={}, EF_TYPEN=[], STAND='';
  var R={pfaehle:{}, fundamente:{}, berg:{}};   // Server + Warteschlange, je id
  var ALT={};                                   // Gewinde-Inventur Juli/August je fid
  var modusAkt='g', sel=null, auto=true, beruehrt=false, form={}, fotos=[], bForm={kat:'normteil',einh:'Stk'}, bFotos=[];
  var gps=null, letzteAutoZeit=0;

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function zz(n){ return String(n).padStart(2,'0'); }
  function heute(){ var d=new Date(); return d.getFullYear()+'-'+zz(d.getMonth()+1)+'-'+zz(d.getDate()); }
  function zeit(ms){ var d=new Date(ms); return zz(d.getDate())+'.'+zz(d.getMonth()+1)+'. '+zz(d.getHours())+':'+zz(d.getMinutes()); }
  function netzAn(){ return navigator.onLine!==false; }
  function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function toast(t,err){ var e=$('toast'); e.textContent=t; e.className='on'+(err?' err':''); clearTimeout(toast.t);
    toast.t=setTimeout(function(){ e.className=err?'err':''; },2600); }
  function meter(a,b){ var r=Math.PI/180, dx=(b.lon-a.lon)*r*Math.cos((a.lat+b.lat)/2*r), dy=(b.lat-a.lat)*r;
    return Math.sqrt(dx*dx+dy*dy)*6371000; }
  function efLabel(c){ for(var i=0;i<EF_TYPEN.length;i++) if(+EF_TYPEN[i][0]===+c) return EF_TYPEN[i][1]; return ''; }
  function neueId(){ return 'i'+Date.now().toString(36)+Math.round(Math.random()*1e6).toString(36); }
  function art(){ return modusAkt==='ef'?'fundamente':'pfaehle'; }

  /* ── Reiter ── */
  window.reiter=function(n){
    ['perimeter','berg','tal'].forEach(function(x){ $('s-'+x).hidden=(x!==n); $('tb-'+x).classList.toggle('on',x===n); });
    $('nameBox').hidden=(n==='tal');
    try{ history.replaceState(null,'','#'+n); }catch(e){}
    if(n==='perimeter') setTimeout(function(){ if(mini) mini.invalidateSize(); },60);
    if(n==='berg') bListe();
  };

  /* ── Daten ── */
  function laden(){
    return fetch(DATEN,{cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(j){
      STAND=j.stand||''; EF_TYPEN=j.ef_typen||[];
      PUNKTE=(j.punkte||[]).map(function(z){
        var f=String(z[0]), t=f.split('_');
        return {f:f, tisch:t[0], fuss:t[1]||'', lat:+z[1], lon:+z[2], typ:z[3]||'', ber:z[4]||'', st:+z[5], kopf:+z[6],
                g:+z[7], ef:+z[8], eft:z[9]==null?null:+z[9]};
      });
      PI={}; PUNKTE.forEach(function(p){ PI[p.f]=p; });
      efKnoepfe();
    });
  }
  function cacheLesen(){ try{ var c=JSON.parse(lsGet(LS_CACHE,'')||'{}'); ['pfaehle','fundamente','berg'].forEach(function(k){ R[k]=c[k]||{}; }); ALT=c.alt||{}; }catch(e){} }
  function cacheSchreiben(){ lsSet(LS_CACHE,JSON.stringify({pfaehle:R.pfaehle,fundamente:R.fundamente,berg:R.berg,alt:ALT})); }
  function serverLaden(){
    if(!netzAn()) return Promise.resolve();
    function hol(p){ return fetch(RTDB+'/'+p+'.json',{cache:'no-store'}).then(function(r){ return r.ok?r.json():null; }); }
    return Promise.all([hol(P_BASIS),hol(P_GEW_ALT)]).then(function(x){
      var b=x[0]||{};
      ['pfaehle','fundamente','berg'].forEach(function(k){ R[k]=(b[k]&&typeof b[k]==='object')?b[k]:{}; });
      ALT={};
      Object.keys(x[1]||{}).forEach(function(k){ var m=x[1][k]; if(!m||!m.tischId||!/^S\d$/i.test(String(m.stuetze))) return;
        var f=m.tischId+'_'+String(m.stuetze).toUpperCase(); if(!ALT[f]||(m.ts||0)>(ALT[f].ts||0)) ALT[f]={g:+m.gewinde,von:m.von||'',d:m.datum||''}; });
      cacheSchreiben();
    }).catch(function(){});
  }
  /* letzter Stand je Punkt (Server + noch wartende Sätze) */
  function letzter(k,f){ var best=null, o=R[k]; for(var id in o){ var e=o[id]; if(e && e.fid===f && (!best||(e.ts||0)>(best.ts||0))) best=e; } return best; }
  var ERL={pfaehle:{}, fundamente:{}};
  function erledigtRechnen(){
    ['pfaehle','fundamente'].forEach(function(k){ var m={}; for(var id in R[k]){ var e=R[k][id]; if(!e||!e.fid) continue;
      if(!m[e.fid]||(e.ts||0)>(m[e.fid].ts||0)) m[e.fid]=e; } ERL[k]=m; });
  }
  function istErledigt(p){ return !!ERL[modusAkt==='ef'?'fundamente':'pfaehle'][p.f]; }
  function kandidaten(){ return PUNKTE.filter(function(p){ return modusAkt==='ef'?p.ef:p.g; }); }

  /* ── Warteschlange (IndexedDB, Muster injektion.html) ── */
  var Q=(function(){
    var dbP=null, MEM=[];
    function db(){
      if(dbP) return dbP;
      if(!window.indexedDB){ dbP=Promise.resolve(null); return dbP; }
      dbP=new Promise(function(ok,fehl){
        var a=window.indexedDB.open(IDB_NAME,1);
        a.onupgradeneeded=function(){ if(!a.result.objectStoreNames.contains(IDB_STORE)) a.result.createObjectStore(IDB_STORE,{keyPath:'k'}); };
        a.onsuccess=function(){ ok(a.result); }; a.onerror=function(){ fehl(a.error); }; a.onblocked=function(){ fehl(new Error('blockiert')); };
      }).catch(function(){ return null; });
      return dbP;
    }
    function tx(modus,arbeit){
      return db().then(function(d){
        if(!d) throw new Error('keine IndexedDB');
        return new Promise(function(ok,fehl){
          var tr=d.transaction(IDB_STORE,modus), s=tr.objectStore(IDB_STORE); var r=arbeit(s);
          tr.oncomplete=function(){ ok(r&&r.result!==undefined?r.result:null); };
          tr.onerror=function(){ fehl(tr.error); }; tr.onabort=function(){ fehl(tr.error||new Error('abgebrochen')); };
        });
      });
    }
    function memWeg(k){ MEM=MEM.filter(function(x){ return x.k!==k; }); }
    return {
      add:function(job){ return tx('readwrite',function(s){ return s.put(job); }).catch(function(){ memWeg(job.k); MEM.push(job); }); },
      alle:function(){ return tx('readonly',function(s){ return s.getAll(); }).then(function(r){ return (r||[]).concat(MEM); }).catch(function(){ return MEM.slice(); }); },
      weg:function(k){ memWeg(k); return tx('readwrite',function(s){ return s.delete(k); }).catch(function(){}); }
    };
  })();
  function warteMischen(){ return Q.alle().then(function(a){ a.forEach(function(j){ if(j.del) { delete R[j.art][j.k]; return; }
    var r={}; for(var s in j.rec) r[s]=j.rec[s]; r.anzahl_fotos=(j.fotos||[]).length; r._wartet=1; R[j.art][j.k]=r; }); return a; }); }
  function netzMalen(){ Q.alle().then(function(a){ var e=$('netz'); e.className='netz'+(netzAn()?'':' off');
    e.textContent=(netzAn()?'online':'offline')+(a.length?' · '+a.length+' wartet':''); }); }
  window.addEventListener('online',function(){ netzMalen(); senden(); });
  window.addEventListener('offline',netzMalen);
  setInterval(function(){ Q.alle().then(function(a){ if(a.length) senden(); }); },45000);

  /* Erst die Fotos, dann der Satz mit dem Verweis. PUT mit eigener id = ein zweiter Versuch schreibt nichts doppelt. */
  var laeuft=null, nochmal=false;
  function einLauf(){
    return Q.alle().then(function(jobs){
      return jobs.reduce(function(kette,j){
        return kette.then(function(){
          var url=RTDB+'/'+P_BASIS+'/'+j.art+'/'+j.k+'.json';
          if(j.del) return fetch(url,{method:'DELETE'}).then(function(r){ if(r.ok){ delete R[j.art][j.k]; return Q.weg(j.k); } }).catch(function(){});
          var rec={}; for(var s in j.rec) rec[s]=j.rec[s];
          var bilder=j.fotos||[];
          return bilder.reduce(function(k2,data,ix){
            return k2.then(function(){
              var fid='f_'+j.k+'_'+ix;
              return fetch(RTDB+'/'+P_FOT+'/'+fid+'.json',{method:'PUT',body:JSON.stringify({eintrag:j.k,art:j.art,punkt:rec.fid||'',
                von:rec.von,ts:rec.ts,data:data,mime:'image/jpeg',nr:ix+1})})
                .then(function(r){ if(!r.ok) throw 0; rec.fotos=rec.fotos||{}; rec.fotos[fid]=true; });
            });
          },Promise.resolve()).then(function(){
            rec.anzahl_fotos=bilder.length;
            return fetch(url,{method:'PUT',body:JSON.stringify(rec)});
          }).then(function(r){ if(r&&r.ok){ R[j.art][j.k]=rec; return Q.weg(j.k); } }).catch(function(){});
        });
      },Promise.resolve());
    });
  }
  function senden(){
    if(!netzAn()) { netzMalen(); return Promise.resolve(); }
    if(laeuft){ nochmal=true; return laeuft; }
    laeuft=einLauf().catch(function(){}).then(function(){ laeuft=null; if(nochmal&&netzAn()){ nochmal=false; return senden(); } nochmal=false; })
      .then(function(){ cacheSchreiben(); netzMalen(); allesMalen(); });
    return laeuft;
  }
  function ablegen(artName,rec,bilder){
    var k=neueId(), lokal={}; for(var s in rec) lokal[s]=rec[s]; lokal.anzahl_fotos=bilder.length; lokal._wartet=1;
    R[artName][k]=lokal;
    lsSet(LS_LETZTE,JSON.stringify({art:artName,k:k}));
    return Q.add({k:k, art:artName, rec:rec, fotos:bilder}).then(function(){ netzMalen(); senden(); return k; });
  }
  window.rueckgaengig=function(){
    var l=null; try{ l=JSON.parse(lsGet(LS_LETZTE,'')||'null'); }catch(e){}
    if(!l||!R[l.art]||!R[l.art][l.k]){ toast('Nichts zum Rückgängigmachen',true); return; }
    var e=R[l.art][l.k];
    if(!confirm('Letzte Erfassung löschen?\n'+(e.fid||e.bez||e.teil||'')+'  '+zeit(e.ts||0))) return;
    delete R[l.art][l.k]; lsSet(LS_LETZTE,'');
    Q.weg(l.k).then(function(){ return Q.add({k:l.k, art:l.art, del:1}); }).then(function(){ senden(); allesMalen(); toast('↶ gelöscht'); });
  };

  /* ── GPS ── */
  function gpsMalen(){
    var e=$('gps');
    if(!gps){ e.className='gps'; e.textContent='GPS …'; return; }
    var a=gps.acc||99; e.className='gps '+(a<=2?'gut':(a<=6?'mittel':'schlecht'));
    e.textContent='GPS ±'+(a<10?a.toFixed(1):Math.round(a))+' m';
  }
  if(navigator.geolocation){
    navigator.geolocation.watchPosition(function(p){
      gps={lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy, ts:Date.now()};
      gpsMalen(); autoWaehlen(); miniMalen(); if(gross && $('gross').classList.contains('an')) grossMalen();
    }, function(err){ $('gps').textContent=err&&err.code===1?'GPS gesperrt':'kein GPS'; $('gps').className='gps schlecht'; },
    {enableHighAccuracy:true, maximumAge:1000, timeout:20000});
  }
  function naechste(n,nurOffen){
    if(!gps) return [];
    return kandidaten().filter(function(p){ return !nurOffen||!istErledigt(p); })
      .map(function(p){ return {p:p, d:meter(gps,p)}; }).sort(function(a,b){ return a.d-b.d; }).slice(0,n);
  }
  /* Automatisch: der nächste OFFENE Punkt unter den Füssen (Erfasstes nur von Hand – sonst springt es nach dem Speichern
     zurück). Gewechselt wird nur, wenn am aktuellen Punkt noch nichts angetippt ist und der neue klar näher liegt
     (0.7 m, sonst springt es bei zwei Beinen nebeneinander hin und her). */
  function autoWaehlen(){
    if(!auto||!gps||!PUNKTE.length||beruehrt) { kopfMalen(); return; }
    var n=naechste(1,true)[0]; if(!n){ kopfMalen(); return; }
    if(n.d>40){ if(sel&&meter(gps,sel)>40){ sel=null; formLeeren(); } kopfMalen(); return; }
    if(!sel || istErledigt(sel) || (n.p!==sel && n.d < meter(gps,sel)-0.7)){ waehle(n.p,true); return; }
    kopfMalen();
  }
  window.autoUmschalten=function(){ auto=!auto; lsSet(LS_AUTO,auto?'1':'0'); $('autoBtn').classList.toggle('on',auto);
    $('autoBtn').textContent=auto?'an':'aus'; if(auto){ beruehrt=false; autoWaehlen(); } };

  /* ── Auswahl + Kopf ── */
  function waehle(p,vonAuto){
    sel=p; formLeeren();
    if(!vonAuto && auto){ /* von Hand gewählt: Auto hält still, bis gespeichert ist */ beruehrt=true; }
    if(p && modusAkt==='ef' && p.eft!=null){ form.eft=p.eft; knoepfeMalen(); }
    kopfMalen(); miniMalen(); if(gross && $('gross').classList.contains('an')) grossMalen();
    if(navigator.vibrate && vonAuto) navigator.vibrate(30);
  }
  window.waehleF=function(f){ var p=PI[f]; if(p) waehle(p,false); };
  function kopfMalen(){
    if(!sel){
      $('kPid').className='pid leer';
      $('kPid').textContent=gps?(PUNKTE.length?'Kein Punkt in der Nähe':'Daten laden …'):'GPS sucht …';
      $('kTyp').textContent=''; $('kNalpi').textContent=''; $('kWeg').textContent=''; $('kBadge').innerHTML='';
    } else {
      $('kPid').className='pid'; $('kPid').textContent=sel.tisch+' '+sel.fuss;
      $('kTyp').innerHTML='Typ <b>'+esc(sel.typ||'?')+'</b> · '+esc(sel.ber||'–');
      $('kNalpi').innerHTML='Nalpi: '+esc(STUFE[sel.st]||'?')+(sel.kopf?' · Kopf ✔':'')+(sel.ef&&modusAkt!=='ef'?' · <b>Einzelfundament</b>':'')
        +(ALT[sel.f]&&modusAkt==='g'?' · Aug: '+ALT[sel.f].g+' mm':'');
      var d=gps?meter(gps,sel):null;
      $('kWeg').textContent=d==null?'':(d<1?'📍 du stehst drauf ('+d.toFixed(1)+' m)':'📍 '+(d<10?d.toFixed(1):Math.round(d))+' m entfernt');
      var e=ERL[art()][sel.f];
      $('kBadge').innerHTML=e?'<span class="badge ok">✔ erfasst '+esc(zeit(e.ts||0))+' · '+esc(e.von||'')
        +(e.gew!=null&&modusAkt==='g'?' · '+(+e.gew?e.gew+' mm':'nicht messbar'):'')+(e.ef_label?' · '+esc(e.ef_label):'')
        +(e._wartet?' · wartet aufs Netz':'')+'</span>':'<span class="badge offen">noch offen</span>';
    }
    $('efNalpi').textContent=(sel&&modusAkt==='ef')?('In Nalpi: '+(sel.eft!=null?efLabel(sel.eft):'Typ noch nicht bestimmt')):'';
    nachbarnMalen();
  }
  function nachbarnMalen(){
    var basis=sel||gps; if(!basis){ $('nachbarn').innerHTML=''; return; }
    var liste=kandidaten().filter(function(p){ return p!==sel; }).map(function(p){ return {p:p, d:meter(basis,p)}; })
      .sort(function(a,b){ return a.d-b.d; }).slice(0,4);
    $('nachbarn').innerHTML=liste.map(function(x){
      return '<button class="'+(istErledigt(x.p)?'ok':'')+'" onclick="waehleF(\''+esc(x.p.f)+'\')">'+esc(x.p.tisch+' '+x.p.fuss)
        +'<small>'+(x.d<10?x.d.toFixed(1):Math.round(x.d))+' m'+(istErledigt(x.p)?' ✔':'')+'</small></button>';
    }).join('');
  }
  window.naechsterOffener=function(){
    var n=naechste(1,true)[0];
    if(!n && sel){ var o=kandidaten().filter(function(p){ return !istErledigt(p); }).map(function(p){ return {p:p,d:meter(sel,p)}; })
      .sort(function(a,b){ return a.d-b.d; })[0]; n=o; }
    if(!n){ toast('Alles erfasst 🎉'); return; }
    waehle(n.p,false);
  };

  /* ── Formular ── */
  function formLeeren(){ form={}; fotos=[]; beruehrt=false; $('fText').value=''; fotosMalen(); knoepfeMalen(); }
  function knoepfeMalen(){
    [['wGew','gew'],['wSchaden','schaden'],['wKopf','kopf'],['wEf','eft']].forEach(function(x){
      Array.prototype.forEach.call($(x[0]).querySelectorAll('button'),function(b){ b.classList.toggle('on', form[x[1]]!=null && String(form[x[1]])===b.getAttribute('data-v')); });
    });
  }
  window.setze=function(k,v){ if(!sel){ toast('Erst einen Punkt wählen',true); return; }
    form[k]=(form[k]===v && k!=='gew' && k!=='eft')?null:v; beruehrt=true; knoepfeMalen(); if(navigator.vibrate) navigator.vibrate(15); };
  function efKnoepfe(){
    $('wEf').innerHTML=EF_TYPEN.map(function(t){ return '<button data-v="'+t[0]+'" onclick="setze(\'eft\','+t[0]+')">'+esc(t[1])
      +(+t[0]===4?'<small>in Nalpi «1.6 × 1.6»</small>':'')+'</button>'; }).join('');
  }
  window.modus=function(m){
    modusAkt=m; lsSet(LS_MODUS,m);
    $('m-g').classList.toggle('on',m==='g'); $('m-ef').classList.toggle('on',m==='ef');
    $('formG').hidden=(m!=='g'); $('formEF').hidden=(m!=='ef');
    $('fotoLabel').innerHTML=m==='ef'?'Foto <span class="pf">* Pflicht – das ganze Fundament</span>':'Foto <span>– optional</span>';
    sel=null; formLeeren(); beruehrt=false;
    if(mini){ punkteLayer(); } autoWaehlen(); miniMalen(); standMalen();
    if(gross){ grossPunkte(); }
  };

  function bildLesen(datei,fertig){
    var img=new Image();
    img.onload=function(){
      var m=1400,w=img.width,h=img.height;
      if(w>m||h>m){ if(w>h){ h=Math.round(h*m/w); w=m; } else { w=Math.round(w*m/h); h=m; } }
      var c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      var d=c.toDataURL('image/jpeg',0.75); if(d.length>1300000) d=c.toDataURL('image/jpeg',0.6);
      URL.revokeObjectURL(img.src); fertig(d);
    };
    img.onerror=function(){ URL.revokeObjectURL(img.src); fertig(null); };
    img.src=URL.createObjectURL(datei);
  }
  function anhaengen(liste,ziel,malen){
    var f=Array.prototype.slice.call(liste||[]); if(!f.length) return;
    (function weiter(){
      if(!f.length){ malen(); return; }
      if(ziel.length>=MAX_FOTOS){ toast('Höchstens '+MAX_FOTOS+' Fotos',true); malen(); return; }
      bildLesen(f.shift(),function(d){ if(d) ziel.push(d); malen(); weiter(); });
    })();
  }
  function fotosMalen(){ $('prev').innerHTML=fotos.map(function(f,i){ return '<div class="pg"><button onclick="fotoWeg('+i+')">✕</button><img src="'+f+'" alt=""></div>'; }).join(''); }
  function bFotosMalen(){ $('bPrev').innerHTML=bFotos.map(function(f,i){ return '<div class="pg"><button onclick="bFotoWeg('+i+')">✕</button><img src="'+f+'" alt=""></div>'; }).join(''); }
  window.fotoWeg=function(i){ fotos.splice(i,1); fotosMalen(); };
  window.bFotoWeg=function(i){ bFotos.splice(i,1); bFotosMalen(); };
  ['fCam','fDat'].forEach(function(id){ $(id).addEventListener('change',function(){ beruehrt=true; anhaengen(this.files,fotos,fotosMalen); this.value=''; }); });
  ['bCam','bDat'].forEach(function(id){ $(id).addEventListener('change',function(){ anhaengen(this.files,bFotos,bFotosMalen); this.value=''; }); });

  function name(){ var v=$('fVon').value.trim(); if(!v){ toast('Bitte oben deinen Namen eintragen',true); $('fVon').focus(); window.scrollTo(0,0); return ''; }
    lsSet(LS_VON,v); return v; }
  function gpsFeld(rec){ if(gps){ rec.gps_lat=+gps.lat.toFixed(7); rec.gps_lon=+gps.lon.toFixed(7); rec.gps_acc=Math.round(gps.acc*10)/10;
    if(sel) rec.dist=Math.round(meter(gps,sel)*10)/10; } return rec; }

  window.speichern=function(){
    if(!sel){ toast('Kein Punkt gewählt',true); return; }
    var von=name(); if(!von) return;
    var text=$('fText').value.trim(), rec, artName=art();
    if(modusAkt==='g'){
      if(form.gew==null){ toast('Gewinde fehlt – 5.0, 6.35 oder nicht messbar',true); return; }
      if(form.gew===0 && !text){ toast('Nicht messbar: bitte kurz schreiben warum',true); $('fText').focus(); return; }
      rec={fid:sel.f, tisch:sel.tisch, fuss:sel.fuss, typ:sel.typ, bereich:sel.ber, gew:form.gew,
           schaden:form.schaden||'', kopfplatte:form.kopf||'', text:text, von:von, ts:Date.now(), datum:heute(), quelle:'inventur.html'};
    } else {
      if(form.eft==null){ toast('Typ fehlt',true); return; }
      if(!fotos.length){ toast('Foto vom Fundament fehlt',true); return; }
      rec={fid:sel.f, tisch:sel.tisch, fuss:sel.fuss, typ:sel.typ, bereich:sel.ber, ef_typ:form.eft, ef_label:efLabel(form.eft),
           nalpi_ef_typ:sel.eft, text:text, von:von, ts:Date.now(), datum:heute(), quelle:'inventur.html'};
    }
    var alt=ERL[artName][sel.f];
    if(alt && !confirm(sel.f+' ist schon erfasst ('+zeit(alt.ts||0)+', '+(alt.von||'')+').\nNochmals erfassen? Der neue Stand gilt.')) return;
    var f=sel.f;
    ablegen(artName,gpsFeld(rec),fotos.slice()).then(function(){
      toast('✔ '+f.replace('_',' ')+' gespeichert'+(netzAn()?'':' – offline, geht später raus'));
    });
    if(navigator.vibrate) navigator.vibrate(60);
    erledigtRechnen(); formLeeren(); beruehrt=false;
    if(auto){ var n=naechste(1,true)[0]; if(n && n.d<15) waehle(n.p,true); else kopfMalen(); } else kopfMalen();
    miniMalen(); standMalen();
  };

  /* ── Stand ── */
  function standMalen(){
    erledigtRechnen();
    var h=heute(), k=kandidaten(), e=ERL[art()], fertig=0, heuteN=0;
    k.forEach(function(p){ if(e[p.f]) fertig++; });
    for(var f in e){ if(e[f].datum===h) heuteN++; }
    var g5=0,g6=0,g0=0; if(modusAkt==='g') for(var f2 in ERL.pfaehle){ var gw=+ERL.pfaehle[f2].gew; if(gw===5) g5++; else if(gw===6.35) g6++; else g0++; }
    $('stand').innerHTML='<b>'+fertig+' / '+k.length+'</b> '+(modusAkt==='ef'?'Einzelfundamente':'Pfähle')+' erfasst · heute '+heuteN
      +(modusAkt==='g'?'<br>5.0 mm: '+g5+' · 6.35 mm: '+g6+' · nicht messbar: '+g0:'')
      +'<br><span class="sub">Daten Nalpi Stand '+esc(STAND.split('-').reverse().join('.'))+' – nur gebohrt/injiziert, ohne Primärkonstruktion.</span>';
  }
  function allesMalen(){ erledigtRechnen(); kopfMalen(); standMalen(); if(mini) punkteLayer(); miniMalen(); if(gross) grossPunkte(); if(!$('s-berg').hidden) bListe(); }

  /* ── Mini-Karte oben rechts + grosse Karte ── */
  var mini=null, miniPunkte=null, miniIch=null, miniKreis=null, miniSel=null, gross=null, grossLayer=null, grossIch=null, grossSel=null;
  function kachel(){ return L.tileLayer('https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.swissimage/default/current/3857/{z}/{x}/{y}.jpeg',
    {maxNativeZoom:20, maxZoom:22}); }
  function farbe(p){ return istErledigt(p)?'#1e9e5a':'#e08a00'; }
  function miniBauen(){
    if(mini||typeof L==='undefined') return;
    mini=L.map('miniMap',{zoomControl:false, attributionControl:false, dragging:false, scrollWheelZoom:false, doubleClickZoom:false,
      touchZoom:false, boxZoom:false, keyboard:false, tap:false, zoomSnap:0.5});
    kachel().addTo(mini);
    mini.setView([46.6375,8.769],18);
    punkteLayer();
    $('miniMap').addEventListener('click',grossAuf);
  }
  function punkteLayer(){
    if(!mini) return;
    if(miniPunkte) mini.removeLayer(miniPunkte);
    var cv=L.canvas({padding:.5}); miniPunkte=L.layerGroup();
    kandidaten().forEach(function(p){ L.circleMarker([p.lat,p.lon],{renderer:cv,radius:5,weight:1,color:'#fff',fillColor:farbe(p),fillOpacity:.95,interactive:false}).addTo(miniPunkte); });
    miniPunkte.addTo(mini);
  }
  function miniMalen(){
    if(!mini) return;
    var mitte=gps?[gps.lat,gps.lon]:(sel?[sel.lat,sel.lon]:null);
    if(gps){
      if(!miniIch){ miniKreis=L.circle([gps.lat,gps.lon],{radius:gps.acc,color:'#1565c0',weight:1,fillOpacity:.12,interactive:false}).addTo(mini);
        miniIch=L.circleMarker([gps.lat,gps.lon],{radius:6,color:'#fff',weight:2,fillColor:'#1565c0',fillOpacity:1,interactive:false}).addTo(mini); }
      miniIch.setLatLng([gps.lat,gps.lon]); miniKreis.setLatLng([gps.lat,gps.lon]); miniKreis.setRadius(Math.min(gps.acc,60));
    }
    if(sel){ if(!miniSel) miniSel=L.circleMarker([sel.lat,sel.lon],{radius:10,color:'#D72622',weight:3,fill:false,interactive:false}).addTo(mini);
      miniSel.setLatLng([sel.lat,sel.lon]); if(!mini.hasLayer(miniSel)) miniSel.addTo(mini); }
    else if(miniSel && mini.hasLayer(miniSel)) mini.removeLayer(miniSel);
    if(mitte) mini.setView(mitte, mini.getZoom()<17?19:mini.getZoom(), {animate:false});
  }
  window.grossAuf=function(){
    $('gross').classList.add('an');
    if(!gross){
      gross=L.map('grossMap',{zoomSnap:0.5, maxZoom:22}); gross.attributionControl.setPrefix(''); kachel().addTo(gross);
      L.control.scale({imperial:false, maxWidth:110}).addTo(gross);
      grossPunkte();
      var z=sel?[sel.lat,sel.lon]:(gps?[gps.lat,gps.lon]:null);
      if(z) gross.setView(z,19); else { var k=kandidaten(); if(k.length) gross.fitBounds(L.latLngBounds(k.map(function(p){ return [p.lat,p.lon]; })).pad(.05)); }
    }
    setTimeout(function(){ gross.invalidateSize(); grossMalen(); },60);
  };
  window.grossZu=function(){ $('gross').classList.remove('an'); };
  window.zuMir=function(){ if(!gps){ toast('Noch kein GPS',true); return; } gross.setView([gps.lat,gps.lon],Math.max(gross.getZoom(),19)); };
  function grossPunkte(){
    if(!gross) return;
    if(grossLayer) gross.removeLayer(grossLayer);
    var cv=L.canvas({padding:.4}); grossLayer=L.layerGroup();
    kandidaten().forEach(function(p){
      var m=L.circleMarker([p.lat,p.lon],{renderer:cv,radius:7,weight:1.5,color:'#fff',fillColor:farbe(p),fillOpacity:.95});
      m.on('click',function(){ waehle(p,false); grossZu(); toast(p.tisch+' '+p.fuss+' gewählt'); });
      m.addTo(grossLayer);
    });
    grossLayer.addTo(gross);
    $('grossTitel').textContent=(modusAkt==='ef'?'Einzelfundament':'Pfahl')+' antippen';
  }
  function grossMalen(){
    if(!gross) return;
    if(gps){ if(!grossIch) grossIch=L.circleMarker([gps.lat,gps.lon],{radius:7,color:'#fff',weight:2,fillColor:'#1565c0',fillOpacity:1,interactive:false}).addTo(gross);
      grossIch.setLatLng([gps.lat,gps.lon]); }
    if(sel){ if(!grossSel) grossSel=L.circleMarker([sel.lat,sel.lon],{radius:12,color:'#D72622',weight:3,fill:false,interactive:false}).addTo(gross);
      grossSel.setLatLng([sel.lat,sel.lon]); }
  }

  /* ── Berg ── */
  window.bSetze=function(k,v){ bForm[k]=(bForm[k]===v && k!=='kat' && k!=='einh')?null:v; bMalen(); };
  function bMalen(){
    [['bKat','kat'],['bTeil','teil'],['bTyp','typ'],['bSerie','serie'],['bEinh','einh']].forEach(function(x){
      Array.prototype.forEach.call($(x[0]).querySelectorAll('button'),function(b){ b.classList.toggle('on', bForm[x[1]]===b.getAttribute('data-v')); });
    });
    var nt=bForm.kat==='normteil'; $('bNormteil').hidden=!nt; $('bBez').hidden=nt;
    var lab={passstueck:['Passstück: Tisch + Fuss oder Nummer','z.B. 707 S2 oder PS 2227'],schrauben:['Schraube / Mutter / Scheibe','z.B. M24 × 120 8.8'],
             sonstiges:['Was ist es?','z.B. Plikarohr DN60, Kabelschutz …']}[bForm.kat];
    if(lab){ $('bBezLabel').innerHTML=esc(lab[0])+' <span class="pf">*</span>'; $('bBezText').placeholder=lab[1]; }
  }
  window.bZahl=function(d){ var n=Math.max(0,(parseInt($('bAnz').value,10)||0)+d); $('bAnz').value=n; if(navigator.vibrate) navigator.vibrate(12); };
  window.bSpeichern=function(){
    var von=name(); if(!von) return;
    var anz=parseInt($('bAnz').value,10); if(!(anz>=0)){ toast('Anzahl fehlt',true); return; }
    var rec={kat:bForm.kat, anzahl:anz, einheit:bForm.einh||'Stk', ort:$('bOrt').value.trim(), text:$('bText').value.trim(),
             von:von, ts:Date.now(), datum:heute(), quelle:'inventur.html'};
    if(bForm.kat==='normteil'){
      if(!bForm.teil){ toast('Welches Teil?',true); return; }
      rec.teil=bForm.teil; rec.typ=bForm.typ||''; rec.serie=bForm.serie||'';
      rec.bez=bForm.teil+(rec.typ?' '+rec.typ:'')+(rec.serie?'_'+rec.serie:'');
    } else {
      rec.bez=$('bBezText').value.trim(); if(!rec.bez){ toast('Bezeichnung fehlt',true); $('bBezText').focus(); return; }
    }
    lsSet(LS_ORT,rec.ort);
    if(gps){ rec.gps_lat=+gps.lat.toFixed(7); rec.gps_lon=+gps.lon.toFixed(7); rec.gps_acc=Math.round(gps.acc*10)/10; }
    ablegen('berg',rec,bFotos.slice()).then(function(){ toast('✔ '+rec.anzahl+' '+rec.einheit+' '+rec.bez+(netzAn()?'':' – offline gespeichert')); bListe(); });
    bFotos=[]; bFotosMalen(); $('bText').value=''; $('bBezText').value=''; $('bAnz').value=1;
    if(navigator.vibrate) navigator.vibrate(60);
  };
  function bListe(){
    var a=Object.keys(R.berg).map(function(k){ return R.berg[k]; }).filter(Boolean).sort(function(x,y){ return (y.ts||0)-(x.ts||0); });
    $('bListe').innerHTML=a.length?a.slice(0,60).map(function(e){
      return '<div><b>'+esc(e.anzahl)+' '+esc(e.einheit||'Stk')+'</b> · '+esc(e.bez||'')+(e.ort?' <small>· '+esc(e.ort)+'</small>':'')
        +'<br><small>'+esc(zeit(e.ts||0))+' · '+esc(e.von||'')+(e.anzahl_fotos?' · 📷 '+e.anzahl_fotos:'')+(e._wartet?' · wartet aufs Netz':'')+'</small></div>';
    }).join(''):'<div class="sub">Noch nichts erfasst.</div>';
  }

  /* ── CSV (letzter Stand je Punkt) ── */
  function csvLaden(name,zeilen){
    var txt='﻿'+zeilen.map(function(z){ return z.map(function(v){ v=v==null?'':String(v); return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(';'); }).join('\r\n');
    var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
    a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
  }
  window.csvPerimeter=function(){
    erledigtRechnen();
    var z=[['Art','Punkt','Tisch','Fuss','Typ','Bereich','Gewinde_mm','Schaden','Pfahlkopfplatte','EF_Typ','EF_Nalpi','Bemerkung','Fotos','Von','Datum','Zeit','GPS_m','Abstand_m']];
    [['pfaehle','Pfahl'],['fundamente','Einzelfundament']].forEach(function(x){
      Object.keys(ERL[x[0]]).sort().forEach(function(f){ var e=ERL[x[0]][f];
        z.push([x[1],f,e.tisch,e.fuss,e.typ,e.bereich,e.gew==null?'':(+e.gew?e.gew:'nicht messbar'),e.schaden,e.kopfplatte,e.ef_label||'',
          e.nalpi_ef_typ==null?'':efLabel(e.nalpi_ef_typ),e.text,e.anzahl_fotos||0,e.von,e.datum,zeit(e.ts||0).slice(-5),e.gps_acc,e.dist]); });
    });
    csvLaden('Inventur_Perimeter_'+heute()+'.csv',z);
  };
  window.csvBerg=function(){
    var z=[['Kategorie','Bezeichnung','Teil','Typ','Serie','Anzahl','Einheit','Lagerort','Bemerkung','Fotos','Von','Datum','Zeit']];
    Object.keys(R.berg).map(function(k){ return R.berg[k]; }).sort(function(a,b){ return (a.ts||0)-(b.ts||0); }).forEach(function(e){
      z.push([e.kat,e.bez,e.teil,e.typ,e.serie,e.anzahl,e.einheit,e.ort,e.text,e.anzahl_fotos||0,e.von,e.datum,zeit(e.ts||0).slice(-5)]); });
    csvLaden('Inventur_Berg_'+heute()+'.csv',z);
  };

  /* ── Start ── */
  $('fVon').value=lsGet(LS_VON,''); $('bOrt').value=lsGet(LS_ORT,'');
  $('fVon').addEventListener('change',function(){ lsSet(LS_VON,this.value.trim()); });
  auto=lsGet(LS_AUTO,'1')!=='0'; $('autoBtn').classList.toggle('on',auto); $('autoBtn').textContent=auto?'an':'aus';
  bMalen(); cacheLesen();
  var start=(location.hash||'').replace('#','');
  laden().catch(function(){ toast('Daten nicht geladen – einmal mit Netz öffnen',true); })
    .then(function(){ return warteMischen(); })
    .then(function(){ miniBauen(); modus(lsGet(LS_MODUS,'g')==='ef'?'ef':'g'); netzMalen(); if(start==='berg'||start==='tal') reiter(start); })
    .then(function(){ return serverLaden(); })
    .then(function(){ return warteMischen(); })
    .then(function(){ allesMalen(); senden(); });
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
